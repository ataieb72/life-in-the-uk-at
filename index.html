<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2340">
<title>Life in the UK — Study App</title>
<style>
/* ============ Design tokens: British-government-inspired ============ */
:root{
  --navy:#0b2340; --navy-2:#12355f; --red:#c8102e; --red-soft:#e8546b;
  --bg:#f4f6f9; --card:#ffffff; --ink:#1a2430; --ink-2:#54637a; --line:#dde4ee;
  --ok:#1a7f4b; --warn:#b0641a; --gold:#d4a72c;
  --shadow:0 1px 3px rgba(11,35,64,.10),0 4px 14px rgba(11,35,64,.06);
  --radius:14px;
}
[data-theme="dark"]{
  --navy:#0b2340; --navy-2:#0e2a4d; --red:#ff5c72; --red-soft:#ff8496;
  --bg:#0d1520; --card:#152238; --ink:#e8eef7; --ink-2:#9fb0c7; --line:#25344d;
  --ok:#4cc98a; --warn:#e0a35a; --gold:#e3bd55;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:76px}
h1,h2,h3,h4{line-height:1.25;margin:.4em 0}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;min-height:44px;min-width:44px}
a{color:var(--red)}
.hidden{display:none!important}
/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 14px calc(10px + 0px);display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.topbar .crown{font-size:20px}
.topbar h1{font-size:17px;margin:0;font-weight:650;flex:1;letter-spacing:.2px}
.topbar .sub{display:block;font-size:11px;font-weight:400;opacity:.75}
.iconbtn{background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:0 12px;min-height:40px}
.iconbtn:active{background:rgba(255,255,255,.25)}
/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;background:none;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;border-radius:0;position:relative}
nav.bottom button .ic{font-size:20px;line-height:1}
nav.bottom button.active{color:var(--red);font-weight:650}
nav.bottom .badge{position:absolute;top:4px;right:calc(50% - 26px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:18px;height:18px;line-height:18px;padding:0 4px;font-weight:700}
main{max-width:760px;margin:0 auto;padding:14px 14px 30px}
/* cards & tiles */
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.tile h3{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:750;color:var(--navy)}
[data-theme="dark"] .stat .n{color:#fff}
.stat .l{font-size:12px;color:var(--ink-2)}
.btn{background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;width:100%;margin-top:8px}
.btn:active{transform:scale(.985)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.small{width:auto;padding:8px 14px;min-height:40px;font-size:14px;margin:4px 4px 0 0}
.pbar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-2),var(--red));border-radius:5px;transition:width .4s}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;margin:3px 4px 0 0;color:var(--ink-2)}
.chip.done{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.mock-chip{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip.mock-chip:hover{border-color:var(--navy)}
.chip.mock-chip.done{background:rgba(26,127,74,.15);border-color:transparent;color:var(--ok)}
.muted{color:var(--ink-2);font-size:13.5px}
/* reader */
.crumb{font-size:13px;color:var(--ink-2);margin:6px 0}
.crumb a{color:var(--red);text-decoration:none;font-weight:600}
.readbody p{margin:.75em 0;font-size:16.5px}
.readbody h4{color:var(--navy);font-size:16px;text-transform:none;margin:1.2em 0 .3em;border-left:4px solid var(--red);padding-left:9px}
[data-theme="dark"] .readbody h4{color:#cfe0f5}
.readbody mark{background:rgba(212,167,44,.35);color:inherit;border-radius:3px;padding:0 2px}
.infobox,.checkbox-box{border-radius:var(--radius);padding:14px 16px;margin:14px 0}
.infobox{background:rgba(18,53,95,.07);border:1px solid rgba(18,53,95,.25)}
[data-theme="dark"] .infobox{background:rgba(120,170,255,.08);border-color:rgba(120,170,255,.25)}
.infobox b,.checkbox-box b{display:block;margin-bottom:6px;font-size:13px;letter-spacing:.4px;text-transform:uppercase}
.infobox ul,.checkbox-box ul{margin:4px 0 2px;padding-left:20px}
.checkbox-box{background:rgba(200,16,46,.06);border:1.5px solid rgba(200,16,46,.35)}
.checkbox-box b{color:var(--red)}
.seclist button,.chlist button{display:flex;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:8px 0;align-items:center;gap:12px;box-shadow:var(--shadow);color:var(--ink)}
.chlist .num{background:var(--navy);color:#fff;border-radius:10px;min-width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:700}
.chlist .t{flex:1}.chlist .t small{display:block;color:var(--ink-2)}
.lock{opacity:.55}
/* flashcards */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 20px;min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;margin:14px 0;position:relative}
.fcard .topic{position:absolute;top:12px;left:14px;font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px}
.fcard .newtag{position:absolute;top:12px;right:14px;font-size:11px;color:var(--gold);font-weight:700}
.fcard .q{font-size:19px;font-weight:650}
.fcard .a{font-size:16.5px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rate button{padding:8px 2px;border-radius:10px;color:#fff;font-weight:700;display:flex;flex-direction:column;min-height:54px;align-items:center;justify-content:center}
.rate button small{font-weight:500;font-size:9.5px;opacity:.9}
.r0{background:#8c1220}.r1{background:#b0332c}.r2{background:#b0641a}.r3{background:#8a7a1c}.r4{background:#3d7d46}.r5{background:#1a7f4b}
/* test */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:8px 0;color:var(--ink);font-size:15.5px}
.opt.sel{border-color:var(--navy);background:rgba(18,53,95,.08)}
[data-theme="dark"] .opt.sel{background:rgba(120,170,255,.12)}
.opt.right{border-color:var(--ok);background:rgba(26,127,75,.12)}
.opt.wrong{border-color:var(--red);background:rgba(200,16,46,.10)}
.qnum{font-size:13px;color:var(--ink-2);font-weight:600}
.result-big{font-size:44px;font-weight:800;text-align:center;margin:6px 0}
.pass{color:var(--ok)}.fail{color:var(--red)}
/* search */
.searchbar{display:flex;gap:8px;margin:10px 0}
.searchbar input{flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.sres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.sres .where{font-size:12px;color:var(--red);font-weight:700}
textarea{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font:inherit}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);z-index:50;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.flag{height:4px;background:linear-gradient(90deg,#012169 33%,#fff 33%,#fff 40%,#C8102E 40%,#C8102E 60%,#fff 60%,#fff 67%,#012169 67%)}
@media(min-width:640px){ .grid2{grid-template-columns:repeat(4,1fr)} }
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="flag" aria-hidden="true"></div>
<header class="topbar">
  <span class="crown" aria-hidden="true">👑</span>
  <h1>Life in the UK<span class="sub">Official handbook study app — 3rd edition</span></h1>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark or light mode">◐</button>
</header>
<main id="view" aria-live="polite"></main>
<nav class="bottom" aria-label="Main navigation">
  <button data-v="read"><span class="ic">📖</span>Read</button>
  <button data-v="cards"><span class="ic">🗂️</span>Practice<span class="badge hidden" id="dueBadge"></span></button>
  <button data-v="test"><span class="ic">📝</span>Mocks</button>
  <button data-v="prog"><span class="ic">📊</span>Progress</button>
  <button data-v="dash"><span class="ic">🏠</span>Home</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* =====================================================================
   DATA — the complete handbook, extracted verbatim from the official PDF
   "Life in the UK: A guide for new residents — 3rd Edition".
   HANDBOOK.chapters[…]:
     ch1 = The values and principles of the UK  (source pages 4–7)
     ch2 = What is the UK                       (source pages 8–9)
     ch3 = A long and illustrious history       (source pages 10–42;
           sections re-ordered chronologically for reading:
           Early Britain → Middle Ages → Tudors & Stuarts →
           A global power → The 20th century → Britain since 1945)
     ch4 = A modern, thriving society           (source pages 43–71)
     ch5 = The UK Government, the law, your role(source pages 72–95)
     ch6 = Summary — sources + Key Material and Facts (pages 96–98)
   Block types: p = paragraph · infohead/info = "IN THIS CHAPTER…" list
   · checkhead/check = "Check that you understand" boxes.
   ===================================================================== */
const HANDBOOK = {"title": "Life in the UK: A guide for new residents – 3rd Edition", "chapters": [{"num": 1, "title": "The values and principles of the UK", "sections": [{"id": "1.1", "title": "Chapter 1: The values and principles of the UK", "blocks": [{"t": "p", "x": "In this chapter you will learn about the fundamental rights and responsibilities which apply to everyone who lives in the UK, citizen or not. There is also some information about the format of the Life in the UK Test and the requirements for becoming a permanent resident."}, {"t": "p", "x": "The questions you get in the real test will be based on the whole book, including this introductory chapter so make sure that you are familiar with the details of the application process for permanent residence as well as the rights and responsibilities of UK residents."}, {"t": "infohead", "x": "IN THIS CHAPTER THERE IS INFORMATION ABOUT:"}, {"t": "info", "x": "The fundamental principles of British life"}, {"t": "info", "x": "Responsibilities and freedoms of all UK residents"}, {"t": "info", "x": "Becoming a permanent resident"}, {"t": "info", "x": "Taking the Life in the UK test"}, {"t": "info", "x": "The testable sections of this book"}, {"t": "info", "x": "Britain is a fantastic place to live: a modern, thriving society with a long and illustrious history. Our people have been at the heart of the world’s political, scientific, industrial and cultural development. We are proud of our record of welcoming new migrants who will add to the diversity and dynamism of our national life."}, {"t": "info", "x": "Applying to become a permanent resident or citizen of the UK is an important decision and commitment. You will be agreeing to accept the responsibilities which go with permanent residence and to respect the laws, values and traditions of the UK. Good citizens are an asset to the UK. We welcome those seeking to make a positive contribution to our society."}, {"t": "info", "x": "Passing the Life in the UK test is part of demonstrating that you are ready to become a permanent migrant to the UK. This handbook is designed to support you in your preparation. It will help you to integrate into society and play a full role in your local community. It will also help ensure that you have a broad general knowledge of the culture, laws and history of the UK."}]}, {"id": "1.2", "title": "Becoming a permanent resident", "blocks": [{"t": "p", "x": "To apply to become a permanent resident or citizen of the UK, you will need to: speak and read English have a good understanding of life in the UK."}, {"t": "p", "x": "There are currently (as of January 2013) two ways you can be tested on these requirements:"}, {"t": "p", "x": "Take the Life in the UK test. The questions are written in a way that requires an understanding of the English language at English for Speakers of Other Languages (ESOL) Entry Level 3, so there is no need to take a separate English language test. People here on work visas, including those on Tier 1 and Tier 2 of the points based system, normally must pass the Life in the UK test to become permanent residents."}, {"t": "p", "x": "Pass an ESOL course in English with Citizenship. You will need to take this course if your standard of English is below ESOL Entry Level 3. The course will help you to improve your English and learn more about life in the UK. At the end of the course you will take a test."}, {"t": "p", "x": "Once you have passed one of these tests, you can make an application for permanent residence or British citizenship. The form that you have to complete and the evidence that you need to provide will depend on your personal circumstances. There is a fee for submitting an application, which is different for the various types of application. All of the forms and a list of fees can be found on the UK Border Agency website, www.ukba.homeoffice.gov.uk. From October 2013, the requirements will change. From that date, for settlement or permanent residence, you will need to:"}, {"t": "p", "x": "Pass the Life in the UK test"}, {"t": "p", "x": "AND"}, {"t": "p", "x": "Produce acceptable evidence of speaking and listening skills in English at B1 of the Common European Framework of Reference. This is equivalent to ESOL Entry Level 3."}, {"t": "p", "x": "The requirements for citizenship applications may also change in the future. Further details will be published on the UK Border Agency website and you should check the information on that website for current requirements before applying for settlement or citizenship."}]}, {"id": "1.3", "title": "The values and principles of the UK", "blocks": [{"t": "p", "x": "British society is founded on fundamental values and principles which all those living in the UK should respect and support. These values are reflected in the responsibilities, rights and privileges of being a British citizen or permanent resident of the UK. They are based on history and traditions and are protected by law, customs and expectations. There is no place in British society for extremism or intolerance."}, {"t": "p", "x": "The fundamental principles of British life include:"}, {"t": "p", "x": "Democracy"}, {"t": "p", "x": "The rule of law"}, {"t": "p", "x": "Individual liberty"}, {"t": "p", "x": "Tolerance of those with different faiths and beliefs"}, {"t": "p", "x": "Participation in community life."}, {"t": "p", "x": "As part of the citizenship ceremony, new citizens pledge to uphold these values. The pledge is:"}, {"t": "p", "x": "‘I will give my loyalty to the United Kingdom and respect its rights and freedoms. I will uphold its democratic values. I will observe its laws faithfully and fulfil my duties and obligations as a British citizen.’"}, {"t": "p", "x": "Folowing from the fundamental principles are responsibilities and freedoms which are shared by all those living in the UK and which we expect all residents to respect."}, {"t": "p", "x": "If you wish to be a permanent resident or citizen of the UK, you should: respect and obey the law respect the rights of others, including their right to their own opinions treat others with fairness look after yourself and your family look after the area in which you live and the environment."}, {"t": "p", "x": "In return, the UK offers: freedom of belief and religion freedom of speech freedom from unfair discrimination a right to a fair trial a right to join in the election of a government."}]}, {"id": "1.4", "title": "Taking the Life in the UK test", "blocks": [{"t": "p", "x": "This handbook will help prepare you for taking the Life in the UK test. The test consists of 24 questions about important aspects of life in the UK. Questions are based on ALL parts of the handbook. The 24 questions will be different for each person taking the test at that test session."}, {"t": "p", "x": "The Life in the UK test is usually taken in English, although special arrangements can be made if you wish to take it in Welsh or Scottish Gaelic."}, {"t": "p", "x": "You can only take the test at a registered and approved Life in the UK test centre. There are about 60 test centres around the UK. You can only book your test online, at www.lifeintheuktest.gov.uk. You should not take your test at any other establishment as the UK Border Agency will only accept certificates from registered test centres. If you live on the Isle of Man or in the Channel Islands, there are different arrangements for taking the Life in the UK test."}, {"t": "p", "x": "When booking your test, read the instructions carefully. Make sure you enter your details correctly. You will need to take some identification and proof of your address with you to the test. If you don’t take these, you will not be able to take the test."}, {"t": "p", "x": "How to use this handbook"}, {"t": "p", "x": "Everything that you will need to know to pass the Life in the UK test is included in this handbook. The questions will be based on the whole book, including this introduction, so make sure you study the entire book thoroughly. The handbook has been written to ensure that anyone who can read English at ESOL Entry Level 3 or above should have no difficulty with the language."}, {"t": "p", "x": "The glossary at the back of the handbook contains some key words and phrases, which you might find helpful."}, {"t": "p", "x": "The 'Check that you understand' boxes are for guidance. They will help you to identify particular things that you should understand. Just knowing the things highlighted in these boxes will not be enough to pass the test. You need to make sure that you understand everything in the book, so please read the information carefully."}, {"t": "p", "x": "Where to find more information"}, {"t": "p", "x": "You can find out more information from the following places:"}, {"t": "p", "x": "The UK Border Agency website (www.ukba.homeoffice.gov.uk) for more information about the application process and the forms you will need to complete The Life in the UK test website (www.lifeintheuktest.gov.uk) for more information about the test and how to book a place to take one Gov.uk (www.gov.uk) for information about ESOL courses and how to find one in your area."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The origin of the values underlying British society"}, {"t": "check", "x": "The fundamental principles of British life"}, {"t": "check", "x": "The responsibilities and freedoms which come with permanent residence"}, {"t": "check", "x": "The process of becoming a permanent resident or citizen."}]}]}, {"num": 2, "title": "What is the UK", "sections": [{"id": "2.1", "title": "Chapter 2: What is the UK?", "blocks": [{"t": "p", "x": "In this chapter you will learn about the countries that make up the Union as well as the various phrases used to describe them. Although this chapter is very short you should make sure that you read and understand all facts presented. For instance it is very likely there will be questions about the differences between Great Britain, the British Isles and Britain, or what the Crown Dependencies are."}, {"t": "infohead", "x": "IN THIS CHAPTER THERE IS INFORMATION ABOUT:"}, {"t": "info", "x": "The different countries that make up the UK"}]}, {"id": "2.2", "title": "What is the UK?", "blocks": [{"t": "p", "x": "The countries that make up the UK: England, Scotland, Wales and Northern Ireland"}, {"t": "p", "x": "The UK is made up of England, Scotland, Wales and Northern Ireland. The rest of Ireland is an independent country."}, {"t": "p", "x": "The official name of the country is the United Kingdom of Great Britain and Northern Ireland. ‘Great Britain’ refers only to England, Scotland and Wales, not to Northern Ireland. The words ‘Britain’,  Isles’ or ‘British’, however, are used in this book to refer to everyone in the UK."}, {"t": "p", "x": "There are also several islands which are closely linked with the UK but are not part of it: the Channel Islands and the Isle of Man. These have their own governments and are called ‘Crown dependencies’. There are also several British overseas territories in other parts of the world, such as St Helena and the Falkland Islands. They are also linked to the UK but are not a part of it."}, {"t": "p", "x": "The UK is governed by the parliament sitting in Westminster. Scotland, Wales and Northern Ireland also have parliaments or assemblies of their own, with devolved powers in defined areas."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The different countries that make up the UK"}]}]}, {"num": 3, "title": "A long and illustrious history", "sections": [{"id": "3.1", "title": "Chapter 3: A long and illustrious history", "blocks": [{"t": "p", "x": "In this chapter you will learn about British history starting from the Stone Age. The beginning focuses on arriving populations which affected the language and religions of Britain. After that the focus is on the development of the Monarchy, church and Parliament. Major battles and significant periods are covered, including the civil war, the industrial revolution and the Empire. There is a lot of information about WWI and WWII and after WWII the chapter focuses on the governments of the UK and devolution in Northern Ireland, Wales and Scotland."}, {"t": "p", "x": "Make sure that you understand the relationship between the monarchy and Parliament, Protestants and Catholics and Britain and the colonies of the Empire. Think about how the right to vote developed. You should also make sure you know about each of the people described. You will need to know about the Acts of Parliament and other major events. You should make sure that you know all of the dates given in this chapter."}, {"t": "infohead", "x": "IN THIS CHAPTER THERE IS INFORMATION ABOUT:"}, {"t": "info", "x": "The history of early Britain"}, {"t": "info", "x": "The medieval period"}, {"t": "info", "x": "The Tudor and Stuart monarchs of the UK"}, {"t": "info", "x": "The establishment of Parliament"}, {"t": "info", "x": "The unification of the United Kingdom"}, {"t": "info", "x": "The Enlightenment and Industrial Revolution"}, {"t": "info", "x": "The Victorian Age and the British Empire"}, {"t": "info", "x": "The First World War"}, {"t": "info", "x": "The Great Depression"}, {"t": "info", "x": "The Second World War"}, {"t": "info", "x": "Britain since 1945 and the welfare state"}, {"t": "info", "x": "Great British inventions and sporting figures"}, {"t": "info", "x": "Government since the Second World War"}]}, {"id": "3.7", "title": "Early Britain", "blocks": [{"t": "p", "x": "The first people to live in Britain were hunter-gatherers, in what we call the Stone Age. For much of the Stone Age, Britain was connected to the continent by a land bridge. People came and went, following the herds of deer and horses which they hunted. Britain only became permanently separated from the continent by the Channel about 10,000 years ago."}, {"t": "p", "x": "The first farmers arrived in Britain about 6,000 years ago. The ancestors of these first farmers probably came from south-east Europe. These people built houses, tombs and monuments on the land. One of these monuments, Stonehenge, still stands in what is now the English county of Wiltshire. Stonehenge was probably a special gathering place for seasonal ceremonies. Other Stone Age sites have also survived. Skara Brae on Orkney, off the north coast of Scotland, is the best preserved prehistoric village in northern Europe, and has helped archaeologists to understand more about how people lived near the end of the Stone Age."}, {"t": "p", "x": "Stonehenge"}, {"t": "p", "x": "Around 4,000 years ago, people learned to make bronze. We call this period the Bronze Age. People lived in roundhouses and buried their dead in tombs called round barrows. The people of the Bronze Age were accomplished metalworkers who made many beautiful objects in bronze and gold, including tools, ornaments and weapons. The Bronze Age was followed by the Iron Age, when people learned how to make weapons and tools out of iron. People still lived in roundhouses, grouped together into larger settlements, and sometimes defended sites called hill forts. A very impressive hill fort can still be seen today at Maiden Castle, in the English county of Dorset. Most people were farmers, craft workers or warriors. The language they spoke was part of the Celtic language family. Similar languages were spoken across Europe in the Iron Age, and related languages are still spoken today in some parts of Wales, Scotland and Ireland. The people of the Iron Age had a sophisticated culture and economy. They made the first coins to be minted in Britain, some inscribed with the names of Iron Age kings. This marks the beginnings of British history."}, {"t": "p", "x": "The Romans"}, {"t": "p", "x": "Julius Caesar led a Roman invasion of Britain in 55 BC. This was unsuccessful and for nearly 100 years Britain remained separate from the Roman Empire. In AD 43 the Emperor Claudius led the Roman army in a new invasion. This time, there was resistance from some of the British tribes but the Romans were successful in occupying almost all of Britain. One of the tribal leaders who fought against the Romans was Boudicca, the queen of the Iceni in what is now eastern England. She is still remembered today and there is a statue of her on Westminster Bridge in London, near the Houses of Parliament."}, {"t": "p", "x": "Areas of what is now Scotland were never conquered by the Romans, and the Emperor Hadrian built a wall in the north of England to keep out the Picts (ancestors of the Scottish people). Included in the wall were a number of forts. Parts of Hadrian’s Wall, including the forts of Housesteads and Vindolanda, can still be seen. It is a popular area for walkers and is a UNESCO (United Nations Education, Scientific and Cultural Organization) World Heritage Site."}, {"t": "p", "x": "Hadrians wall"}, {"t": "p", "x": "The Romans remained in Britain for 400 years. They built roads and public buildings, created a structure of law, and introduced new plants and animals. It was during the 3rd and 4th centuries AD that the first Christian communities began to appear in Britain."}, {"t": "p", "x": "The Anglo-Saxons"}, {"t": "p", "x": "The Roman army left Britain in AD 410 to defend other parts of the Roman Empire and never returned. Britain was again invaded by tribes from northern Europe: the Jutes, the Angles and the Saxons. The languages they spoke are the basis of modern-day English. Battles were fought against these invaders but, by about AD 600, Anglo-Saxon kingdoms were established in Britain. These kingdoms were mainly in what is now England. The burial place of one of the kings was at Sutton Hoo in modern Suffolk. This king was buried with treasure and armour, all placed in a ship which was then covered by a mound of earth. Parts of the west of Britain, including much of what is now Wales, and Scotland, remained free of Anglo-Saxon rule."}, {"t": "p", "x": "The Anglo-Saxons were not Christians when they first came to Britain but, during this period, missionaries came to Britain to preach about Christianity."}, {"t": "p", "x": "Missionaries from Ireland spread the religion in the north. The most famous of these were St Patrick, who would become the patron saint of Ireland and St Columba, who founded a monastery on the island of Iona, off the coast of what is now Scotland. St Augustine led missionaries from Rome, who spread Christianity in the south. St Augustine became the first Archbishop of Canterbury."}, {"t": "p", "x": "The Vikings"}, {"t": "p", "x": "Modern representation of the Vikings: people dressed as Vikings"}, {"t": "p", "x": "The Vikings came from Denmark and Norway. They first visited Britain in AD 789 to raid coastal towns and take away goods and slaves. Then, they began to stay and form their own communities in the east of England and Scotland. The Anglo-Saxon kingdoms in England united under King Alfred the Great, who defeated the Vikings. Many of the Viking invaders stayed in Britain – especially in the east and north of England, in an area known as the Danelaw (many places names there, such as Grimsby and Scunthorpe, come from the Viking languages). The Viking settlers mixed with local communities and some converted to Christianity."}, {"t": "p", "x": "Anglo-Saxon kings continued to rule what is now England, except for a short period when there were Danish kings. The first of these was Cnut, also called Canute."}, {"t": "p", "x": "In the north, the threat of attack by Vikings had encouraged the people to unite under one king, Kenneth MacAlpin. The term Scotland began to be used to describe that country."}, {"t": "p", "x": "The Norman Conquest"}, {"t": "p", "x": "In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings."}, {"t": "p", "x": "Harold was killed in the battle. William became king of England and is known as William the Conqueror. The battle is commemorated in a great piece of embroidery, known as the Bayeux Tapestry, which can still be seen in France today."}, {"t": "p", "x": "The Norman Conquest was the last successful foreign invasion of England and led to many changes in government and social structures in England. Norman French, the language of the new ruling class, influenced the development of the English language as we know it today. Initially the Normans also conquered Wales, but the Welsh gradually won territory back. The Scots and the Normans fought on the border between England and Scotland; the Normans took over some land on the border but did not invade Scotland."}, {"t": "p", "x": "Bayeux Tapestry"}, {"t": "p", "x": "William sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book. It still exists today and gives a picture of society in England just after the Norman Conquest."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The history of the UK before the Romans"}, {"t": "check", "x": "The impact of the Romans on British society"}, {"t": "check", "x": "The different groups that invaded after the Romans"}, {"t": "check", "x": "The importance of the Norman invasion in 1066"}]}, {"id": "3.5", "title": "The Middle Ages", "blocks": [{"t": "p", "x": "War at home and abroad"}, {"t": "p", "x": "The period after the Norman Conquest up until about 1485 is called the Middle Ages (or the medieval period). It was a time of almost constant war."}, {"t": "p", "x": "The English kings fought with the Welsh, Scottish and Irish noblemen for control of their lands. In Wales, the English were able to establish their rule. In 1284 King Edward I of England introduced the Statute of Rhuddlan, which annexed Wales to the Crown of England. Huge castles, including Conwy and Caernarvon, were built to maintain this power. By the middle of the 15th century the last Welsh rebellions had been defeated. English laws and the English language were introduced."}, {"t": "p", "x": "Conwy Castle"}, {"t": "p", "x": "In Scotland, the English kings were less successful. In 1314 the Scottish, led by Robert the Bruce, defeated the English at the Battle of Bannockburn, and Scotland remained unconquered by the English."}, {"t": "p", "x": "At the beginning of the Middle Ages, Ireland was an independent country. The English first went to Ireland as troops to help the Irish king and remained to build their own settlements. By 1200, the English ruled an area of Ireland known as the Pale, around Dublin. Some of the important lords in other parts of Ireland accepted the authority of the English king."}, {"t": "p", "x": "During the Middle Ages, the English kings also fought a number of wars abroad. Many knights took part in the Crusades, in which European Christians fought for control of the Holy Land. English kings also fought a long war with France, called the Hundred Years War (even though it actually lasted 116 years). One of the most famous battles of the Hundred Years War was the Battle of Agincourt in 1415, where King Henry V’s vastly outnumbered English army defeated the French."}, {"t": "p", "x": "The English left France in the 1450s."}, {"t": "p", "x": "The Black Death"}, {"t": "p", "x": "The Normans used a system of land ownership known as feudalism. The king gave land to his lords in return for help in war. Landowners had to send certain numbers of men to serve in the army. Some peasants had their own land but most were serfs."}, {"t": "p", "x": "They had a small area of their lord’s land where they could grow food. In return, they had to work for their lord and could not move away. The same system developed in southern Scotland. In the north of Scotland and Ireland, land was owned by members of the ‘clans’ (prominent families)."}, {"t": "p", "x": "In 1348, a disease, probably a form of plague, came to Britain. This was known as the Black Death. One third of the population of England died and a similar proportion in Scotland and Wales. This was one of the worst disasters ever to strike Britain. Following the Black Death, the smaller population meant there was less need to grow cereal crops. There were labour shortages and peasants began to demand higher wages. New social classes appeared, including owners of large areas of land (later called the gentry), and people left the countryside to live in the towns. In the towns, growing wealth led to the development of a strong middle class."}, {"t": "p", "x": "In Ireland, the Black Death killed many in the Pale and, for a time, the area controlled by the English became smaller."}, {"t": "p", "x": "Legal and political changes"}, {"t": "p", "x": "In the Middle Ages, Parliament began to develop into the institution it is today. Its origins can be traced to the king’s council of advisers, which included important noblemen and the leaders of the Church."}, {"t": "p", "x": "There were few formal limits to the king’s power until 1215. In that year, King John was forced by his noblemen to agree to a number of demands. The result was a charter of rights called the Magna Carta (which means the Great Charter). The Magna Carta established the idea that even the king was subject to the law. It protected the rights of the nobility and restricted the king’s power to collect taxes or to make or change laws. In future, the king would need to involve his noblemen in decisions."}, {"t": "p", "x": "In England, parliaments were called for the king to consult his nobles, particularly when the king needed to raise money. The numbers attending Parliament increased and two separate parts, known as Houses, were established. The nobility, great landowners and bishops sat in the House of Lords. Knights, who were usually smaller landowners, and wealthy people from towns and cities were elected to sit in the House of Commons. Only a small part of the population was able to join in electing the members of the Commons."}, {"t": "p", "x": "A similar Parliament developed in Scotland. It had three Houses, called Estates: the lords, the commons and the clergy."}, {"t": "p", "x": "This was also a time of development in the legal system. The principle that judges are independent of the government began to be established. In England, judges developed ‘common law’ by a process of precedence (that is, following previous decisions) and tradition. In Scotland, the legal system developed slightly differently and laws were ‘codified’ (that is, written down)."}, {"t": "p", "x": "A distinct identity"}, {"t": "p", "x": "The Middle Ages saw the development of a national culture and identity. After the Norman Conquest, the king and his noblemen had spoken Norman French and the peasants had continued to speak Anglo-Saxon. Gradually these two languages combined to become one English language. Some words in modern English – for example, ‘park’ and ‘beauty’ – are based on Norman French words. Others – for example, ‘apple’, ‘cow’ and ‘summer’ – are based on Anglo-Saxon words. In modern English there are often words with very similar meanings, one from French and one from Anglo-Saxon. ‘Demand’ (French) and ‘ask’ (Anglo-Saxon) are examples. By 1400, in England, official documents were being written in English, and English had become the preferred language of the royal court and Parliament."}, {"t": "p", "x": "Windsor Castle"}, {"t": "p", "x": "In the years leading up to 1400, Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage. The people decided to tell each other stories on the journey, and the poems describe the travellers and some of the stories they told. This collection of poems is called The Canterbury Tales. It was one of the first books to be printed by William Caxton, the first person in England to print books using a printing press. Many of the stories are still popular. Some have been made into plays and television programmes."}, {"t": "p", "x": "In Scotland, many people continued to speak Gaelic and the Scots language also developed. A number of poets began to write in the Scots language. One example is John Barbour, who wrote The Bruce about the Battle of Bannockburn."}, {"t": "p", "x": "The Middle Ages also saw a change in the type of buildings in Britain. Castles were built in many places in Britain and Ireland, partly for defence. Today many are in ruins, although some, such as Windsor and Edinburgh, are still in use. Great cathedrals – for example, Lincoln Cathedral – were also built, and many of these are still used for worship. Several of the cathedrals had windows of stained glass, telling stories about the Bible and Christian saints. The glass in York Minster is a famous example."}, {"t": "p", "x": "During this period, England was an important trading nation. English wool became a very important export. People came to England from abroad to trade and also to work. Many had special skills, such as weavers from France, engineers from Germany, glass manufacturers from Italy and canal builders from Holland."}, {"t": "p", "x": "The Wars of the Roses"}, {"t": "p", "x": "The symbol of the House of Tudors. A white rose inside of a red rose."}, {"t": "p", "x": "In 1455, a civil war was begun to decide who should be king of England. It was fought between the supporters of two families: the House of Lancaster and the House of York. This war was called the Wars of the Roses, because the symbol of Lancaster was a red rose and the symbol of York was a white rose. The war ended with the Battle of Bosworth Field in 1485. King Richard III of the House of York was killed in the battle and Henry Tudor, the leader of the House of Lancaster, became King Henry VII. Henry then married King Richard’s niece, Elizabeth of York, and united the two families. Henry was the first king of the House of Tudor."}, {"t": "p", "x": "The symbol of the House of Tudor was a red rose with a white rose inside it as a sign that the Houses of York and Lancaster were now allies."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The wars that took place in the Middle Ages"}, {"t": "check", "x": "How Parliament began to develop"}, {"t": "check", "x": "The way that land ownership worked"}, {"t": "check", "x": "The effect of the Black Death"}, {"t": "check", "x": "The development of English language and culture"}, {"t": "p", "x": "The Wars of the Roses and the founding of the House of Tudor"}]}, {"id": "3.6", "title": "The Tudors and Stuarts", "blocks": [{"t": "p", "x": "Religious conflicts"}, {"t": "p", "x": "After his victory in the Wars of the Roses, Henry VII wanted to make sure that England remained peaceful and that his position as king was secure. He deliberately strengthened the central administration of England and reduced the power of the nobles. He was thrifty and built up the monarchy’s financial reserves. When he died, his son Henry VIII continued the policy of centralising power."}, {"t": "p", "x": "Henry VIII was most famous for breaking away from the Church of Rome and marrying six times."}, {"t": "p", "x": "THE SIX WIVES OF HENRY VIII"}, {"t": "p", "x": "Catherine of Aragon – Catherine was a Spanish princess. She and Henry had a number of children but only one, Mary, survived. When Catherine was too old to give him another child, Henry decided to divorce her, hoping that another wife would give him a son to be his heir."}, {"t": "p", "x": "Anne Boleyn – Anne Boleyn was English. She and Henry had one daughter, Elizabeth. Anne was unpopular in the country and was accused of taking lovers. She was executed at the Tower of London."}, {"t": "p", "x": "Jane Seymour – Henry married Jane after Anne’s execution. She gave Henry the son he wanted, Edward, but she died shortly after the birth."}, {"t": "p", "x": "Anne of Cleves – Anne was a German princess. Henry married her for political reasons but divorced her soon after."}, {"t": "p", "x": "Catherine Howard – Catherine was a cousin of Anne Boleyn. She was also accused of taking lovers and executed."}, {"t": "p", "x": "Catherine Parr – Catherine was a widow who married Henry late in his life. She survived him and married again but died soon after."}, {"t": "p", "x": "To divorce his first wife, Henry needed the approval of the Pope. When the Pope refused, Henry established the Church of England. In this new Church, the king, not the Pope, would have the power to appoint bishops and order how people should worship."}, {"t": "p", "x": "King Henry VII"}, {"t": "p", "x": "At the same time the Reformation was happening across Europe. This was a movement against the authority of the Pope and the ideas and practices of the Roman Catholic Church. The Protestants formed their own churches. They read the Bible in their own languages instead of in Latin; they did not pray to saints or at shrines; and they believed that a person’s own relationship with God was more important than submitting to the authority of the Church. Protestant ideas gradually gained strength in England, Wales and Scotland during the 16th century."}, {"t": "p", "x": "In Ireland, however, attempts by the English to impose Protestantism (alongside efforts to introduce the English system of laws about the inheritance of land) led to rebellion from the Irish chieftains, and much brutal fighting followed."}, {"t": "p", "x": "During the reign of Henry VIII, Wales became formally united with England by the Act for the Government of Wales. The Welsh sent representatives to the House of Commons and the Welsh legal system was reformed."}, {"t": "p", "x": "Henry VIII was succeeded by his son Edward VI, who was strongly Protestant. During his reign, the Book of Common Prayer was written to be used in the Church of England. A version of this book is still used in some churches today. Edward died at the age of 15 after ruling for just over six years, and his half-sister Mary became queen. Mary was a devout Catholic and persecuted Protestants (for this reason, she became known as ‘Bloody Mary’). Mary also died after a short reign and the next monarch was her half-sister, Elizabeth, the daughter of Henry VIII and Anne Boleyn."}, {"t": "p", "x": "Queen Elizabeth I"}, {"t": "p", "x": "Queen Elizabeth I"}, {"t": "p", "x": "Queen Elizabeth I was a Protestant. She re-established the Church of England as the official Church in England. Everyone had to attend their local church and there were laws about the type of religious services and the prayers which could be said, but Elizabeth did not ask about people’s real beliefs. She succeeded in finding a balance between the views of Catholics and the more extreme Protestants. In this way, she avoided any serious religious conflict within England. Elizabeth became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism."}, {"t": "p", "x": "The Reformation in Scotland and Mary, Queen of Scots"}, {"t": "p", "x": "Scotland had also been strongly influenced by Protestant ideas. In 1560, the predominantly Protestant Scottish Parliament abolished the authority of the Pope in Scotland and Roman Catholic religious services became illegal. A Protestant Church of Scotland with an  leadership was established but, unlike in England, this was not a state Church."}, {"t": "p", "x": "The queen of Scotland, Mary Stuart (often now called ‘Mary, Queen of Scots’) was a Catholic. She was only a week old when her father died and she became queen."}, {"t": "p", "x": "Much of her childhood was spent in France. When she returned to Scotland, she was the centre of a power struggle between different groups. When her husband was murdered, Mary was suspected of involvement and fled to England. She gave her throne to her Protestant son, James VI of Scotland. Mary was Elizabeth I’s cousin and hoped that Elizabeth might help her, but Elizabeth suspected Mary of wanting to take over the English throne, and kept her a prisoner for 20 years. Mary was eventually executed, accused of plotting against Elizabeth I."}, {"t": "p", "x": "Exploration, poetry and drama"}, {"t": "p", "x": "The Golden Hind"}, {"t": "p", "x": "The Elizabethan period in England was a time of growing patriotism: a feeling of pride in being English. English explorers sought new trade routes and tried to expand British trade into the Spanish colonies in the Americas. Sir Francis Drake, one of the commanders in the defeat of the Spanish Armada, was one of the founders of England’s naval tradition. His ship, the Golden Hind, was one of the first to sail right around (‘circumnavigate’) the world. In Elizabeth I’s time, English settlers first began to colonise the eastern coast of America. This colonisation, particularly by people who disagreed with the religious views of the next two kings, greatly increased in the next century."}, {"t": "p", "x": "The Elizabethan period is also remembered for the richness of its poetry and drama, especially the plays and poems of William Shakespeare."}, {"t": "p", "x": "WILLIAM SHAKESPEARE (1564–1616)"}, {"t": "p", "x": "Shakespeare was born in Stratford-upon-Avon, England. He was a playwright and actor and wrote many poems and plays. His most famous plays include A Midsummer Night’s Dream, Hamlet, Macbeth and Romeo and Juliet. He also dramatised significant events from the past, but he did not focus solely on kings and queens. He was one of the first to portray ordinary Englishmen and women. Shakespeare had a great influence on the English language and invented many words that are still common today. Lines from his plays and poems which are often still quoted include:"}, {"t": "p", "x": "Once more unto the breach (Henry V)"}, {"t": "p", "x": "To be or not to be (Hamlet)"}, {"t": "p", "x": "A rose by any other name (Romeo and Juliet)"}, {"t": "p", "x": "All the world’s a stage (As You Like It)"}, {"t": "p", "x": "The darling buds of May (Sonnet 18 – Shall I Compare Thee To a Summer’s Day)."}, {"t": "p", "x": "Many people regard Shakespeare as the greatest playwright of all time. His plays and poems are still performed and studied in Britain and other countries today. The Globe Theatre in London is a modern copy of the theatres in which his plays were first performed."}, {"t": "p", "x": "James VI and I"}, {"t": "p", "x": "Elizabeth I never married and so had no children of her own to inherit her throne. When she died in 1603 her heir was her cousin James VI of Scotland. He became King James I of England, Wales and Ireland but Scotland remained a separate country."}, {"t": "p", "x": "THE KING JAMES BIBLE"}, {"t": "p", "x": "One achievement of King James’ reign was a new translation of the Bible into English. This translation is known as the ‘King James Version’ or the ‘Authorised Version’. It was not the first English Bible but is a version which continues to be used in many Protestant churches today."}, {"t": "p", "x": "Ireland"}, {"t": "p", "x": "During this period, Ireland was an almost completely Catholic country. Henry VII and Henry VIII had extended English control outside the Pale and had established English authority over the whole country. Henry VIII took the title ‘King of Ireland’. English laws were introduced and local leaders were expected to follow the instructions of the Lord Lieutenants in Dublin."}, {"t": "p", "x": "During the reigns of Elizabeth I and James I, many people in Ireland opposed rule by the Protestant government in England. There were a number of rebellions. The English government encouraged Scottish and English Protestants to settle in Ulster, the northern province of Ireland, taking over the land from Catholic landholders."}, {"t": "p", "x": "These settlements were known as plantations. Many of the new settlers came from south-west Scotland and other land was given to companies based in London."}, {"t": "p", "x": "James later organised similar plantations in several other parts of Ireland. This had serious longterm consequences for the history of England, Scotland and Ireland."}, {"t": "p", "x": "The rise of Parliament"}, {"t": "p", "x": "Elizabeth I was very skilled at managing Parliament. During her reign, she was successful in balancing her wishes and views against those of the House of Lords and those of the House of Commons, which was increasingly Protestant in its views."}, {"t": "p", "x": "James I and his son Charles I were less skilled politically. Both believed in the ‘Divine Right of Kings’: the idea that the king was directly appointed by God to rule."}, {"t": "p", "x": "They thought that the king should be able to act without having to seek approval from Parliament. When Charles I inherited the thrones of England, Wales, Ireland and Scotland, he tried to rule in line with this principle. When he could not get Parliament to agree with his religious and foreign policies, he tried to rule without Parliament at all. For 11 years, he found ways in which to raise money without Parliament’s approval but eventually trouble in Scotland meant that he had to recall Parliament."}, {"t": "p", "x": "The beginning of the English civil war"}, {"t": "p", "x": "Charles I wanted the worship of the Church of England to include more ceremony and introduced a revised Prayer Book. He tried to impose this Prayer Book on the Presbyterian Church in Scotland and this led to serious unrest. A Scottish army was formed and Charles could not find the money he needed for his own army without the help of Parliament. In 1640, he recalled Parliament to ask it for funds. Many in Parliament were Puritans, a group of Protestants who advocated strict and simple religious doctrine and worship. They did not agree with the king’s religious views and disliked his reforms of the Church of England. Parliament refused to give the king the money he asked for, even after the Scottish army invaded England."}, {"t": "p", "x": "Another rebellion began in Ireland because the Roman Catholics in Ireland were afraid of the growing power of the Puritans. Parliament took this opportunity to demand control of the English army – a change that would have transferred substantial power from the king to Parliament. In response, Charles I entered the House"}, {"t": "p", "x": "of Commons and tried to arrest five parliamentary leaders, but they had been warned and were not there. (No monarch has set foot in the Commons since.) Civil war between the king and Parliament could not now be avoided and began in 1642. The country split into those who supported the king (the Cavaliers) and those who supported Parliament (the Roundheads)."}, {"t": "p", "x": "Oliver Cromwell and the English Republic"}, {"t": "p", "x": "Oliver Cromwell"}, {"t": "p", "x": "The king’s army was defeated at the Battles of Marston Moor and Naseby. By 1646, it was clear that Parliament had won the war. Charles was held prisoner by the parliamentary army. He was still unwilling to reach any agreement with Parliament and in 1649 he was executed."}, {"t": "p", "x": "England declared itself a republic, called the Commonwealth. It no longer had a monarch. For a time, it was not totally clear how the country would be governed."}, {"t": "p", "x": "For now, the army was in control. One of its generals, Oliver Cromwell, was sent to Ireland, where the revolt which had begun in 1641 still continued and where there was still a Royalist army. Cromwell was successful in establishing the authority of the English Parliament but did this with such violence that even today Cromwell remains a controversial figure in Ireland."}, {"t": "p", "x": "The Scots had not agreed to the execution of Charles I and declared his son Charles II to be king. He was crowned king of Scotland and led a Scottish army into England. Cromwell defeated this army in the Battles of Dunbar and Worcester. Charles II escaped from Worcester, famously hiding in an oak tree on one occasion, and eventually fled to Europe. Parliament now controlled Scotland as well as England and Wales."}, {"t": "p", "x": "After his campaign in Ireland and victory over Charles II at Worcester, Cromwell was recognised as the leader of the new republic. He was given the title of Lord Protector and ruled until his death in 1658. When Cromwell died, his son, Richard, became Lord Protector in his place but was not able to control the army or the government. Although Britain had been a republic for 11 years, without Oliver Cromwell there was no clear leader or system of government. Many people in the country wanted stability. People began to talk about the need for a king."}, {"t": "p", "x": "The Restoration"}, {"t": "p", "x": "In May 1660, Parliament invited Charles II to come back from exile in the Netherlands. He was crowned King Charles II of England, Wales, Scotland and Ireland."}, {"t": "p", "x": "Charles II made it clear that he had ‘no wish to go on his travels again’. He understood that he could not always do as he wished but would sometimes need to reach agreement with Parliament. Generally, Parliament supported his policies. The Church of England again became the established official Church. Both Roman Catholics and Puritans were kept out of power."}, {"t": "p", "x": "During Charles II’s reign, in 1665, there was a major outbreak of plague in London. Thousands of people died, especially in poorer areas. The following year, a great fire destroyed much of the city, including many churches and St Paul’s Cathedral. London was rebuilt with a new St Paul’s, which was designed by a famous architect, Sir Christopher Wren. Samuel Pepys wrote about these events in a diary which was later published and is still read today."}, {"t": "p", "x": "The Habeas Corpus Act became law in 1679. This was a very important piece of legislation which remains relevant today. Habeas corpus is Latin for ‘you must present the person in court’. The Act guaranteed that no one could be held prisoner unlawfully. Every prisoner has a right to a court hearing."}, {"t": "p", "x": "Charles II was interested in science. During his reign, the Royal Society was formed to promote ‘natural knowledge’. This is the oldest surviving scientific society in the world. Among its early members were Sir Edmund Halley, who successfully predicted the return of the comet now called Halley’s Comet, and Sir Isaac Newton."}, {"t": "p", "x": "ISAAC NEWTON (1643–1727)"}, {"t": "p", "x": "Born in Lincolnshire, eastern England, Isaac Newton first became interested in science when he studied at Cambridge University. He became an important figure in the field. His most famous published work was Philosophiae Naturalis Principia Mathematica (‘Mathematical Principles of Natural Philosophy’), which showed how gravity applied to the whole universe. Newton also discovered that white light is made up of the colours of the rainbow. Many of his discoveries are still important for modern science."}, {"t": "p", "x": "A Catholic King"}, {"t": "p", "x": "Charles II had no legitimate children. He died in 1685 and his brother, James, who was a Roman Catholic, became King James II in England, Wales and Ireland and King James VII of Scotland. James favoured Roman Catholics and allowed them to be army Officers, which an Act of Parliament had forbidden. He did not seek to reach agreements with Parliament and arrested some of the bishops of the Church of England. People in England worried that James wanted to make England a Catholic country once more. However, his heirs were his two daughters, who were both firmly Protestant, and people thought that this meant there would soon be a Protestant monarch again. Then, James’s wife had a son. Suddenly, it seemed likely that the next monarch would not be a Protestant after all."}, {"t": "p", "x": "The Glorious Revolution"}, {"t": "p", "x": "James II’s elder daughter, Mary, was married to her cousin William of Orange, the Protestant ruler of the Netherlands. In 1688, important Protestants in England asked William to invade England and proclaim himself king. When William reached England, there was no resistance. James fled to France and William took over the throne, becoming William III in England, Wales and Ireland, and William II of Scotland. William ruled jointly with Mary. This event was later called the ‘Glorious Revolution’ because there was no fighting in England and because it guaranteed the power of Parliament, ending the threat of a monarch ruling on his or her own as he or she wished. James II wanted to regain the throne and invaded Ireland with the help of a French army. William defeated James II at the Battle of the Boyne in Ireland in 1690, an event which is still celebrated by some in Northern Ireland today. William re-conquered Ireland and James fled back to France. Many restrictions were placed on the Roman Catholic Church in Ireland and Irish Catholics were unable to take part in the government."}, {"t": "p", "x": "There was also support for James in Scotland. An attempt at an armed rebellion in support of James was quickly defeated at Killiecrankie. All Scottish clans were required formally to accept William as king by taking an oath. The MacDonalds of Glencoe were late in taking the oath and were all killed. The memory of this massacre meant some Scots distrusted the new government."}, {"t": "p", "x": "Some continued to believe that James was the rightful king, particularly in Scotland. Some joined him in exile in France; others were secret supporters. James’ supporters became known as Jacobites."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "How and why religion changed during this period"}, {"t": "check", "x": "The importance of poetry and drama in the Elizabethan period"}, {"t": "check", "x": "About the involvement of Britain in Ireland"}, {"t": "check", "x": "The development of Parliament and the only period in history when England was a republic"}, {"t": "check", "x": "Why there was a restoration of the monarchy"}, {"t": "check", "x": "How the Glorious Revolution happened"}]}, {"id": "3.3", "title": "A global power", "blocks": [{"t": "p", "x": "Constitutional monarchy - The Bill of Rights"}, {"t": "p", "x": "At the coronation of William and Mary, a Declaration of Rights was read. This confirmed that the king would no longer be able to raise taxes or administer justice without agreement from Parliament. The balance of power between monarch and Parliament had now permanently changed. The Bill of Rights, 1689, confirmed the rights of Parliament and the limits of the king’s power. Parliament took control of who could be monarch and declared that the king or queen must be a Protestant. A new Parliament had to be elected at least every three years (later this became seven years and now it is five years). Every year the monarch had to ask Parliament to renew funding for the army and the navy."}, {"t": "p", "x": "These changes meant that, to be able to govern effectively, the monarch needed to have advisers, or ministers, who would be able to ensure a majority of votes in the House of Commons and the House of Lords. There were two main groups in Parliament, known as the Whigs and the Tories. (The modern Conservative Party is still sometimes referred to as the Tories.) This was the beginning of party politics."}, {"t": "p", "x": "This was also an important time for the development of a free press (newspapers and other publications which are not controlled by the government). From 1695, newspapers were allowed to operate without a government licence. Increasing numbers of newspapers began to be published."}, {"t": "p", "x": "The laws passed after the Glorious Revolution are the beginning of what is called ‘constitutional monarchy’. The monarch remained very important but was no longer able to insist on particular policies or actions if Parliament did not agree. After William III, the ministers gradually became more important than the monarch but this was not a democracy in the modern sense. The number of people who had the right to vote for members of Parliament was still very small. Only men who owned property of a certain value were able to vote. No women at all had the vote. Some constituencies were controlled by a single wealthy family. These were called ‘pocket boroughs’. Other constituencies had hardly any voters and were called ‘rotten boroughs’."}, {"t": "p", "x": "A growing population"}, {"t": "p", "x": "This was a time when many people left Britain and Ireland to settle in new colonies in America and elsewhere, but others came to live in Britain. The first Jews to come to Britain since the Middle Ages settled in London in 1656. Between 1680 and 1720 many refugees called Huguenots came from France. They were Protestants and had been persecuted for their religion. Many were educated and skilled and worked as scientists, in banking, or in weaving or other crafts."}, {"t": "p", "x": "The Act of Treaty or Union in Scotland"}, {"t": "p", "x": "William and Mary’s successor, Queen Anne, had no surviving children. This created uncertainty over the succession in England, Wales and Ireland and in Scotland."}, {"t": "p", "x": "The Act of Union, known as the Treaty of Union in Scotland, was therefore agreed in 1707, creating the Kingdom of Great Britain. Although Scotland was no longer an independent country, it kept its own legal and education systems and Presbyterian Church."}, {"t": "p", "x": "The Prime Minister"}, {"t": "p", "x": "When Queen Anne died in 1714, Parliament chose a German, George I, to be the next king, because he was Anne’s nearest Protestant relative. An attempt by Scottish Jacobites to put James II’s son on the throne instead was quickly defeated. George I did not speak very good English and this increased his need to rely on his ministers. The most important minister in Parliament became known as the Prime Minister. The first man to be called this was Sir Robert Walpole, who was Prime Minister from 1721 to 1742."}, {"t": "p", "x": "The rebellion of the clans"}, {"t": "p", "x": "In 1745 there was another attempt to put a Stuart king back on the throne in place of George I’s son, George II. Charles Edward Stuart (Bonnie Prince Charlie), the grandson of James II, landed in Scotland. He was supported by clansmen from the Scottish highlands and raised an army. Charles initially had some successes but was defeated by George II’s army at the Battle of Culloden in 1746. Charles escaped back to Europe."}, {"t": "p", "x": "The clans lost a lot of their power and influence after Culloden. Chieftains became landlords if they had the favour of the English king, and clansmen became tenants who had to pay for the land they used."}, {"t": "p", "x": "A process began which became known as the ‘Highland Clearances’. Many Scottish landlords destroyed individual small farms (known as ‘crofts’) to make space for large flocks of sheep and cattle. Evictions became very common in the early 19th century. Many Scottish people left for North America at this time."}, {"t": "p", "x": "ROBERT BURNS (1759–96)"}, {"t": "p", "x": "Known in Scotland as ‘The Bard’, Robert Burns was a Scottish poet. He wrote in the Scots language, English with some Scottish words, and standard English. He also revised a lot of traditional folk songs by changing or adding lyrics. Burns’ best-known work is probably the song Auld Lang Syne, which is sung by people in the UK and other countries when they are celebrating the New Year (or Hogmanay as it is called in Scotland)."}, {"t": "p", "x": "The Enlightenment"}, {"t": "p", "x": "During the 18th century, new ideas about politics, philosophy and science were developed. This is often called ‘the Enlightenment’. Many of the great thinkers of the Enlightenment were Scottish. Adam Smith developed ideas about economics which are still referred to today. David Hume’s ideas about human nature continue to influence philosophers. Scientific discoveries, such as James Watt’s work on steam power, helped the progress of the Industrial Revolution. One of the most important principles of the Enlightenment was that everyone should have the right to their own political and religious beliefs and that the state should not try to dictate to them. This continues to be an important principle in the UK today."}, {"t": "p", "x": "The Industrial Revolution"}, {"t": "p", "x": "Before the 18th century, agriculture was the biggest source of employment in Britain. There were many cottage industries, where people worked from home to produce goods such as cloth and lace."}, {"t": "p", "x": "Example of agriculture: Wheat fields in the UK"}, {"t": "p", "x": "The Industrial Revolution was the rapid development of industry in Britain in the 18th and 19th centuries. Britain was the first country to industrialise on a large scale. It happened because of the development of machinery and the use of steam power. Agriculture and the manufacturing of goods became mechanised. This made things more efficient and increased production. Coal and other raw materials were needed to power the new factories. Many people moved from the countryside and started working in the mining and manufacturing industries."}, {"t": "p", "x": "Industrial Revolution"}, {"t": "p", "x": "The development of the Bessemer process for the mass production of steel led to the development of the shipbuilding industry and the railways. Manufacturing jobs became the main source of employment in Britain."}, {"t": "p", "x": "RICHARD ARKWRIGHT (1732–92)"}, {"t": "p", "x": "Born in 1732, Arkwright originally trained and worked as a barber. He was able to dye hair and make wigs. When wigs became less popular, he started to work in textiles. He improved the original carding machine. Carding is the process of preparing fibres for spinning into yarn and fabric. He also developed horse-driven spinning mills that used only one machine. This increased the efficiency of production. Later, he used the steam engine to power machinery. Arkwright is particularly remembered for the efficient and profitable way that he ran his factories."}, {"t": "p", "x": "Better transport links were needed to transport raw materials and manufactured goods. Canals were built to link the factories to towns and cities and to the ports, particularly in the new industrial areas in the middle and north of England."}, {"t": "p", "x": "Working conditions during the Industrial Revolution were very poor. There were no laws to protect employees, who were often forced to work long hours in dangerous situations. Children also worked and were treated in the same way as adults. Sometimes they were treated even more harshly."}, {"t": "p", "x": "This was also a time of increased colonisation overseas. Captain James Cook mapped the coast of Australia and a few colonies were established there. Britain gained control over Canada, and the East India Company, originally set up to trade, gained control of large parts of India. Colonies began to be established in southern Africa."}, {"t": "p", "x": "Britain traded all over the world and began to import more goods. Sugar and tobacco came from North America and the West Indies; textiles, tea and spices came from India and the area that is today called Indonesia. Trading and settlements overseas sometimes brought Britain into conflict with other countries, particularly France, which was expanding and trading in a similar way in many of the same areas of the world."}, {"t": "p", "x": "SAKE DEAN MAHOMET (1759–1851)"}, {"t": "p", "x": "Mahomet was born in 1759 and grew up in the Bengal region of India. He served in the Bengal army and came to Britain in 1782. He then moved to Ireland and eloped with an Irish girl called Jane Daly in 1786, returning to England at the turn of the century. In 1810 he opened the Hindoostane Coffee House in George Street, London. It was the first curry house to open in Britain. Mahomet and his wife also introduced ‘shampooing’, the Indian art of head massage, to Britain."}, {"t": "p", "x": "The slave trade"}, {"t": "p", "x": "This commercial expansion and prosperity was sustained in part by the booming slave trade. While slavery was illegal within Britain itself, by the 18th century it was a fully established overseas industry, dominated by Britain and the American colonies. Slaves came primarily from West Africa. Travelling on British ships in horrible conditions, they were taken to America and the Caribbean, where they were made to work on tobacco and sugar plantations. The living and working conditions for slaves were very bad. Many slaves tried to escape and others revolted against their owners in protest at their terrible treatment."}, {"t": "p", "x": "There were, however, people in Britain who opposed the slave trade. The first formal anti-slavery groups were set up by the Quakers in the late 1700s, and they petitioned Parliament to ban the practice. William Wilberforce, an evangelical Christian and a member of Parliament, also played an important part in changing the law. Along with other abolitionists (people who supported the abolition of slavery), he succeeded in turning public opinion against the slave trade. In 1807, it became illegal to trade slaves in British ships or from British ports, and in 1833 the Emancipation Act abolished slavery throughout the British Empire. The Royal Navy stopped slave ships from other countries, freed the slaves and punished the slave traders. After 1833, 2 million Indian and Chinese workers were employed to replace the freed slaves. They worked on sugar plantations in the Caribbean, in mines in South Africa, on railways in East Africa and in the army in Kenya."}, {"t": "p", "x": "The American war of independence"}, {"t": "p", "x": "By the 1760s, there were substantial British colonies in North America. The colonies were wealthy and largely in control of their own affairs. Many of the colonist families had originally gone to North America in order to have religious freedom. They were well educated and interested in ideas of liberty. The British government wanted to tax the colonies. The colonists saw this as an attack on their freedom and said there should be ‘no taxation without representation’ in the British Parliament. Parliament tried to compromise by repealing some of the taxes, but relationships between the British government and the colonies continued to worsen."}, {"t": "p", "x": "Fighting broke out between the colonists and the British forces. In 1776, 13 American colonies declared their independence, stating that people had a right to establish their own governments. The colonists eventually defeated the British army and Britain recognised the colonies’ independence in 1783."}, {"t": "p", "x": "War with France"}, {"t": "p", "x": "During the 18th century, Britain fought a number of wars with France. In 1789, there was a revolution in France and the new French government soon declared war on Britain. Napoleon, who became Emperor of France, continued the war. Britain’s navy fought against combined French and Spanish fleets, winning the Battle of Trafalgar in 1805. Admiral Nelson was in charge of the British fleet at Trafalgar and was killed in the battle. Nelson’s Column in Trafalgar Square, London, is a monument to him. His ship, HMS Victory, can be visited in Portsmouth. The British army also fought against the French. In 1815, the French Wars ended with the defeat of the Emperor Napoleon by the Duke of Wellington at the Battle of Waterloo. Wellington was known as the Iron Duke and later became Prime Minister."}, {"t": "p", "x": "THE UNION FLAG"}, {"t": "p", "x": "Although Ireland had had the same monarch as England and Wales since Henry VIII, it had remained a separate country. In 1801, Ireland became unified with England, Scotland and Wales after the Act of Union of 1800. This created the United Kingdom of Great Britain and Ireland. One symbol of this union between England, Scotland, Wales and Ireland was a new version of the official flag, the Union Flag. This is often called the Union Jack. The flag combined crosses associated with England, Scotland and Ireland. It is still used today as the official flag of the UK."}, {"t": "p", "x": "The Union Flag consists of three crosses:"}, {"t": "p", "x": "The cross of St George, patron saint of England, is a red cross on a white ground."}, {"t": "p", "x": "The cross of St Andrew, patron saint of Scotland, is a diagonal white cross on a blue ground."}, {"t": "p", "x": "The cross of St Patrick, patron saint of Ireland, is a diagonal red cross on a white ground."}, {"t": "p", "x": "There is also an official Welsh flag, which shows a Welsh dragon. The Welsh dragon does not appear on the Union Flag because, when the first Union Flag was created in 1606 from the flags of Scotland and England, the Principality of Wales was already united with England."}, {"t": "p", "x": "The Victorian Age"}, {"t": "p", "x": "In 1837, Queen Victoria became queen of the UK at the age of 18. She reigned until 1901, almost 64 years. At the date of writing (2013) this is the longest reign of any British monarch. Her reign is known as the Victorian Age. It was a time when Britain increased in power and influence abroad. Within the UK, the middle classes because increasingly significant and a number of reformers led moves to improve conditions of life for the poor."}, {"t": "p", "x": "Queen Victoria"}, {"t": "p", "x": "The British Empire"}, {"t": "p", "x": "During the Victorian period, the British Empire grew to cover all of India, Australia and large parts of Africa. It became the largest empire the world has ever seen, with an estimated population of more than 400 million people."}, {"t": "p", "x": "Many people were encouraged to leave the UK to settle overseas. Between 1853 and 1913, as many as 13 million British citizens left the country. People continued to come to Britain from other parts of the world. For example, between 1870 and 1914, around 120,000 Russian and Polish Jews came to Britain to escape persecution. Many settled in London’s East End and in Manchester and Leeds. People from the Empire, including India and Africa, also came to Britain to live, work and study."}, {"t": "p", "x": "Trade and industry"}, {"t": "p", "x": "Britain continued to be a great trading nation. The government began to promote policies of free trade, abolishing a number of taxes on imported goods. One example of this was the repealing of the Corn Laws in 1846. These had prevented the import of cheap grain. The reforms helped the development of British industry, because raw materials could now be imported more cheaply."}, {"t": "p", "x": "Working conditions in factories gradually became better. In 1847, the number of hours that women and children could work was limited by law to 10 hours per day."}, {"t": "p", "x": "Better housing began to be built for workers."}, {"t": "p", "x": "Transport links also improved, enabling goods and people to move more easily around the country. Just before Victoria came to the throne, the father and son George and Robert Stephenson pioneered the railway engine and a major expansion of the railways took place in the Victorian period. Railways were built throughout the Empire. There were also great advances in other areas, such as the building of bridges by engineers such as Isambard Kingdom Brunel."}, {"t": "p", "x": "ISAMBARD KINGDOM BRUNEL (1806–59)"}, {"t": "p", "x": "Brunel was originally from Portsmouth, England. He was an engineer who built tunnels, bridges, railway lines and ships. He was responsible for constructing the Great Western Railway, which was the first major railway built in Britain. It runs from Paddington Station in London to the south west of England, the West Midlands and Wales. Many of Brunel’s bridges
