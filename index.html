{"t": "p", "x": "Located on the north-east coast of Northern Ireland, the Giant’s Causeway is a land formation of columns made from volcanic lava. It was formed about 50 million years ago. There are many legends about the Causeway and how it was formed."}, {"t": "p", "x": "Loch Lomond and the Trossachs National Park"}, {"t": "p", "x": "This national park covers 720 square miles (1,865 square kilometres) in the west of Scotland. Loch Lomond is the largest expanse of fresh water in mainland Britain and probably the best-known part of the park."}, {"t": "p", "x": "LONDON EYE"}, {"t": "p", "x": "London Eye captured at night. It is also used as part of New Year celebrations."}, {"t": "p", "x": "The London Eye is situated on the southern bank of the River Thames and is a Ferris wheel that is 443 feet (135 metres) tall. It was originally built as part of the UK’s celebration of the new millennium and continues to be an important part of New Year celebrations."}, {"t": "p", "x": "Snowdonia is a national park in North Wales. It covers an area of 838 square miles (2,170 square kilometres). Its most well-known landmark is Snowdon, which is the highest mountain in Wales."}, {"t": "p", "x": "The Tower of London was first built by William the Conqueror after he became king in 1066. Tours are given by the Yeoman Warders, also known as Beefeaters, who tell visitors about the building’s history. People can also see the Crown Jewels there."}, {"t": "p", "x": "The views that can be seen in Lake District"}, {"t": "p", "x": "The Lake District is England’s largest national park. It covers 885 square miles (2,292 square kilometres). It is famous for its lakes and mountains and is very popular with climbers, walkers and sailors. The biggest stretch of water is Windermere. In 2007, television viewers voted Wastwater as Britain’s favourite view."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "Some of the ways in which people in the UK spend their leisure time"}, {"t": "check", "x": "The development of British cinema"}, {"t": "check", "x": "What the television licence is and how it funds the BBC"}, {"t": "check", "x": "Some of the places of interest to visit in the UK"}]}, {"id": "4.6", "title": "Religion", "blocks": [{"t": "p", "x": "The UK is historically a Christian country. In the 2009 Citizenship Survey, 70% of people identified themselves as Christian. Much smaller proportions identified themselves as Muslim (4%), Hindu (2%), Sikh (1%), Jewish or Buddhist (both less than 0.5%), and 2% of people followed another religion. There are religious buildings for other religions all over the UK. This includes Islamic mosques, Hindu temples, Jewish synagogues, Sikh gurdwaras and Buddhist temples. However, everyone has the legal right to choose their religion, or to choose not to practise a religion. In the Citizenship Survey, 21% of people said that they had no religion."}, {"t": "p", "x": "Christian Churches"}, {"t": "p", "x": "In England, there is a constitutional link between Church and state. The official Church of the state is the Church of England (called the Anglican Church in other countries and the Episcopal Church in Scotland and the United States). It is a Protestant Church and has existed since the Reformation in the 1530s."}, {"t": "p", "x": "The monarch is the head of the Church of England. The spiritual leader of the Church of England is the Archbishop of Canterbury. The monarch has the right to select the Archbishop and other senior church officials, but usually the choice is made by the Prime Minister and a committee appointed by the Church. Several Church of England bishops sit in the House of Lords."}, {"t": "p", "x": "In Scotland, the national Church is the Church of Scotland, which is a Presbyterian Church. It is governed by ministers and elders. The chairperson of the General Assembly of the Church of Scotland is the Moderator, who is appointed for one year only and often speaks on behalf of that Church."}, {"t": "p", "x": "Churches in the UK: Inside a Catholic Church"}, {"t": "p", "x": "There is no established Church in Wales or Northern Ireland. Other Protestant Christian groups in the UK are Baptists, Methodists, Presbyterians and Quakers. There are also other denominations of Christianity, the biggest of which is Roman Catholic."}, {"t": "p", "x": "Patron Saints' days"}, {"t": "p", "x": "England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day:"}, {"t": "p", "x": "1 March: St David’s Day, Wales"}, {"t": "p", "x": "17 March: St Patrick’s Day, Northern Ireland"}, {"t": "p", "x": "23 April: St George’s Day, England"}, {"t": "p", "x": "30 November: St Andrew’s Day, Scotland."}, {"t": "p", "x": "Only Scotland and Northern Ireland have their patron saint’s day as an official holiday (although in Scotland not all businesses and Offices will close). Events are held across Scotland, Northern Ireland and the rest of the country, especially where there are a lot of people of Scottish, Northern Irish and Irish heritage."}, {"t": "p", "x": "While the patron saints’ days are no longer public holidays in England and Wales, they are still celebrated. Parades and small festivals are held all over the two countries."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The different religions that are practised in the UK"}, {"t": "check", "x": "That the Anglican Church, also known as the Church of England, is the Church of the state in England (the ‘established Church’)"}, {"t": "check", "x": "That other branches of the Christian Church also practise their faith in the UK without being linked to the state"}, {"t": "check", "x": "That other religions are practised in the UK"}, {"t": "check", "x": "About the patron saints"}]}, {"id": "4.7", "title": "Sport", "blocks": [{"t": "p", "x": "Sports of all kinds play an important part in many people’s lives. There are several sports that are particularly popular in the UK. Many sporting events take place at major stadiums such as Wembley Stadium in London and the Millennium Stadium in Cardiff."}, {"t": "p", "x": "Local governments and private companies provide sports facilities such as swimming pools, tennis courts, football pitches, dry ski slopes and gymnasiums. Many famous sports, including cricket, football, lawn tennis, golf and rugby, began in Britain."}, {"t": "p", "x": "The UK has hosted the Olympic Games on three occasions: 1908, 1948 and 2012. The main Olympic site for the 2012 Games was in Stratford, East London. The British team was very successful, across a wide range of Olympic sports, finishing third in the medal table."}, {"t": "p", "x": "The UK has hosted the olympic games 3 times."}, {"t": "p", "x": "The Paralympic Games for 2012 were also hosted in London. The Paralympics have their origin in the work of Dr Sir Ludwig Guttman, a German refugee, at the Stoke Mandeville hospital in Buckinghamshire. Dr Guttman developed new methods of treatment for people with spinal injuries and encouraged patients to take part in exercise and sport."}, {"t": "p", "x": "NOTABLE BRITISH SPORTSMEN AND WOMEN"}, {"t": "p", "x": "Sir Roger Bannister (1929–) was the first man in the world to run a mile in under four minutes, in 1954."}, {"t": "p", "x": "Sir Jackie Stewart (1939–) is a Scottish former racing driver who won the Formula 1 world championship three times."}, {"t": "p", "x": "Bobby Moore (1941–93) captained the English football team that won the World Cup in 1966."}, {"t": "p", "x": "Sir Ian Botham (1955–) captained the English cricket team and holds a number of English Test cricket records, both for batting and for bowling."}, {"t": "p", "x": "Jayne Torvill (1957–) and Christopher Dean (1958–) won gold medals for ice dancing at the Olympic Games in 1984 and in four consecutive world championships."}, {"t": "p", "x": "Sir Steve Redgrave (1962–) won gold medals in rowing in five consecutive Olympic Games and is one of Britain’s greatest Olympians."}, {"t": "p", "x": "Baroness Tanni-Grey Thompson (1969–) is an athlete who uses a wheelchair and won 16 Paralympic medals, including 11 gold medals, in races over five Paralympic Games. She won the London Marathon six times and broke a total of 30 world records."}, {"t": "p", "x": "Dame Kelly Holmes (1970–) won two gold medals for running in the 2004 Olympic Games. She has held a number of British and European records."}, {"t": "p", "x": "Dame Ellen MacArthur (1976–) is a yachtswoman and in 2004 became the fastest person to sail around the world singlehanded."}, {"t": "p", "x": "Sir Chris Hoy (1976–) is a Scottish cyclist who has won six gold and one silver Olympic medals. He has also won 11 world championship titles."}, {"t": "p", "x": "David Weir (1979–) is a Paralympian who uses a wheelchair and has won six gold medals over two Paralympic Games. He has also won the London Marathon six times."}, {"t": "p", "x": "Bradley Wiggins (1980–) is a cyclist. In 2012, he became the first Briton to win the Tour de France. He has won seven Olympic medals, including gold medals in the 2004, 2008 and 2012 Olympic Games."}, {"t": "p", "x": "Mo Farah (1983–) is a British distance runner, born in Somalia. He won gold medals in the 2012 Olympics for the 5,000 and 10,000 metres and is the first Briton to win the Olympic gold medal in the 10,000 metres."}, {"t": "p", "x": "Jessica Ennis (1986–) is an athlete. She won the 2012 Olympic gold medal in the heptathlon, which includes seven different track and field events. She also holds a number of British athletics records."}, {"t": "p", "x": "Andy Murray (1987–) is a Scottish tennis player who in 2012 won the men’s singles in the US Open. He is the first British man to win a singles title in a Grand Slam tournament since 1936. In the same year, he won Olympic gold and silver medals and was runner-up in the men’s singles at Wimbledon."}, {"t": "p", "x": "Ellie Simmonds (1994–) is a Paralympian who won gold medals for swimming at the 2008 and 2012 Paralympic Games and holds a number of world records. She was the youngest member of the British team at the 2008 Games."}, {"t": "p", "x": "Cricket"}, {"t": "p", "x": "Cricket originated in England and is now played in many countries. Games can last up to five days but still result in a draw! The idiosyncratic nature of the game and its complex laws are said to reflect the best of the British character and sense of fair play. You may come across expressions such as ‘rain stopped play’, ‘batting on a sticky wicket’, ‘playing a straight bat’, ‘bowled a googly’ or ‘it’s just not cricket’, which have passed into everyday usage. The most famous competition is the Ashes, which is a series of Test matches played between England and Australia."}, {"t": "p", "x": "Football"}, {"t": "p", "x": "Football is the UK's most popular sport."}, {"t": "p", "x": "Football is the UK’s most popular sport. It has a long history in the UK and the first professional football clubs were formed in the late 19th century."}, {"t": "p", "x": "England, Scotland, Wales and Northern Ireland each have separate leagues in which clubs representing different towns and cities compete. The English Premier League attracts a huge international audience. Many of the best players in the world play in the Premier League. Many UK teams also compete in competitions such as the UEFA (Union of European Football Associations) Champions League, against other teams from Europe. Most towns and cities have a professional club and people take great pride in supporting their home team. There can be great rivalry between different football clubs and among fans."}, {"t": "p", "x": "Each country in the UK also has its own national team that competes with other national teams across the world in tournaments such as the FIFA (Fédération Internationale de Football Association) World Cup and the UEFA European Football Championships. England’s only international tournament victory was at the World Cup of 1966, hosted in the UK."}, {"t": "p", "x": "Football is also a popular sport to play in many local communities, with people playing amateur games every week in parks all over the UK."}, {"t": "p", "x": "Rugby"}, {"t": "p", "x": "Rugby originated in England in the early 19th century and is very popular in the UK today. There are two different types of rugby, which have different rules: union and league. Both have separate leagues and national teams in England, Wales, Scotland and Northern Ireland (who play with the Irish Republic). Teams from all countries compete in a range of competitions. The most famous rugby union competition is the Six Nations Championship between England, Ireland, Scotland, Wales, France and Italy. The Super League is the most well-known rugby league (club) competition."}, {"t": "p", "x": "Horse-racing"}, {"t": "p", "x": "There is a very long history of horse racing in Britain, with evidence of events taking place as far back as Roman times. The sport has a long association with royalty. There are racecourses all over the UK. Famous horse-racing events include: Royal Ascot, a five-day race meeting in Berkshire attended by members of the Royal Family; the Grand National at Aintree near Liverpool; and the Scottish Grand National at Ayr. There is a National Horseracing Museum in Newmarket, Suffolk."}, {"t": "p", "x": "Golf"}, {"t": "p", "x": "The modern game of golf can be traced back to 15th century Scotland. It is a popular sport played socially as well as professionally. There are public and private golf courses all over the UK. St Andrews in Scotland is known as the home of golf. The Open Championship is the only ‘Major’ tournament held outside the United States. It is hosted by a different golf course every year."}, {"t": "p", "x": "Tennis"}, {"t": "p", "x": "Modern tennis evolved in England in the late 19th century. The first tennis club was founded in Leamington Spa in 1872. The most famous tournament hosted in Britain is The Wimbledon Championships, which takes place each year at the All England Lawn Tennis and Croquet Club. It is the oldest tennis tournament in the world and the only ‘Grand Slam’ event played on grass."}, {"t": "p", "x": "Water sports"}, {"t": "p", "x": "Sailing continues to be popular in the UK, reflecting our maritime heritage. A British sailor, Sir Francis Chichester, was the first person to sail single-handed around the world, in 1966/67. Two years later, Sir Robin Knox-Johnston became the first person to do this without stopping. Many sailing events are held throughout the UK, the most famous of which is at Cowes on the Isle of Wight. Rowing is also popular, both as a leisure activity and as a competitive sport. There is a popular yearly race on the Thames between Oxford and Cambridge Universities."}, {"t": "p", "x": "Motor sports"}, {"t": "p", "x": "There is a long history of motor sport in the UK, for both cars and motor cycles. Motor-car racing in the UK started in 1902. The UK continues to be a world leader in the development and manufacture of motor-sport technology. A Formula 1 Grand Prix event is held in the UK each year and a number of British Grand Prix drivers have won the Formula 1 World Championship. Recent British winners include Damon Hill, Lewis Hamilton and Jensen Button."}, {"t": "p", "x": "Skiing"}, {"t": "p", "x": "Skiing is increasingly popular in the UK. Many people go abroad to ski and there are also dry ski slopes throughout the UK. Skiing on snow may also be possible during the winter. There are five ski centres in Scotland, as well as Europe’s longest dry ski slope near Edinburgh."}]}, {"id": "4.8", "title": "The UK today", "blocks": [{"t": "p", "x": "The UK today is a more diverse society than it was 100 years ago, in both ethnic and religious terms. Post-war immigration means that nearly 10% of the population has a parent or grandparent born outside the UK. The UK continues to be a multinational and multiracial society with a rich and varied culture. This section will tell you about the different parts of the UK and some of the important places. It will also explain some of the UK’s traditions  customs and some of the popular activities that take place."}, {"t": "p", "x": "The nations of the UK"}, {"t": "p", "x": "The UK is located in the north west of Europe. The longest distance on the mainland is from John O’Groats on the north coast of Scotland to Land’s End in the south-west corner of England. It is about 870 miles (approximately 1,400 kilometres). Most people live in towns and cities but much of Britain is still countryside."}, {"t": "p", "x": "Many people continue to visit the countryside for holidays and for leisure activities such as walking, camping and fishing."}, {"t": "p", "x": "CITIES OF THE UK"}, {"t": "p", "x": "ENGLAND"}, {"t": "p", "x": "London"}, {"t": "p", "x": "Birmingham"}, {"t": "p", "x": "Liverpool"}, {"t": "p", "x": "Leeds"}, {"t": "p", "x": "Sheffield"}, {"t": "p", "x": "Bristol"}, {"t": "p", "x": "Manchester"}, {"t": "p", "x": "Bradford"}, {"t": "p", "x": "Newcastle Upon Tyne"}, {"t": "p", "x": "Plymouth"}, {"t": "p", "x": "Southampton"}, {"t": "p", "x": "Norwich"}, {"t": "p", "x": "WALES"}, {"t": "p", "x": "Cardiff"}, {"t": "p", "x": "Swansea"}, {"t": "p", "x": "Newport"}, {"t": "p", "x": "SCOTLAND"}, {"t": "p", "x": "Edinburgh"}, {"t": "p", "x": "Glasgow"}, {"t": "p", "x": "Dundee"}, {"t": "p", "x": "Aberdeen"}, {"t": "p", "x": "NORTHERN IRELAND"}, {"t": "p", "x": "Belfast"}, {"t": "p", "x": "CAPITAL CITIES"}, {"t": "p", "x": "The capital city of the UK is London"}, {"t": "p", "x": "Scotland"}, {"t": "p", "x": "The capital city of Scotland is Edinburgh"}, {"t": "p", "x": "Wales"}, {"t": "p", "x": "The capital city of Wales is Cardiff"}, {"t": "p", "x": "Northern Ireland"}, {"t": "p", "x": "The capital city of Northern Ireland is Belfast"}, {"t": "p", "x": "UK currency"}, {"t": "p", "x": "The currency in the UK is the pound sterling (symbol £). There are 100 pence in a pound. The denominations (values) of currency are: coins: 1p, 2p, 5p, 10p, 20p, 50p, £1 and £2 notes: £5, £10, £20, £50."}, {"t": "p", "x": "Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK. However, shops and businesses do not have to accept them."}, {"t": "p", "x": "Languages and dialects"}, {"t": "p", "x": "There are many variations in language in the different parts of the UK. The English language has many accents and dialects. In Wales, many people speak Welsh – a completely different language from English – and it is taught in schools and universities. In Scotland, Gaelic (again, a different language) is spoken in some parts of the Highlands and Islands, and in Northern Ireland some people speak Irish Gaelic."}, {"t": "p", "x": "Population"}, {"t": "p", "x": "The table below shows how the population of the UK has changed over time."}, {"t": "p", "x": "Population growth in the UK"}, {"t": "p", "x": "Source: National Statistics"}, {"t": "p", "x": "In Scotland, Gaelic is spoken in some parts of the Highlands and Islands, and in Northern Ireland some people speak Irish Gaelic."}, {"t": "p", "x": "Population growth has been faster in more recent years. Migration into the UK and longer life expectancy have played a part in population growth."}, {"t": "p", "x": "The population is very unequally distributed over the four parts of the UK. England more or less consistently makes up 84% of the total population, Wales around 5%, Scotland just over 8% and Northern Ireland less than 3%."}, {"t": "p", "x": "An ageing population"}, {"t": "p", "x": "People in the UK are living longer than ever before. This is due to improved living standards and better health care. There are now a record number of people aged 85 and over. This has an impact on the cost of pensions and health care."}, {"t": "p", "x": "Year"}, {"t": "p", "x": "Population"}, {"t": "p", "x": "1600"}, {"t": "p", "x": "Just over 4 million"}, {"t": "p", "x": "1700"}, {"t": "p", "x": "5 million"}, {"t": "p", "x": "1801"}, {"t": "p", "x": "8 million"}, {"t": "p", "x": "1851"}, {"t": "p", "x": "20 million"}, {"t": "p", "x": "1901"}, {"t": "p", "x": "40 million"}, {"t": "p", "x": "1951"}, {"t": "p", "x": "50 million"}, {"t": "p", "x": "1998"}, {"t": "p", "x": "57 million"}, {"t": "p", "x": "2005"}, {"t": "p", "x": "Just under 60 million"}, {"t": "p", "x": "2010"}, {"t": "p", "x": "Just over 62 million"}, {"t": "p", "x": "2022"}, {"t": "p", "x": "Estimated 67.6 million"}, {"t": "p", "x": "Ethnic diversity"}, {"t": "p", "x": "The UK population is ethnically diverse and changing rapidly, especially in large cities such as London. It is not always easy to get an exact picture of the ethnic origin of all the population. There are people in the UK with ethnic origins from all over the world. In surveys, the most common ethnic description chosen is white, which includes people of European, Australian, Canadian, New Zealand and American descent. Other significant groups are those of Asian, black and mixed descent."}, {"t": "p", "x": "An equal society"}, {"t": "p", "x": "Within the UK, it is a legal requirement that men and women should not be discriminated against because of their gender or because they are, or are not, married."}, {"t": "p", "x": "They have equal rights to work, own property, marry and divorce. If they are married, both parents are equally responsible for their children."}, {"t": "p", "x": "Women in Britain today make up about half of the workforce. On average, girls leave school with better qualifications than boys. More women than men study at university."}, {"t": "p", "x": "Employment opportunities for women are much greater than they were in the past. Women work in all sectors of the economy, and there are now more women in high-level positions than ever before, including senior managers in traditionally male-dominated occupations. Alongside this, men now work in more varied jobs than they did in the past."}, {"t": "p", "x": "It is no longer expected that women should stay at home and not work. Women often continue to work after having children. In many families today, both partners work and both share responsibility for childcare and household chores."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The capital cities of the UK"}, {"t": "check", "x": "What languages other than English are spoken in particular parts of the UK"}, {"t": "check", "x": "How the population of the UK has changed"}, {"t": "check", "x": "That the UK is an equal society and ethnically diverse"}, {"t": "check", "x": "The currency of the UK"}]}]}, {"num": 5, "title": "The UK Government, the law and your role", "sections": [{"id": "5.1", "title": "Chapter 5: The UK government, the law and your role", "blocks": [{"t": "p", "x": "In this chapter you will learn how the UK is governed. You need to understand the Queen’s role in government and her powers. Make sure you understand how people are appointed to the two Houses of Parliament and the specific roles detailed, such as the Speaker and cabinet, and your rights to vote and stand for election."}, {"t": "p", "x": "Everyone should understand the workings of the devolved administrations but pay particular attention if you are taking the test in Scotland, Wales or Northern Ireland."}, {"t": "p", "x": "The UK’s international role is explained through the Commonwealth, EU and others so focus on the differences between these bodies and their member countries."}, {"t": "p", "x": "The chapter then explains common laws, fundamental rights, policing and the courts of the UK. Pay particular attention to this so you know the differences between the various courts and offences they deal with. Finally the chapter deals with taxation, driving and community activity."}, {"t": "infohead", "x": "IN THIS CHAPTER THERE IS INFORMATION ABOUT:"}, {"t": "info", "x": "Britain as a constitutional monarchy"}, {"t": "info", "x": "How Parliament works"}, {"t": "info", "x": "Elections, the government and the opposition"}, {"t": "info", "x": "Devolved administrations of the UK"}, {"t": "info", "x": "The Commonwealth, EU, UN and NATO"}, {"t": "info", "x": "British law and justice"}, {"t": "info", "x": "The courts"}, {"t": "info", "x": "Fundamental principles and rights"}, {"t": "info", "x": "Tax"}, {"t": "info", "x": "Driving"}, {"t": "info", "x": "Community work and getting involved"}, {"t": "info", "x": "The UK is a parliamentary democracy with the monarch as head of state. This section will tell you about the different institutions which make up this democratic system and explain how you can play a part in the democratic process."}]}, {"id": "5.2", "title": "The development of British democracy", "blocks": [{"t": "p", "x": "Democracy is a system of government where the whole adult population gets a say. This might be by direct voting or by choosing representatives to make decisions on their behalf."}, {"t": "p", "x": "At the turn of the 19th century, Britain was not a democracy as we know it today. Although there were elections to select members of Parliament (MPs), only a small group of people could vote. They were men who were over 21 years of age and who owned a certain amount of property."}, {"t": "p", "x": "The franchise (that is, the number of people who had the right to vote) grew over the course of the 19th century and political parties began to involve ordinary men and women as members."}, {"t": "p", "x": "In the 1830s and 1840s, a group called the Chartists campaigned for reform. They wanted six changes: for every man to have the vote elections every year for all regions to be equal in the electoral system secret ballots for any man to be able to stand as an MP for MPs to be paid."}, {"t": "p", "x": "At the time, the campaign was generally seen as a failure. However, by 1918 most of these reforms had been adopted. The voting franchise was also extended to women over 30, and then in 1928 to men and women over 21. In 1969, the voting age was reduced to 18 for men and women."}]}, {"id": "5.3", "title": "The British constitution", "blocks": [{"t": "p", "x": "A constitution is a set of principles by which a country is governed. It includes all of the institutions that are responsible for running the country and how their power is kept in check. The constitution also includes laws and conventions. The British constitution is not written down in any single document, and therefore it is described as ‘unwritten’. This is mainly because the UK, unlike America or France, has never had a revolution which led permanently to a totally new system of government. Our most important institutions have developed over hundreds of years. Some people believe that there should be a single document, but others believe an unwritten constitution allows for more flexibility and better government."}, {"t": "p", "x": "Constitutional institutions"}, {"t": "p", "x": "In the UK, there are several different parts of government. The main ones are: the monarchy"}, {"t": "p", "x": "Parliament (the House of Commons and the House of Lords) the Prime Minister the cabinet the judiciary (courts) the police the civil service local government."}, {"t": "p", "x": "In addition, there are devolved governments in Scotland, Wales and Northern Ireland that have the power to legislate on certain issues."}, {"t": "p", "x": "The monarchy"}, {"t": "p", "x": "The monarch"}, {"t": "p", "x": "The monarch is the head of state of the UK. The monarch or head of state for many countries in the Commonwealth. The UK has a constitutional monarchy. This means that the king or queen does not rule the country but appoints the government, which the people have chosen in a democratic election. The monarch invites the leader of the party with the largest number of MPs, or the leader of a coalition between more than one party, to become the Prime Minister. The monarch has regular meetings with the Prime Minister and can advise, warn and encourage, but the decisions on government policies are made by the Prime Minister and cabinet."}, {"t": "p", "x": "Queen Elizabeth II reigned since her father’s death in 1952, and in 2012 she celebrated her Diamond Jubilee (60 years as queen). She died on September 8, 2022."}, {"t": "p", "x": "She was married to Prince Philip. Her eldest son, Charles (King Charles III), is the current ruling monarch. Prince Edward, became the Duke of Edinburgh in 2023 on his 59th birthday by his eldest brother, King Charles III, who formerly held the title."}, {"t": "p", "x": "King Charles III has been the sovereign since 2022, and his heir apparent is his elder son, William, Prince of Wales (title for the heir apparent to the throne)."}, {"t": "p", "x": "William's three children are next, in order of birth: Prince George, Princess Charlotte, and Prince Louis."}, {"t": "p", "x": "The monarch has important ceremonial roles, such as the opening of the new parliamentary session each year. On this occasion the King (or Queen) makes a speech which summarises the government’s policies for the year ahead. All Acts of Parliament are made in the Majesty's name."}, {"t": "p", "x": "The monarch represents the UK to the rest of the world. The monarch receives foreign ambassadors and high commissioners, entertains visiting heads of state, and makes state visits overseas in support of diplomatic and economic relationships with other countries."}, {"t": "p", "x": "The monarch has an important role in providing stability and continuity. While governments and Prime Ministers change regularly, the monarch continues as head of state. The monarch provides a focus for national identity and pride, which was demonstrated through the celebrations of the Queen Elizabeth's Jubilee."}, {"t": "p", "x": "The national anthem"}, {"t": "p", "x": "The National Anthem of the UK is ‘God Save the King (or Queen)’. It is played at important national occasions and at events attended by the King (or Queen) or the Royal Family. The first verse is:"}, {"t": "p", "x": "‘God save our gracious King!"}, {"t": "p", "x": "Long live our noble King!"}, {"t": "p", "x": "God save the King!"}, {"t": "p", "x": "Send her victorious,"}, {"t": "p", "x": "Happy and glorious,"}, {"t": "p", "x": "Long to reign over us,"}, {"t": "p", "x": "God save the King!’"}, {"t": "p", "x": "New citizens swear or affirm loyalty to the King as part of the citizenship ceremony."}, {"t": "p", "x": "Oath of allegiance"}, {"t": "p", "x": "‘I (name) swear by Almighty God that on becoming a British citizen, I will be faithful and bear true allegiance to His Majesty King Charles the Third, his Heirs and Successors, according to law.’"}, {"t": "p", "x": "Affirmation of allegiance"}, {"t": "p", "x": "‘I (name) do solemnly, sincerely and truly declare and affirm that on becoming a British citizen, I will be faithful and bear true allegiance to His Majesty King Charles the Third, his Heirs and Successors, according to law.’"}, {"t": "p", "x": "System of government"}, {"t": "p", "x": "The system of government in the UK is a parliamentary democracy. The UK is divided into parliamentary constituencies. Voters in each constituency elect their member of Parliament (MP) in a General Election. All of the elected MPs form the House of Commons. Most MPs belong to a political party, and the party with the majority of MPs forms the government. If one party does not get a majority, two parties can join together to form a coalition."}, {"t": "p", "x": "The House of Commons"}, {"t": "p", "x": "Parliamentary debates in the House of Commons"}, {"t": "p", "x": "The House of Commons is regarded as the more important of the two chambers in Parliament because its members are democratically elected. The Prime Minister and almost all the members of the cabinet are members of the House of Commons (MPs). Each MP represents a parliamentary constituency, which is a small area of the country. MPs have a number of different responsibilities. They: represent everyone in their constituency help to create new laws scrutinise and comment on what the government is doing debate important national issues."}, {"t": "p", "x": "The House of Lords"}, {"t": "p", "x": "The House of Lords"}, {"t": "p", "x": "Members of the House of Lords, known as peers, are not elected by the people and do not represent a constituency. The role and membership of the House of Lords has changed over the last 50 years."}, {"t": "p", "x": "Until 1958, all peers were:"}, {"t": "p", "x": "‘hereditary’, which means they inherited their title, or senior judges, or bishops of the Church of England."}, {"t": "p", "x": "Since 1958, the Prime Minister has had the power to nominate peers just for their own lifetime. These are called life peers. They have usually had an important career in politics, business, law or another profession. Life peers are appointed by the monarch on the advice of the Prime Minister. They also include people nominated by the leaders of the other main political parties or by an independent Appointments Commission for non-party peers."}, {"t": "p", "x": "Since 1999, hereditary peers have lost the automatic right to attend the House of Lords. They now elect a few of their number to represent them in the House of Lords."}, {"t": "p", "x": "The House of Lords is normally more independent of the government than the House of Commons. It can suggest amendments or propose new laws, which are then discussed by MPs. The House of Lords checks laws that have been passed by the House of Commons to ensure they are fit for purpose. It also holds the government to account to make sure that it is working in the best interests of the people. There are peers who are specialists in particular areas, and their knowledge is useful in making and checking laws. The House of Commons has powers to overrule the House of Lords, but these are not used often."}, {"t": "p", "x": "The Speaker"}, {"t": "p", "x": "Debates in the House of Commons are chaired by the Speaker. This person is the chief Officer of the House of Commons. The Speaker is neutral and does not represent a political party, even though he or she is an MP, represents a constituency and deals with constituents’ problems like any other MP. The Speaker is chosen by other MPs in a secret ballot."}, {"t": "p", "x": "The Speaker keeps order during political debates to make sure the rules are followed. This includes making sure the opposition has a guaranteed amount of time to debate issues which it chooses. The Speaker also represents Parliament on ceremonial occasions."}, {"t": "p", "x": "Elections"}, {"t": "p", "x": "UK elections"}, {"t": "p", "x": "MPs are elected at a General Election, which is held at least every five years."}, {"t": "p", "x": "If an MP dies or resigns, there will be a fresh election, called a byelection, in his or her constituency."}, {"t": "p", "x": "MPs are elected through a system called ‘first past the post’. In each constituency, the candidate who gets the most votes is elected. The government is usually formed by the party that wins the majority of constituencies. If no party wins a majority, two parties may join together to form a coalition."}, {"t": "p", "x": "European parliamentary elections"}, {"t": "p", "x": "Elections for the European Parliament are also held every five years. Elected members are called members of the European Parliament (MEPs). Elections to the European Parliament use a system of proportional representation, where seats are allocated to each party in proportion to the total number of votes it has won."}, {"t": "p", "x": "Contacting elected members"}, {"t": "p", "x": "All elected members have a duty to serve and represent their constituents. You can get contact details for all your representatives and their parties from your local library and from www.parliament.uk. MPs, Assembly members, members of the Scottish Parliament (MSPs) and MEPs are also listed in The Phone Book, published by BT, and in_Yellow Pages_."}, {"t": "p", "x": "You can contact MPs by letter or telephone at their constituency Office, or at their Office in the House of Commons: The House of Commons, Westminster, London SW1A 0AA, telephone 020 7729 3000. In addition, many MPs, Assembly members, MSPs and MEPs hold regular local ‘surgeries’, where constituents can go in person to talk about issues that are of concern to them. These surgeries are often advertised in the local newspaper."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "How democracy has developed in the UK"}, {"t": "check", "x": "What a constitution is and how the UK’s constitution is different from those of most other countries"}, {"t": "check", "x": "The role of the monarch"}, {"t": "check", "x": "The role of the House of Commons and House of Lords"}, {"t": "check", "x": "What the Speaker does"}, {"t": "check", "x": "How the UK elects MPs and MEPs"}]}, {"id": "5.4", "title": "Fundamental principles", "blocks": [{"t": "p", "x": "Britain has a long history of respecting an individual’s rights and ensuring essential freedoms. These rights have their roots in Magna Carta, the Habeas Corpus Act and the Bill of Rights of 1689, and they have developed over a period of time. British diplomats and lawyers had an important role in drafting the European Convention on Human Rights and Fundamental Freedoms. The UK was one of the first countries to sign the Convention in 1950."}, {"t": "p", "x": "Some of the principles included in the European Convention on Human Rights are: right to life prohibition of torture prohibition of slavery and forced labour right to liberty and security right to a fair trial freedom of thought, conscience and religion freedom of expression (speech)."}, {"t": "p", "x": "The Human Rights Act 1998 incorporated the European Convention on Human Rights into UK law. The government, public bodies and the courts must follow the principles of the Convention."}, {"t": "p", "x": "Equal opportunities"}, {"t": "p", "x": "UK laws ensure that people are not treated unfairly in any area of life or work because of their age, disability, sex, pregnancy and maternity, race, religion or belief, sexuality or marital status. If you face problems with discrimination, you can get more information from the Citizens Advice Bureau or from one of the following organisations:"}, {"t": "p", "x": "England and Wales: Equality and Human Rights Commission (www.equalityhumanrights.com)"}, {"t": "p", "x": "Scotland: Equality and Human Rights Commission in Scotland (www.equalityhumanrights.com/scotland/the-commission-inscotland) and Scottish Human Rights Commission (www.scottishhumanrights.com)"}, {"t": "p", "x": "Northern Ireland: Equality Commission for Northern Ireland (www.equalityni.org)"}, {"t": "p", "x": "Northern Ireland Human Rights Commission (www.nihrc.org)."}, {"t": "p", "x": "Domestic violence"}, {"t": "p", "x": "In the UK, brutality and violence in the home is a serious crime. Anyone who is violent towards their partner – whether they are a man or woman, married or living together – can be prosecuted. Any man who forces a woman to have sex, including a woman’s husband, can be charged with rape."}, {"t": "p", "x": "It is important for anyone facing domestic violence to get help as soon as possible. A solicitor or the Citizens Advice Bureau can explain the available options. In some areas there are safe places to go and stay in, called refuges or shelters. There are emergency telephone numbers in the helpline section at the front of Yellow Pages, including, for women, the number of the nearest women’s centre. You can also phone the 24-hour National Domestic Violence Freephone Helpline on 0808 2000 247 at any time, or the police can help you find a safe place to stay."}, {"t": "p", "x": "Female genital mutilation"}, {"t": "p", "x": "Female genital mutilation (FGM), also known as cutting or female circumcision, is illegal in the UK. Practising FGM or taking a girl or woman abroad for FGM is a criminal offence."}, {"t": "p", "x": "Forced marriage"}, {"t": "p", "x": "A marriage should be entered into with the full and free consent of both people involved. Arranged marriages, where both parties agree to the marriage, are acceptable in the UK."}, {"t": "p", "x": "Forced marriage is where one or both parties do not or cannot give their consent to enter into the partnership. Forcing another person to marry is a criminal offence."}, {"t": "p", "x": "Forced Marriage Protection Orders were introduced in 2008 for England, Wales and Northern Ireland under the Forced Marriage (Civil Protection) Act 2007. Court orders can be obtained to protect a person from being forced into a marriage, or to protect a person in a forced marriage. Similar Protection Orders were introduced in Scotland in November 2011."}, {"t": "p", "x": "A potential victim, or someone acting for them, can apply for an order. Anyone found to have breached an order can be jailed for up to two years for contempt of court."}, {"t": "p", "x": "5.4.1 Taxation"}, {"t": "p", "x": "Income tax"}, {"t": "p", "x": "People in the UK have to pay tax on their income, which includes: wages from paid employment profits from self-employment taxable benefits pensions income from property, savings and dividends."}, {"t": "p", "x": "Money raised from income tax pays for government services such as roads, education, police and the armed forces."}, {"t": "p", "x": "For most people, the right amount of income tax is automatically taken from their income from employment by their employer and paid directly to HM"}, {"t": "p", "x": "Revenue & Customs (HMRC), the government department that collects taxes. This system is called ‘Pay As You Earn’ (PAYE). If you are self- employed, you need to pay your own tax through a system called ‘self- assessment’, which includes completing a tax return. Other people may also need to complete a tax return. If HMRC sends you a tax return, it is important to complete and return the form as soon as you have all the necessary information."}, {"t": "p", "x": "You can find out more about income tax at www.hmrc.gov.uk/incometax."}, {"t": "p", "x": "You can get help and advice about taxes and completing tax forms from the"}, {"t": "p", "x": "HMRC self-assessment helpline, on 0845 300 0627, and the HMRC website at www.hmrc.gov.uk."}, {"t": "p", "x": "National insurance"}, {"t": "p", "x": "Almost everybody in the UK who is in paid work, including self-employed people, must pay National Insurance Contributions. The money raised from"}, {"t": "p", "x": "National Insurance Contributions is used to pay for state benefits and services such as the state retirement pension and the National Health Service"}, {"t": "p", "x": "(NHS)."}, {"t": "p", "x": "Employees have their National Insurance Contributions deducted from their pay by their employer. People who are self-employed need to pay National"}, {"t": "p", "x": "Insurance Contributions themselves. Anyone who does not pay enough"}, {"t": "p", "x": "National Insurance Contributions will not be able to receive certain contributory benefits such as Jobseeker’s Allowance or a full state retirement pension. Some workers, such as part-time workers, may not qualify for statutory payments such as maternity pay if they do not earn enough."}, {"t": "p", "x": "Further guidance about National Insurance Contributions is available on"}, {"t": "p", "x": "HMRC’s website at www.hmrc.gov.uk/ni."}, {"t": "p", "x": "Getting a National Insurance number"}, {"t": "p", "x": "A National Insurance number is a unique personal account number. It makes sure that the National Insurance Contributions and tax you pay are properly recorded against your name. All young people in the UK are sent a National"}, {"t": "p", "x": "Insurance number just before their 16th birthday."}, {"t": "p", "x": "A non-UK national living in the UK and looking for work, starting work or setting up as self-employed will need a National Insurance number."}, {"t": "p", "x": "However, you can start work without one. If you have permission to work in the UK, you will need to telephone the Department for Work and Pensions"}, {"t": "p", "x": "(DWP) to arrange to get a National Insurance number. You may be required to attend an interview. The DWP will advise you of the appropriate application process and tell you which documents you will need to bring to an interview if one is necessary. You will usually need documents that prove your identity and that you have permission to work in the UK. A National"}, {"t": "p", "x": "Insurance number does not on its own prove to an employer that you have the right to work in the UK."}, {"t": "p", "x": "You can find out more information about how to apply for a National"}, {"t": "p", "x": "Insurance number at www.gov.uk."}, {"t": "p", "x": "5.4.2 Driving"}, {"t": "p", "x": "In the UK, you must be at least 17 years old to drive a car or motor cycle and you must have a driving licence to drive on public roads. To get a UK driving licence you must pass a driving test, which tests both your knowledge and your practical skills. You need to be at least 16 years old to ride a moped, and there are other age requirements and special tests for driving large vehicles."}, {"t": "p", "x": "Follow the government guidelines to learn what you need to drive. The first step is applying for a provisional driving license and finding a driving instuctor. Then you will need to pass:"}, {"t": "p", "x": "A driving theory test (Consists of a multiple choice theory test and a hazard perception test)"}, {"t": "p", "x": "A practical driving test"}, {"t": "p", "x": "Drivers can use their driving licence until they are 70 years old. After that, the licence is valid for three years at a time."}, {"t": "p", "x": "In Northern Ireland, a newly qualified driver must display an ‘R’ place (for restricted driver) for one year after passing the test."}, {"t": "p", "x": "If your driving licence is from a country in the European Union (EU),"}, {"t": "p", "x": "Iceland, Liechtenstein or Norway, you can drive in the UK for as long as your licence is valid. If you have a licence from any other country, you may use it in the UK for up to 12 months. To continue driving after that, you must get a UK full driving licence."}, {"t": "p", "x": "If you are resident in the UK, your car or motor cycle must be registered at the Driver and Vehicle Licensing Agency (DVLA). You must pay an annual road tax and display the tax disc, which shows that the tax has been paid, on the windscreen. You must also have valid motor insurance. It is a serious criminal offence to drive without insurance. If your vehicle is over three years old, you must take it for a Ministry of Transport (MOT) test every year. It is an offence not to have an MOT certificate if your vehicle is more than three years old. You can find out more about vehicle tax and MOT requirements from www.gov.uk."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The fundamental principles of UK law"}, {"t": "check", "x": "That domestic violence, FGM and forced marriage are illegal in the UK"}, {"t": "check", "x": "The system of income tax and National Insurance"}, {"t": "check", "x": "The requirements for driving a car"}]}, {"id": "5.5", "title": "Respecting the law", "blocks": [{"t": "p", "x": "One of the most important responsibilities of all residents in the UK is to know and obey the law. This section will tell you about the legal system in the UK and some of the laws that may affect you. Britain is proud of being a welcoming country, but all residents, regardless of their background, are expected to comply with the law and to understand that some things which may be allowed in other legal systems are not acceptable in the UK. Those who do not respect the law should not expect to be allowed to become permanent residents in the UK."}, {"t": "p", "x": "The law is relevant to all areas of life in the UK. You should make sure that you are aware of the laws which affect your everyday life, including both your personal and business affairs."}, {"t": "p", "x": "The law in the UK"}, {"t": "p", "x": "Every person in the UK receives equal treatment under the law. This means that the law applies in the same way to everyone, no matter who they are or where they are from."}, {"t": "p", "x": "Laws can be divided into criminal law and civil law:"}, {"t": "p", "x": "Criminal law relates to crimes, which are usually investigated by the police or another authority such as a council, and which are punished by the courts."}, {"t": "p", "x": "Civil law is used to settle disputes between individuals or groups."}, {"t": "p", "x": "Examples of criminal laws are:"}, {"t": "p", "x": "Carrying a weapon: it is a criminal offence to carry a weapon of any kind, even if it is for self-defence. This includes a gun, a knife or anything that is made or adapted to cause injury."}, {"t": "p", "x": "Drugs: selling or buying drugs such as heroin, cocaine, ecstasy and cannabis is illegal in the UK."}, {"t": "p", "x": "Racial crime: it is a criminal offence to cause harassment, alarm or distress to someone because of their religion or ethnic origin."}, {"t": "p", "x": "Selling tobacco: it is illegal to sell tobacco products (for example, cigarettes, cigars, roll-up tobacco) to anyone under the age of 18."}, {"t": "p", "x": "Smoking in public places: it is against the law to smoke tobacco products in nearly every enclosed public place in the UK. There are signs displayed to tell you where you cannot smoke."}, {"t": "p", "x": "Buying alcohol: it is a criminal offence to sell alcohol to anyone who is under 18 or to buy alcohol for people who are under the age of 18. (There is one exception: people aged 16 or over can drink alcohol with a meal in a hotel or restaurant."}, {"t": "p", "x": "Drinking in public: some places have alcohol-free zones where you cannot drink in public. The police can also confiscate alcohol or move young people on from public places. You can be fined or arrested."}, {"t": "p", "x": "This list does not include all crimes. There are many that apply in most countries, such as murder, theft and assault. You can find out more about types of crime in the UK at www.gov.uk."}, {"t": "p", "x": "Examples of civil laws are:"}, {"t": "p", "x": "Housing law: this includes disputes between landlords and tenants over issues such as repairs and eviction."}, {"t": "p", "x": "Consumer rights: an example of this is a dispute about faulty goods or services."}, {"t": "p", "x": "Employment law: these cases include disputes over wages and cases of unfair dismissal or discrimination in the workplace."}, {"t": "p", "x": "Debt: people might be taken to court if they owe money to someone."}, {"t": "p", "x": "The police and their duties"}, {"t": "p", "x": "Police in the UK"}, {"t": "p", "x": "The job of the police in the UK is to: protect life and property prevent disturbances (also known as keeping the peace) prevent and detect crime."}, {"t": "p", "x": "The police are organised into a number of separate police forces headed by Chief Constables. They are independent of the government."}, {"t": "p", "x": "In November 2012, the public elected Police and Crime Commissioners (PCCs) in England and Wales. These are directly elected individuals who are responsible for the delivery of an efficient and effective police force that reflects the needs of their local communities. PCCs set local police priorities and the local policing budget."}, {"t": "p", "x": "They also appoint the Chief Constable."}, {"t": "p", "x": "The police force is a public service that helps and protects everyone, no matter what their background or where they live. Police Officers must themselves obey the law. They must not misuse their authority, make a false statement, be rude or abusive, or commit racial discrimination. If police Officers are corrupt or misuse their authority they are severely punished."}, {"t": "p", "x": "Police Officers are supported by police community support Officers (PSCOs). PSCOs have different roles according to the area but usually patrol the streets, work with the public, and support police Officers at crime scenes and major events."}, {"t": "p", "x": "All people in the UK are expected to help the police prevent and detect crimes whenever they can. If you are arrested and taken to a police station, a police Officer will tell you the reason for your arrest and you will be able to seek legal advice."}, {"t": "p", "x": "If something goes wrong, the police complaints system tries to put it right. Anyone can make a complaint about the police by going to a police station or writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland."}, {"t": "p", "x": "Terrorism and extremism"}, {"t": "p", "x": "The UK faces a range of terrorist threats. The most serious of these is from Al Qa’ida, its affiliates and like-minded organisations. The UK also faces threats from other kinds of terrorism, such as Northern Ireland-related terrorism."}, {"t": "p", "x": "All terrorist groups try to radicalise and recruit people to their cause. How, where and to what extent they try to do so will vary. Evidence shows that these groups attract very low levels of public support, but people who want to make their home in the UK should be aware of this threat. It is important that all citizens feel safe."}, {"t": "p", "x": "This includes feeling safe from all kinds of extremism (vocal or active opposition to fundamental British values), including religious extremism and far-right extremism."}, {"t": "p", "x": "If you think someone is trying to persuade you to join an extremist or terrorist cause, you should notify your local police force."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The difference between civil and criminal law and some examples of each"}, {"t": "check", "x": "The duties of the police"}, {"t": "check", "x": "The possible terrorist threats facing the UK"}, {"t": "p", "x": "5.5.1 The role of the courts"}, {"t": "p", "x": "The judiciary"}, {"t": "p", "x": "Judges (who are together called ‘the judiciary’) are responsible for interpreting the law and ensuring that trials are conducted fairly. The government cannot interfere with this."}, {"t": "p", "x": "Sometimes the actions of the government are claimed to be illegal. If the judges agree, then the government must either change its policies or ask"}, {"t": "p", "x": "Parliament to change the law. If judges find that a public body is not respecting someone’s legal rights, they can order that body to change its practices and/or pay compensation. Judges also make decisions in disputes between members of the public or organisations. These might be about contracts, property or employment rights or after an accident."}, {"t": "p", "x": "Criminal courts"}, {"t": "p", "x": "There are some differences between the court systems in England and"}, {"t": "p", "x": "Wales, Scotland and Northern Ireland."}, {"t": "p", "x": "Magistrates’ and Justice of the Peace Courts"}, {"t": "p", "x": "In England, Wales and Northern Ireland, most minor criminal cases are dealt with in a Magistrates’ Court. In Scotland, minor criminal offences go to a"}, {"t": "p", "x": "Justice of the Peace Court."}, {"t": "p", "x": "Magistrates and Justices of the Peace (JPs) are members of the local community. In England, Wales and Scotland they usually work unpaid and do not need legal qualifications. They receive training to do the job and are supported by a legal adviser. Magistrates decide the verdict in each case that comes before them and, if the person is found guilty, the sentence that they are given. In Northern Ireland, cases are heard by a District Judge or Deputy"}, {"t": "p", "x": "District Judge, who is legally qualified and paid."}, {"t": "p", "x": "Crown Courts and Sheriff Courts"}, {"t": "p", "x": "In England, Wales and Northern Ireland, serious offences are tried in front of a judge and a jury in a Crown Court. In Scotland, serious cases are heard in a Sheriff Court with either a sheriff or a sheriff with a jury. The most serious cases in Scotland, such as murder, are heard at a High Court with a judge and jury. A jury is made up of members of the public chosen at random from the local electoral register. In England, Wales and Northern"}, {"t": "p", "x": "Ireland a jury has 12 members, and in Scotland a jury has 15 members."}, {"t": "p", "x": "Everyone who is summoned to do jury service must do it unless they are not eligible (for example, because they have a criminal conviction) or they provide a good reason to be excused, such as ill health."}, {"t": "p", "x": "The jury has to listen to the evidence presented at the trial and then decide a verdict of ‘guilty’ or ‘not guilty’ based on what they have heard. In"}, {"t": "p", "x": "Scotland, a third verdict of ‘not proven’ is also possible. If the jury finds a defendant guilty, the judge decides on the penalty."}, {"t": "p", "x": "Youth Courts"}, {"t": "p", "x": "In England, Wales and Northern Ireland, if an accused person is aged 10 to"}, {"t": "p", "x": "17, the case is normally heard in a Youth Court in front of up to three specially trained magistrates or a District Judge. The most serious cases will go to the Crown Court. The parents or carers of the young person are expected to attend the hearing. Members of the public are not allowed in"}, {"t": "p", "x": "Youth Courts, and the name or photographs of the accused young person cannot be published in newspapers or used by the media."}, {"t": "p", "x": "In Scotland a system called the Children’s Hearings System is used to deal with children and young people who have committed an offence."}, {"t": "p", "x": "Northern Ireland has a system of youth conferencing to consider how a child should be dealt with when they have committed an offence."}, {"t": "p", "x": "Civil courts"}, {"t": "p", "x": "County Courts"}, {"t": "p", "x": "County Courts deal with a wide range of civil disputes. These include people trying to get back money that is owed to them, cases involving personal injury, family matters, breaches of contract, and divorce. In"}, {"t": "p", "x": "Scotland, most of these matters are dealt with in the Sheriff Court. More serious civil cases – for example, when a large amount of compensation is being claimed – are dealt with in the High Court in England, Wales and"}, {"t": "p", "x": "Northern Ireland. In Scotland, they are dealt with in the Court of Session in"}, {"t": "p", "x": "Edinburgh."}, {"t": "p", "x": "The small claims procedure"}, {"t": "p", "x": "The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer."}, {"t": "p", "x": "This procedure is used for claims of less than £10,000 in England and Wales and £5,000 in Scotland and Northern Ireland. The hearing is held in front of a judge in an ordinary room, and people from both sides of the dispute sit around a table. Small claims can also be issued online through Money"}, {"t": "p", "x": "Claims Online (www.moneyclaim.gov.uk)."}, {"t": "p", "x": "You can get details about the small claims procedure from your local"}, {"t": "p", "x": "County Court or Sheriff Court. Details of your local court can be found as follows:"}, {"t": "p", "x": "England and Wales: at www.gov.uk"}, {"t": "p", "x": "Scotland: at www.scotcourts.gov.uk"}, {"t": "p", "x": "Northern Ireland: at www.courtsni.gov.uk."}, {"t": "p", "x": "Legal advice"}, {"t": "p", "x": "Solicitors"}, {"t": "p", "x": "Solicitors are trained lawyers who give advice on legal matters, take action for their clients and represent their clients in court."}, {"t": "p", "x": "There are solicitors’ Offices throughout the UK. It is important to find out which aspects of law a solicitor specialises in and to check that they have the right experience to help you with your case. Many advertise in local newspapers and in Yellow Pages. The Citizens Advice Bureau"}, {"t": "p", "x": "(www.citizensadvice.org.uk) can give you names of local solicitors and which areas of law they specialise in. You can also get this information from the Law Society (www.lawsociety.org.uk) in England and Wales, the Law"}, {"t": "p", "x": "Society of Scotland (www.lawscot.org.uk) or the Law Society of Northern"}, {"t": "p", "x": "Ireland (www.lawsoc-ni.org). Solicitors’ charges are usually based on how much time they spend on a case. It is very important to find out at the start how much a case is likely to cost."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The role of the judiciary"}, {"t": "check", "x": "About the different criminal courts in the UK"}, {"t": "check", "x": "About the different civil courts in the UK"}, {"t": "check", "x": "How you can settle a small claim"}]}, {"id": "5.6", "title": "The government", "blocks": [{"t": "p", "x": "The Prime Minister"}, {"t": "p", "x": "The Prime Minister (PM) is the leader of the political party in power. He or she appoints the members of the cabinet and has control over many important public appointments. The official home of the Prime Minister is 10 Downing Street, in central London, near the Houses of Parliament. He or she also has a country house outside London called Chequers."}, {"t": "p", "x": "The Prime Minister can be changed if the MPs in the governing party decide to do so, or if he or she wishes to resign. The Prime Minister usually resigns if his or her party loses a General Election."}, {"t": "p", "x": "The cabinet"}, {"t": "p", "x": "The Prime Minister appoints about 20 senior MPs to become ministers in charge of departments. These include:"}, {"t": "p", "x": "Chancellor of the Exchequer – responsible for the economy"}, {"t": "p", "x": "Home Secretary – responsible for crime, policing and immigration"}, {"t": "p", "x": "Foreign Secretary – responsible for managing relationships with foreign countries other ministers (called ‘Secretaries of State’) responsible for subjects such as education, health and defence."}, {"t": "p", "x": "These ministers form the cabinet, a committee which usually meets weekly and makes important decisions about government policy. Many of these decisions have to be debated or approved by Parliament."}, {"t": "p", "x": "Each department also has a number of other ministers, called Ministers of State and Parliamentary Under-Secretaries of State, who take charge of particular areas of the department’s work."}, {"t": "p", "x": "The opposition"}, {"t": "p", "x": "The second-largest party in the House of Commons is called the opposition. The leader of the opposition usually becomes Prime Minister if his or her party wins the next General Election."}, {"t": "p", "x": "The leader of the opposition leads his or her party in pointing out what they see as the government’s failures and weaknesses. One important opportunity to do this is at Prime Minister’s Questions, which takes place every week while Parliament is sitting. The leader of the opposition also appoints senior opposition MPs to be ‘shadow ministers’. They form the shadow cabinet and their role is to challenge the government and put forward alternative policies."}, {"t": "p", "x": "The party system"}, {"t": "p", "x": "Anyone aged 18 or over can stand for election as an MP but they are unlikely to win unless they have been nominated to represent one of the major political parties."}, {"t": "p", "x": "These are the Conservative Party, the Labour Party, the Liberal Democrats, or one of the parties representing Scottish, Welsh or Northern Irish interests."}, {"t": "p", "x": "There are a few MPs who do not represent any of the main political parties. They are called ‘independents’ and usually represent an issue important to their constituency."}, {"t": "p", "x": "The main political parties actively look for members of the public to join their debates, contribute to their costs, and help at elections for Parliament or for local government. They have branches in most constituencies and hold policy-making conferences every year."}, {"t": "p", "x": "Pressure and lobby groups are organisations which try to influence government policy. They play an important role in politics. Some are representative organisations such as the CBI (Confederation of British Industry), which represents the views of British business. Others campaign on particular topics, such as the environment (for example, Greenpeace) or human rights (for example, Liberty)."}, {"t": "p", "x": "The civil service"}, {"t": "p", "x": "Civil servants support the government in developing and implementing its policies. They also deliver public services. Civil servants are accountable to ministers."}, {"t": "p", "x": "They are chosen on merit and are politically neutral – they are not political appointees. People can apply to join the civil service through an application process, like other jobs in the UK. Civil servants are expected to carry out their role with dedication and a commitment to the civil service and its core values. These are: integrity, honesty, objectivity and impartiality (including being politically neutral)."}, {"t": "p", "x": "Local government"}, {"t": "p", "x": "Towns, cities and rural areas in the UK are governed by democratically elected councils, often called ‘local authorities’. Some areas have both district and county councils, which have different functions. Most large towns and cities have a single local authority."}, {"t": "p", "x": "Local authorities provide a range of services in their areas. They are funded by money from central government and by local taxes."}, {"t": "p", "x": "Many local authorities appoint a mayor, who is the ceremonial leader of the council. In some towns, a mayor is elected to be the effective leader of the administration. London has 33 local authorities, with the Greater London Authority and the Mayor of London coordinating policies across the capital. For most local authorities, local elections for councillors are held in May every year. Many candidates stand for council election as members of a political party."}, {"t": "p", "x": "Devolved administrations"}, {"t": "p", "x": "Since 1997, some powers have been devolved from the central government to give people in Wales, Scotland and Northern Ireland more control over matters that directly affect them. There has been a Welsh Assembly and a Scottish Parliament since 1999. There is also a Northern Ireland Assembly, although this has been suspended on a few occasions."}, {"t": "p", "x": "Policy and laws governing defence, foreign affairs, immigration, taxation and social security all remain under central UK government control. However, many other public services, such as education, are controlled by the devolved administrations."}, {"t": "p", "x": "The devolved administrations each have their own civil service."}, {"t": "p", "x": "The Welsh government"}, {"t": "p", "x": "The Welsh government and National Assembly for Wales are based in Cardiff, the capital city of Wales. The National Assembly has 60 Assembly members (AMs) and elections are held every four years using a form of proportional representation. Members can speak in either Welsh or English and all of the Assembly’s publications are in both languages."}, {"t": "p", "x": "The Assembly has the power to make laws for Wales in 20 areas, including: education and training health and social services economic development housing."}, {"t": "p", "x": "Since 2011, the National Assembly for Wales has been able to pass laws on these topics without the agreement of the UK Parliament."}, {"t": "p", "x": "The Scottish Parliament"}, {"t": "p", "x": "The Scottish Parliament was formed in 1999. It sits in Edinburgh, the capital city of Scotland."}, {"t": "p", "x": "There are 129 members of the Scottish Parliament (MSPs), elected by a form of proportional representation. The Scottish Parliament can pass laws for Scotland on all matters which are not specifically reserved to the UK Parliament. The matters on which the Scottish Parliament can legislate include: civil and criminal law health education planning additional tax-raising powers."}, {"t": "p", "x": "The Northern Ireland Assembly"}, {"t": "p", "x": "A Northern Ireland Parliament was established in 1922, when Ireland was divided, but it was abolished in 1972, shortly after the Troubles broke out in 1969."}, {"t": "p", "x": "The Northern Ireland Assembly was established soon after the Belfast Agreement (or Good Friday Agreement) in 1998. There is a power-sharing agreement which distributes ministerial Offices amongst the main parties. The Assembly has 90 elected members, known as MLAs (members of the Legislative Assembly). They are elected with a form of proportional representation."}, {"t": "p", "x": "The Northern Ireland Assembly can make decisions on issues such as: education agriculture the environment health social services."}, {"t": "p", "x": "The UK government has the power to suspend all devolved assemblies. It has used this power several times in Northern Ireland when local political leaders found it difficult to work together. However, the Assembly has been running successfully since 2007."}, {"t": "p", "x": "The media and government"}, {"t": "p", "x": "Proceedings in Parliament are broadcast on television and published in official reports called Hansard. Written reports can be found in large libraries and at www.parliament.uk. Most people get information about political issues and events from newspapers (often called ‘the press’), television, radio and the internet."}, {"t": "p", "x": "The UK has a free press. This means that what is written in newspapers is free from government control. Some newspaper owners and editors hold strong political opinions and run campaigns to try to influence government policy and public opinion."}, {"t": "p", "x": "By law, radio and television coverage of the political parties must be balanced and so equal time has to be given to rival viewpoints."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The role of the Prime Minister, cabinet, opposition and shadow cabinet"}, {"t": "check", "x": "The role of political parties in the UK system of government"}, {"t": "check", "x": "Who the main political parties are"}, {"t": "check", "x": "What pressure and lobby groups do"}, {"t": "check", "x": "The role of the civil service"}, {"t": "check", "x": "The role of local government"}, {"t": "check", "x": "The powers of the devolved governments in Wales, Scotland and Northern Ireland"}, {"t": "check", "x": "How proceedings in Parliament are recorded"}, {"t": "check", "x": "The role of the media in keeping people informed about political issues"}, {"t": "p", "x": "5.6.1 Who can vote?"}, {"t": "p", "x": "The UK has had a fully democratic voting system since 1928. The present voting age of 18 was set in 1969 and (with a few exceptions) all UK-born and naturalised adult citizens have the right to vote."}, {"t": "p", "x": "Adult citizens of the UK, and citizens of the Commonwealth and the Irish"}, {"t": "p", "x": "Republic who are resident in the UK, can vote in all public elections. Adult citizens of other EU states who are resident in the UK can vote in all elections except General Elections."}, {"t": "p", "x": "The electoral register"}, {"t": "p", "x": "To be able to vote in a parliamentary, local or European election, you must have your name on the electoral register."}, {"t": "p", "x": "If you are eligible to vote, you can register by contacting your local council electoral registration Office. This is usually based at your local council (in"}, {"t": "p", "x": "Scotland it may be based elsewhere). If you don’t know which local authority you come under, you can find out by visiting www.aboutmyvote.co.uk and entering your postcode. You can also download voter registration forms in English, Welsh and some other languages."}, {"t": "p", "x": "The electoral register is updated every year in September or October. An electoral registration form is sent to every household and this has to be completed and returned with the names of everyone who is resident in the household and eligible to vote."}, {"t": "p", "x": "In Northern Ireland a different system operates. This is called ‘individual registration’ and all those entitled to vote must complete their own registration form. Once registered, people stay on the register provided their personal details do not change. For more information see the Electoral"}, {"t": "p", "x": "Office for Northern Ireland website at www.eoni.org.uk"}, {"t": "p", "x": "By law, each local authority has to make its electoral register available for anyone to look at, although this has to be supervised. The register is kept at each local electoral registration Office (or council Office in England and"}, {"t": "p", "x": "Wales). It is also possible to see the register at some public buildings such as libraries."}, {"t": "p", "x": "Where to vote"}, {"t": "p", "x": "Polling station with a ballot box displayed"}, {"t": "p", "x": "People vote in elections at places called polling stations, or polling places in"}, {"t": "p", "x": "Scotland. Before the election you will be sent a poll card. This tells you where your polling station or polling place is and when the election will take place. On election day, the polling station or place will be open from 7.00 am until 10.00 pm."}, {"t": "p", "x": "When you arrive at the polling station, the staff will ask for your name and address. In Northern Ireland you will also have to show photographic identification. You will then get your ballot paper, which you take to a polling booth to fill in privately. You should make up your own mind who to vote for. No one has the right to make you vote for a particular candidate."}, {"t": "p", "x": "You should follow the instructions on the ballot paper. Once you have completed it, put it in the ballot box."}, {"t": "p", "x": "If it is difficult for you to get to a polling station or polling place, you can register for a postal ballot. Your ballot paper will be sent to your home before the election. You then fill it in and post it back. You can choose to do this when you register to vote."}, {"t": "p", "x": "Standing for office"}, {"t": "p", "x": "Most citizens of the UK, the Irish Republic or the Commonwealth aged 18 or over can stand for public Office. There are some exceptions, including: members of the armed forces civil servants people found guilty of certain criminal offences."}, {"t": "p", "x": "Members of the House of Lords may not stand for election to the House of"}, {"t": "p", "x": "Commons but are eligible for all other public Offices."}, {"t": "p", "x": "Visiting Parliament and the devolved administrations"}, {"t": "p", "x": "The UK Parliament"}, {"t": "p", "x": "The public can listen to debates in the Palace of Westminster from public galleries in both the House of Commons and the House of Lords."}, {"t": "p", "x": "You can write to your local MP in advance to ask for tickets or you can queue on the day at the public entrance. Entrance is free. Sometimes there are long queues for the House of Commons and people have to wait for at least one to two hours. It is usually easier to get in to the House of Lords."}, {"t": "p", "x": "You can find further information on the UK Parliament website at www.parliament.uk."}, {"t": "p", "x": "Northern Ireland Assembly"}, {"t": "p", "x": "In Northern Ireland elected members, known as MLAs, meet in the"}, {"t": "p", "x": "Northern Ireland Assembly at Stormont, in Belfast."}, {"t": "p", "x": "There are two ways to arrange a visit to Stormont. You can either contact the"}, {"t": "p", "x": "Education Service (details are on the Northern Ireland Assembly website at www.niassembly.gov.uk) or contact an MLA."}, {"t": "p", "x": "Scottish Parliament"}, {"t": "p", "x": "In Scotland the elected members, called MSPs, meet in the Scottish"}, {"t": "p", "x": "Parliament building at Holyrood in Edinburgh (for more information, see www.scottish.parliament.uk)."}, {"t": "p", "x": "You can get information, book tickets or arrange tours through visitor services. You can write to them at the Scottish Parliament, Edinburgh, EH99"}, {"t": "p", "x": "1SP, telephone 0131 348 5200 or email sp.bookings@scottish.parliament.uk"}, {"t": "p", "x": "National Assembly for Wales"}, {"t": "p", "x": "In Wales the elected members, known as AMs, meet in the Welsh Assembly in the Senedd in Cardiff Bay (for more information, see www.wales.gov.uk)."}, {"t": "p", "x": "The Senedd is an open building. You can book guided tours or seats in the public galleries for the Welsh Assembly. To make a booking, contact the"}, {"t": "p", "x": "Assembly Booking Service on 0845 010 5500 or email assembly.bookings@wales.gsi.gov.uk"}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "Who is eligible to vote"}, {"t": "check", "x": "How you register to vote"}, {"t": "check", "x": "How to vote"}, {"t": "check", "x": "Who can stand for public Office"}, {"t": "check", "x": "How you can visit Parliament, the Northern Ireland Assembly, the Scottish Parliament and the Welsh Assembly"}]}, {"id": "5.7", "title": "The UK and international institutions", "blocks": [{"t": "p", "x": "The Commonwealth"}, {"t": "p", "x": "The Commonwealth is an association of countries that support each other and work together towards shared goals in democracy and development. Most member states were once part of the British Empire, although a few countries which were not have also joined."}, {"t": "p", "x": "The monarch (currently King Charles III) is the ceremonial head of the Commonwealth, which currently has 54 member states. Membership is voluntary. The Commonwealth has no power over its members, although it can suspend membership. The Commonwealth is based on the core values of democracy, good government and the rule of law."}, {"t": "p", "x": "Commonwealth members"}, {"t": "p", "x": "There 56 member states:"}, {"t": "p", "x": "Africa"}, {"t": "p", "x": "Asia"}, {"t": "p", "x": "Caribbean and Americas"}, {"t": "p", "x": "Europe"}, {"t": "p", "x": "Pacific"}, {"t": "p", "x": "Botswana"}, {"t": "p", "x": "Bangladesh"}, {"t": "p", "x": "Antigua and Barbuda"}, {"t": "p", "x": "Cyprus"}, {"t": "p", "x": "Australia"}, {"t": "p", "x": "Cameroon"}, {"t": "p", "x": "Brunei Darussalam"}, {"t": "p", "x": "Bahamas, The"}, {"t": "p", "x": "Malta"}, {"t": "p", "x": "Fiji"}, {"t": "p", "x": "Gabon"}, {"t": "p", "x": "India"}, {"t": "p", "x": "Barbados"}, {"t": "p", "x": "United Kingdom"}, {"t": "p", "x": "Kiribati"}, {"t": "p", "x": "Gambia, The"}, {"t": "p", "x": "Malaysia"}, {"t": "p", "x": "Belize"}, {"t": "p", "x": "Nauru"}, {"t": "p", "x": "Ghana"}, {"t": "p", "x": "Maldives"}, {"t": "p", "x": "Canada"}, {"t": "p", "x": "New Zealand"}, {"t": "p", "x": "Kenya"}, {"t": "p", "x": "Pakistan"}, {"t": "p", "x": "Dominica"}, {"t": "p", "x": "Papua New Guinea"}, {"t": "p", "x": "Kingdom of Eswatini"}, {"t": "p", "x": "Singapore"}, {"t": "p", "x": "Grenada"}, {"t": "p", "x": "Samoa"}, {"t": "p", "x": "Lesotho"}, {"t": "p", "x": "Sri Lanka"}, {"t": "p", "x": "Guyana"}, {"t": "p", "x": "Solomon Islands"}, {"t": "p", "x": "Malawi"}, {"t": "p", "x": "Jamaica"}, {"t": "p", "x": "Tonga"}, {"t": "p", "x": "Mauritius"}, {"t": "p", "x": "Saint Lucia"}, {"t": "p", "x": "Tuvalu"}, {"t": "p", "x": "Mozambique"}, {"t": "p", "x": "St Kitts and Nevis"}, {"t": "p", "x": "Vanuatu"}, {"t": "p", "x": "Namibia"}, {"t": "p", "x": "St Vincent and The Grenadines"}, {"t": "p", "x": "Nigeria"}, {"t": "p", "x": "Trinidad and Tobago"}, {"t": "p", "x": "Rwanda"}, {"t": "p", "x": "Seychelles"}, {"t": "p", "x": "Sierra Leone"}, {"t": "p", "x": "South
