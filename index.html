are still in use today."}, {"t": "p", "x": "British industry led the world in the 19th century. The UK produced more than half of the world’s iron, coal and cotton cloth. The UK also became a centre for financial services, including insurance and banking. In 1851, the Great Exhibition opened in Hyde Park in the Crystal Palace, a huge building made of steel and glass. Exhibits ranged from huge machines to handmade goods. Countries from all over the world showed their goods but most of the objects were made in Britain."}, {"t": "p", "x": "The Crimean War"}, {"t": "p", "x": "From 1853 to 1856, Britain fought with Turkey and France against Russia in the Crimean War. It was the first war to be extensively covered by the media through news stories and photographs. The conditions were very poor and many soldiers died from illnesses they caught in the hospitals, rather than from war wounds."}, {"t": "p", "x": "Queen Victoria introduced the Victoria Cross medal during this war. It honours acts of valour by soldiers."}, {"t": "p", "x": "FLORENCE NIGHTINGALE (1820–1910)"}, {"t": "p", "x": "Florence Nightingale was born in Italy to English parents. At the age of 31, she trained as a nurse in Germany. In 1854, she went to Turkey and worked in military hospitals, treating soldiers who were fighting in the Crimean War. She and her fellow nurses improved the conditions in the hospital and reduced the mortality rate."}, {"t": "p", "x": "In 1860 she established the Nightingale Training School for nurses at St Thomas’ Hospital in London. The school was the first of its kind and still exists today, as do many of the practices that Florence used. She is often regarded as the founder of modern nursing."}, {"t": "p", "x": "Ireland in the 19th century"}, {"t": "p", "x": "Conditions in Ireland were not as good as in the rest of the UK. Two-thirds of the population still depended on farming to make their living, often on very small plots of land. Many depended on potatoes as a large part of their diet. In the middle of the century the potato crop failed, and Ireland suffered a famine. A million people died from disease and starvation. Another million and a half left Ireland. Some emigrated to the United States and others came to England. By 1861 there were large populations of Irish people in cities such as Liverpool, London, Manchester and Glasgow."}, {"t": "p", "x": "The Irish Nationalist movement had grown strongly through the 19th century. Some, such as the Fenians, favoured complete independence. Others, such as Charles Stuart Parnell, advocated ‘Home Rule’, in which Ireland would remain in the UK but have its own parliament."}, {"t": "p", "x": "The right to vote"}, {"t": "p", "x": "As the middle classes in the wealthy industrial towns and cities grew in influence, they began to demand more political power. The Reform Act of 1832 had greatly increased the number of people with the right to vote. The Act also abolished the old pocket and rotten boroughs (see Chapter 4) and more parliamentary seats were given to the towns and cities. There was a permanent shift of political power from the countryside to the towns but voting was still based on ownership of property."}, {"t": "p", "x": "This meant that members of the working class were still unable to vote."}, {"t": "p", "x": "A movement began to demand the vote for the working classes and other people without property. Campaigners, called the Chartists, presented petitions to Parliament. At first they seemed to be unsuccessful, but in 1867 there was another Reform Act. This created many more urban seats in Parliament and reduced the amount of property that people needed to have before they could vote. However, the majority of men still did not have the right to vote and no women could vote."}, {"t": "p", "x": "Politicians realised that the increased number of voters meant that they needed to persuade people to vote for them if they were to be sure of being elected to Parliament. The political parties began to create organisations to reach out to ordinary voters. Universal suffrage (the right of every adult, male or female, to vote) followed in the next century."}, {"t": "p", "x": "In common with the rest of Europe, women in 19th century Britain had fewer rights than men. Until 1870, when a woman got married, her earnings, property and money automatically belonged to her husband. Acts of Parliament in 1870 and 1882 gave wives the right to keep their own earnings and property. In the late 19th and early 20th centuries, an increasing number of women campaigned and demonstrated for greater rights and, in particular, the right to vote. They formed the women’s suffrage movement and became known as ‘suffragettes’."}, {"t": "p", "x": "EMMELINE PANKHURST (1858–1928)"}, {"t": "p", "x": "Emmeline Pankhurst was born in Manchester in 1858. She set up the Women’s Franchise League in 1889, which fought to get the vote in local elections for married women. In 1903 she helped found the Women’s Social and Political Union (WSPU). This was the first group whose members were called ‘suffragettes’. The group used civil disobedience as part of their protest to gain the vote for women. They chained themselves to railings, smashed windows and committed arson. Many of the women, including Emmeline, went on hunger strike. In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War. Shortly before Emmeline’s death in 1928, women were given the right to vote at the age of 21, the same as men."}, {"t": "p", "x": "The future of the Empire"}, {"t": "p", "x": "Although the British Empire continued to grow until the 1920s, there was already discussion in the late 19th century about its future direction. Supporters of expansion believed that the Empire benefited Britain through increased trade and commerce. Others thought the Empire had become over-expanded and that the frequent conflicts in many parts of the Empire, such as India’s north-west frontier or southern Africa, were a drain on resources. Yet the great majority of British people believed in the Empire as a force for good in the world."}, {"t": "p", "x": "The Boer War of 1899 to 1902 made the discussions about the future of the Empire more urgent. The British went to war in South Africa with settlers from the Netherlands called the Boers. The Boers fought fiercely and the war went on for over three years. Many died in the fighting and many more from disease. There was some public sympathy for the Boers and people began to question whether the Empire could continue. As different parts of the Empire developed, they won greater freedom and autonomy from Britain. Eventually, by the second half of the 20th century, there was, for the most part, an orderly transition from Empire to Commonwealth, with countries being granted their independence."}, {"t": "p", "x": "RUDYARD KIPLING (1865–1936)"}, {"t": "p", "x": "Rudyard Kipling was born in India in 1865 and later lived in India, the UK and the USA. He wrote books and poems set in both India and the UK. His poems and novels reflected the idea that the British Empire was a force for good. Kipling was awarded the Nobel Prize in Literature in 1907. His books include the Just So Stories and The Jungle Book, which continue to be popular today. His poem If has often been voted among the UK’s favourite poems. It begins with these words:"}, {"t": "p", "x": "‘If you can keep your head when all about you"}, {"t": "p", "x": "Are losing theirs and blaming it on you;"}, {"t": "p", "x": "If you can trust yourself when all men doubt you,"}, {"t": "p", "x": "But make allowance for their doubting too;"}, {"t": "p", "x": "If you can wait and not be tired by waiting,"}, {"t": "p", "x": "Or being lied about, don’t deal in lies,"}, {"t": "p", "x": "Or being hated, don’t give way to hating,"}, {"t": "p", "x": "And yet don’t look too good, nor talk too wise’"}, {"t": "p", "x": "(If, Rudyard Kipling)"}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The change in the balance of power between Parliament and the monarchy"}, {"t": "check", "x": "When and why Scotland joined England and Wales to become Great Britain"}, {"t": "check", "x": "The reasons for a rebellion in Scotland led by Bonnie Prince Charlie"}, {"t": "check", "x": "The ideas of the Enlightenment"}, {"t": "check", "x": "The importance of the Industrial Revolution and development of industry"}, {"t": "check", "x": "The slave trade and when it was abolished"}, {"t": "check", "x": "The growth of the British Empire"}, {"t": "check", "x": "How democracy developed during this period"}]}, {"id": "3.4", "title": "The 20th century", "blocks": [{"t": "p", "x": "The First World War"}, {"t": "p", "x": "The early 20th century was a time of optimism in Britain. The nation, with its expansive Empire, well-admired navy, thriving industry and strong political institutions, was what is now known as a global ‘superpower’. It was also a time of social progress. Financial help for the unemployed, old-age pensions and free school meals were just a few of the important measures introduced. Various laws were passed to improve safety in the workplace; town planning rules were tightened to prevent the further development of slums; and better support was given to mothers and their children after divorce or separation. Local government became more democratic and a salary for members of Parliament (MPs) was introduced for the first time, making it easier for more people to take part in public life."}, {"t": "p", "x": "Representation of the First World War"}, {"t": "p", "x": "This era of optimism and progress was cut short when war broke out between several European nations. On 28 June 1914, Archduke Franz Ferdinand of Austria was assassinated. This set off a chain of events leading to the First World War (1914–18). But while the assassination provided the trigger for war, other factors – such as a growing sense of nationalism in many European states; increasing militarism; imperialism; and the division of the major European powers into two camps – all set the conditions for war."}, {"t": "p", "x": "The conflict was centred in Europe, but it was a global war involving nations from around the world. Britain was part of the Allied Powers, which included (amongst others) France, Russia, Japan, Belgium, Serbia – and later, Greece, Italy, Romania and the United States. The whole of the British Empire was involved in the conflict – for example, more than a million Indians fought on behalf of Britain in lots of different countries, and around 40,000 were killed. Men from the West Indies, Africa, Australia, New Zealand and Canada also fought with the British. The Allies fought against the Central Powers – mainly Germany, the Austro- Hungarian Empire, the Ottoman Empire and later Bulgaria. Millions of people were killed or wounded, with more than 2 million British casualties. One battle, the British attack on the Somme in July 1916, resulted in about 60,000 British casualties on the first day alone."}, {"t": "p", "x": "The First World War ended at 11.00 am on 11th November 1918 with victory for Britain and its allies."}, {"t": "p", "x": "The partition of Ireland"}, {"t": "p", "x": "In 1913, the British government promised ‘Home Rule’ for Ireland. The proposal was to have a self-governing Ireland with its own parliament but still part of the UK. A Home Rule Bill was introduced in Parliament. It was opposed by the Protestants in the north of Ireland, who threatened to resist Home Rule by force."}, {"t": "p", "x": "The outbreak of the First World War led the British government to postpone any changes in Ireland. Irish Nationalists were not willing to wait and in 1916 there was an uprising (the Easter Rising) against the British in Dublin. The leaders of the uprising were executed under military law. A guerrilla war against the British army and the police in Ireland followed. In 1921 a peace treaty was signed and in 1922 Ireland became two countries. The six counties in the north which were mainly Protestant remained part of the UK under the name Northern Ireland. The rest of Ireland became the Irish Free State. It had its own government and became a republic in 1949."}, {"t": "p", "x": "There were people in both parts of Ireland who disagreed with the split between the North and the South. They still wanted Ireland to be one independent country."}, {"t": "p", "x": "Years of disagreement led to a terror campaign in Northern Ireland and elsewhere. The conflict between those wishing for full Irish independence and those wishing to remain loyal to the British government is often referred to as ‘the Troubles’."}, {"t": "p", "x": "The inter-war period"}, {"t": "p", "x": "In the 1920s, many people’s living conditions got better. There were improvements in public housing and new homes were built in many towns and cities. However, in 1929, the world entered the ‘Great Depression’ and some parts of the UK suffered mass unemployment. The effects of the depression of the 1930s were felt differently in different parts of the UK. The traditional heavy industries such as shipbuilding were badly affected but new industries – including the automobile and aviation industries – developed. As prices generally fell, those in work had more money to spend. Car ownership doubled from 1 million to 2 million between 1930 and 1939. In addition, many new houses were built. It was also a time of cultural blossoming, with writers such as Graham Greene and Evelyn Waugh prominent."}, {"t": "p", "x": "The economist John Maynard Keynes published influential new theories of economics. The BBC started radio broadcasts in 1922 and began the world’s first regular television service in 1936."}, {"t": "p", "x": "The Second World War"}, {"t": "p", "x": "Adolf Hitler came to power in Germany in 1933. He believed that the conditions imposed on Germany by the Allies after the First World War were unfair; he also wanted to conquer more land for the German people. He set about renegotiating treaties, building up arms, and testing Germany’s military strength in nearby countries. The British government tried to avoid another war. However, when Hitler invaded Poland in 1939, Britain and France declared war in order to stop his aggression."}, {"t": "p", "x": "The war was initially fought between the Axis powers (fascist Germany and Italy and the Empire of Japan) and the Allies. The main countries on the allied side were the UK, France, Poland, Australia, New Zealand, Canada, and the Union of South Africa."}, {"t": "p", "x": "Having occupied Austria and invaded Czechoslovakia, Hitler followed his invasion of Poland by taking control of Belgium and the Netherlands. Then, in 1940, German forces defeated allied troops and advanced through France. At this time of national crisis, Winston Churchill became Prime Minister and Britain’s war leader."}, {"t": "p", "x": "As France fell, the British decided to evacuate British and French soldiers from France in a huge naval operation. Many civilian volunteers in small pleasure and fishing boats from Britain helped the Navy to rescue more than 300,000 men from the beaches around Dunkirk. Although many lives and a lot of equipment were lost, the evacuation was a success and meant that Britain was better able to continue the fight against the Germans. The evacuation gave rise to the phrase ‘the Dunkirk spirit’."}, {"t": "p", "x": "From the end of June 1940 until the German invasion of the Soviet Union in June 1941, Britain and the Empire stood almost alone against Nazi Germany."}, {"t": "p", "x": "Hitler wanted to invade Britain, but before sending in troops, Germany needed to control the air. The Germans waged an air campaign against Britain, but the British resisted with their fighter planes and eventually won the crucial aerial battle against the Germans, called ‘the Battle of Britain’, in the summer of 1940. The most important planes used by the Royal Air Force in the Battle of Britain were the Spitfire and the Hurricane – which were designed and built in Britain. Despite this crucial victory, the German air force was able to continue bombing London and other British cities at night-time. This was called the Blitz. Coventry was almost totally destroyed and a great deal of damage was done in other cities, especially in the East End of London. Despite the destruction, there was a strong national spirit of resistance in the UK. The phrase ‘the Blitz spirit’ is still used today to describe Britons pulling together in the face of adversity."}, {"t": "p", "x": "Second World War Planes"}, {"t": "p", "x": "WINSTON CHURCHILL (1874–1965)"}, {"t": "p", "x": "Churchill was the son of a politician and, before becoming a Conservative MP in 1900, was a soldier and journalist. In May 1940 he became Prime Minister. He refused to surrender to the Nazis and was an inspirational leader to the British people in a time of great hardship. He lost the General Election in 1945 but returned as Prime Minister in 1951."}, {"t": "p", "x": "He was an MP until he stood down at the 1964 General Election. Following his death in 1965, he was given a state funeral. He remains a much-admired figure to this day, and in 2002 was voted the greatest Briton of all time by the public. During the War, he made many famous speeches including lines which you may still hear:"}, {"t": "p", "x": "‘I have nothing to offer but blood, toil, tears and sweat’"}, {"t": "p", "x": "Churchill’s first speech to the House of Commons after he became Prime Minister, 1940"}, {"t": "p", "x": "‘We shall fight on the beaches, we shall fight on the landing grounds, we shall fight in the fields and in the streets, we shall fight in the hills; we shall never surrender’"}, {"t": "p", "x": "Speech to the House of Commons after Dunkirk 1940"}, {"t": "p", "x": "‘Never in the field of human conflict was so much owed by so many to so few’ Speech to the House of Commons during the Battle of Britain, 1940 At the same time as defending Britain, the British military was fighting the Axis on many other fronts. In Singapore, the Japanese defeated the British and then occupied Burma, threatening India. The United States entered the war when the Japanese bombed its naval base at Pearl Harbour in December 1941."}, {"t": "p", "x": "That same year, Hitler attempted the largest invasion in history by attacking the Soviet Union. It was a fierce conflict, with huge losses on both sides. German forces were ultimately repelled by the Soviets, and the damage they sustained proved to be a pivotal point in the war."}, {"t": "p", "x": "The allied forces gradually gained the upper hand, winning significant victories in North Africa and Italy. German losses in the Soviet Union, combined with the support of the Americans, meant that the Allies were eventually strong enough to attack Hitler’s forces in Western Europe. On 6 June 1944, allied forces landed in Normandy (this event is often referred to as ‘D-Day’). Following victory on the beaches of Normandy, the allied forces pressed on through France and eventually into Germany. The Allies comprehensively defeated Germany in May 1945."}, {"t": "p", "x": "The war against Japan ended in August 1945 when the United States dropped its newly developed atom bombs on the Japanese cities of Hiroshima and Nagasaki."}, {"t": "p", "x": "Scientists led by Ernest Rutherford, working at Manchester and then Cambridge University, were the first to ‘split the atom’ and took part in the Manhattan Project in the United States, which developed the atomic bomb. The war was finally over."}, {"t": "p", "x": "ALEXANDER FLEMING (1881–1955)"}, {"t": "p", "x": "Born in Scotland, Fleming moved to London as a teenager and later qualified as a doctor. He was researching influenza (the ‘flu’) in 1928 when he discovered penicillin. This was then further developed into a usable drug by the scientists Howard Florey and Ernst Chain. By the 1940s it was in mass production. Fleming won the Nobel Prize in Medicine in 1945. Penicillin is still used to treat bacterial infections today."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "What happened during the First World War"}, {"t": "check", "x": "The partition of Ireland and the establishment of the UK as it is today"}, {"t": "p", "x": "The events of the Second World War"}]}, {"id": "3.2", "title": "Britain since 1945", "blocks": [{"t": "p", "x": "The welfare state"}, {"t": "p", "x": "Although the UK had won the war, the country was exhausted economically and the people wanted change. During the war, there had been significant reforms to the education system and people now looked for wider social reforms."}, {"t": "p", "x": "In 1945 the British people elected a Labour government. The new Prime Minister was Clement Atlee, who promised to introduce the welfare state outlined in the Beveridge Report. In 1948, Aneurin (Nye) Bevan, the Minister for Health, led the establishment of the National Health Service (NHS), which guaranteed a minimum standard of health care for all, free at the point of use. A national system of benefits was also introduced to provide ‘social security’, so that the population would be protected from the ‘cradle to the grave’. The government took into public ownership (nationalised) the railways, coal mines and gas, water and electricity supplies."}, {"t": "p", "x": "Another aspect of change was self-government for former colonies. In 1947, independence was granted to nine countries, including India, Pakistan and Ceylon (now Sri Lanka). Other colonies in Africa, the Caribbean and the Pacific achieved independence over the next 20 years."}, {"t": "p", "x": "The UK developed its own atomic bomb and joined the new North Atlantic Treaty Organization (NATO), an alliance of nations set up to resist the perceived threat of invasion by the Soviet Union and its allies."}, {"t": "p", "x": "Britain had a Conservative government from 1951 to 1964. The 1950s were a period of economic recovery after the war and increasing prosperity for working people. The Prime Minister of the day, Harold Macmillan, was famous for his ‘wind of change’ speech about decolonisation and independence for the countries of the Empire."}, {"t": "p", "x": "CLEMENT ATTLEE (1883–1967)"}, {"t": "p", "x": "Clement Attlee"}, {"t": "p", "x": "Clement Attlee was born in London in 1883. His father was a solicitor and, after studying at Oxford University, Attlee became a barrister. He gave this up to do social work in East London and eventually became a Labour MP. He was Winston Churchill’s Deputy Prime Minister in the wartime coalition government and became Prime Minister after the Labour Party won the 1945 election. He was Prime Minister from 1945 to 1951 and led the Labour Party for 20 years. Attlee’s government undertook the nationalisation of major industries (like coal and steel), created the National Health Service and implemented many of Beveridge’s plans for a stronger welfare state. Attlee also introduced measures to improve the conditions of workers."}, {"t": "p", "x": "WILLIAM BEVERIDGE (1879–1963)"}, {"t": "p", "x": "William Beveridge (later Lord Beveridge) was a British economist and social reformer. He served briefly as a Liberal MP and was subsequently the leader of the Liberals in the House of Lords but is best known for the 1942 report Social Insurance and Allied Services (known as the Beveridge Report). The report was commissioned by the wartime government in 1941. It recommended that the government should find ways of fighting the five ‘Giant Evils’ of Want, Disease, Ignorance, Squalor and Idleness and provided the basis of the modern welfare state."}, {"t": "p", "x": "R A BUTLER (1902–82)"}, {"t": "p", "x": "Richard Austen Butler (later Lord Butler) was born in 1902. He became a Conservative MP in 1923 and held several positions before becoming responsible for education in 1941. In this role, he oversaw the introduction of the Education Act 1944 (often called ‘The Butler Act’), which introduced free secondary education in England and Wales. The education system has changed significantly since the Act was introduced, but the division between primary and secondary schools that it enforced still remains in most areas of Britain."}, {"t": "p", "x": "DYLAN THOMAS (1914–53)"}, {"t": "p", "x": "Dylan Thomas was a Welsh poet and writer. He often read and performed his work in public, including for the BBC. His most well-known works include the radio play Under Milk Wood, first performed after his death in 1954, and the poem Do Not Go Gentle into That Good Night, which he wrote for his dying father in 1952."}, {"t": "p", "x": "He died at the age of 39 in New York. There are several memorials to him in his birthplace, Swansea, including a statue and the Dylan Thomas Centre."}, {"t": "p", "x": "Migration in post-war Britain"}, {"t": "p", "x": "Rebuilding Britain after the Second World War was a huge task. There were labour shortages and the British government encouraged workers from Ireland and other parts of Europe to come to the UK and help with the reconstruction. In 1948, people from the West Indies were also invited to come and work."}, {"t": "p", "x": "During the 1950s, there was still a shortage of labour in the UK. Further immigration was therefore encouraged for economic reasons, and many industries advertised for workers from overseas. For example, centres were set up in the West Indies to recruit people to drive buses. Textile and engineering firms from the north of England and the Midlands sent agents to India and Pakistan to find workers. For about 25 years, people from the West Indies, India, Pakistan and (later) Bangladesh travelled to work and settle in Britain."}, {"t": "p", "x": "Social change in the 1960s"}, {"t": "p", "x": "The decade of the 1960s was a period of significant social change. It was known as ‘the Swinging Sixties’. There was growth in British fashion, cinema and popular music. Two well-known pop music groups at the time were The Beatles and The Rolling Stones. People started to become better off and many bought cars and other consumer goods."}, {"t": "p", "x": "It was also a time when social laws were liberalised, for example in relation to divorce and to abortion in England, Wales and Scotland. The position of women in the workplace also improved. It was quite common at the time for employers to ask women to leave their jobs when they got married, but Parliament passed new laws giving women the right to equal pay and made it illegal for employers to discriminate against women because of their gender."}, {"t": "p", "x": "The 1960s was also a time of technological progress. Britain and France developed the world’s only supersonic commercial airliner, Concorde. New styles of architecture, including high-rise buildings and the use of concrete and steel, became common."}, {"t": "p", "x": "The number of people migrating from the West Indies, India, Pakistan and what is now Bangladesh fell in the late 1960s because the government passed new laws to restrict immigration to Britain. Immigrants were required to have a strong connection to Britain through birth or ancestry. Even so, during the early 1970s, Britain admitted 28,000 people of Indian origin who had been forced to leave Uganda."}, {"t": "p", "x": "SOME GREAT BRITISH INVENTIONS OF THE 20TH CENTURY"}, {"t": "p", "x": "Britain has given the world some wonderful inventions. Examples from the 20th century include:"}, {"t": "p", "x": "The television was developed by Scotsman John Logie Baird (1888–1946) in the 1920s. In 1932 he made the first television broadcast between London and Glasgow."}, {"t": "p", "x": "Radar was developed by Scotsman Sir Robert Watson-Watt (1892–1973), who proposed that enemy aircraft could be detected by radio waves. The first successful radar test took place in 1935."}, {"t": "p", "x": "Working with radar led Sir Bernard Lovell (1913–2012) to make new discoveries in astronomy. The radio telescope he built at Jodrell Bank in Cheshire was for many years the biggest in the world and continues to operate today."}, {"t": "p", "x": "A Turing machine is a theoretical mathematical device invented by Alan Turing (1912–54), a British mathematician, in the 1930s. The theory was influential in the development of computer science and the modern-day computer."}, {"t": "p", "x": "The Scottish physician and researcher John MacLeod (1876–1935) was the co-discoverer of insulin, used to treat diabetes."}, {"t": "p", "x": "The structure of the DNA molecule was discovered in 1953 through work at British universities in London and Cambridge. This discovery contributed to many scientific advances, particularly in medicine and fighting crime. Francis Crick (1916–2004), one of those awarded the Nobel Prize for this discovery, was British."}, {"t": "p", "x": "The jet engine was developed in Britain in the 1930s by Sir Frank Whittle (1907–96), a British Royal Air Force engineer Officer."}, {"t": "p", "x": "Sir Christopher Cockerell (1910–99), a British inventor, invented the hovercraft in the 1950s."}, {"t": "p", "x": "Britain and France developed Concorde, the world’s only supersonic passenger aircraft. It first flew in 1969 and began carrying passengers in 1976. Concorde was retired from service in 2003."}, {"t": "p", "x": "The Harrier jump jet, an aircraft capable of taking off vertically, was also designed and developed in the UK."}, {"t": "p", "x": "In the 1960s, James Goodfellow (1937–) invented the cash-dispensing ATM (automatic teller machine) or ‘cashpoint’. The first of these was put into use by Barclays Bank in Enfield, north London in 1967."}, {"t": "p", "x": "IVF (in-vitro fertilisation) therapy for the treatment of infertility was pioneered in Britain by physiologist Sir Robert Edwards (1925–) and gynaecologist Patrick Steptoe (1913–88). The world’s first ‘test-tube baby’ was born in Oldham, Lancashire in 1978."}, {"t": "p", "x": "In 1996, two British scientists, Sir Ian Wilmot (1944–) and Keith Campbell (1954–2012), led a team which was the first to succeed in cloning a mammal, Dolly the sheep. This has led to further research into the possible use of cloning to preserve endangered species and for medical purposes."}, {"t": "p", "x": "Sir Peter Mansfield (1933–), a British scientist, is the co-inventor of the MRI (magnetic resonance imaging) scanner. This enables doctors and researchers to obtain exact and non-invasive images of human internal organs and has revolutionised diagnostic medicine."}, {"t": "p", "x": "The inventor of the World Wide Web, Sir Tim Berners-Lee (1955–), is British. Information was successfully transferred via the web for the first time on 25 December 1990."}, {"t": "p", "x": "Problems in the economy in the 1970s"}, {"t": "p", "x": "In the late 1970s, the post-war economic boom came to an end. Prices of goods and raw materials began to rise sharply and the exchange rate between the pound and other currencies was unstable. This caused problems with the ‘balance of payments’: imports of goods were valued at more than the price paid for exports."}, {"t": "p", "x": "Many industries and services were affected by strikes and this caused problems between the trade unions and the government. People began to argue that the unions were too powerful and that their activities were harming the UK."}, {"t": "p", "x": "The 1970s were also a time of serious unrest in Northern Ireland. In 1972, the Northern Ireland Parliament was suspended and Northern Ireland was directly ruled by the UK government. Some 3,000 people lost their lives in the decades after 1969 in the violence in Northern Ireland."}, {"t": "p", "x": "MARY PETERS (1939–)"}, {"t": "p", "x": "Born in Manchester, Mary Peters moved to Northern Ireland as a child. She was a talented athlete who won an Olympic gold medal in the pentathlon in 1972. After this, she raised money for local athletics and became the team manager for the women’s British Olympic team. She continues to promote sport and tourism in Northern Ireland and was made a Dame of the British Empire in 2000 in recognition of her work."}, {"t": "p", "x": "Europe and the Common Market"}, {"t": "p", "x": "West Germany, France, Belgium, Italy, Luxembourg and the Netherlands formed the European Economic Community (EEC) in 1957. At first the UK did not wish to join the EEC but it eventually did so in 1973. The UK is a full member of the European Union but does not use the Euro currency."}, {"t": "p", "x": "Conservative government from 1979 to1997"}, {"t": "p", "x": "MARGARET THATCHER (1925–2013)"}, {"t": "p", "x": "Margaret Thatcher"}, {"t": "p", "x": "Margaret Thatcher was the daughter of a grocer from Grantham in Lincolnshire. She trained as a chemist and lawyer. She was elected as a Conservative MP in 1959 and became a cabinet minister in 1970 as the Secretary of State for Education and Science. In 1975 she was elected as Leader of the Conservative Party and so became Leader of the Opposition."}, {"t": "p", "x": "Following the Conservative victory in the General Election in 1979, Margaret Thatcher became the first woman Prime Minister of the UK. She was the longest- serving Prime Minister of the 20th century, remaining in Office until 1990. During her premiership, there were a number of important economic reforms within the UK. She worked closely with the United States President, Ronald Reagan, and was one of the first Western leaders to recognise and welcome the changes in the leadership of the Soviet Union which eventually led to the end of the Cold War."}, {"t": "p", "x": "Margaret Thatcher, Britain’s first woman Prime Minister, led the Conservative government from 1979 to 1990. The government made structural changes to the economy through the privatisation of nationalised industries and imposed legal controls on trade union powers. Deregulation saw a great increase in the role of the City of London as an international centre for investments, insurance and other financial services. Traditional industries, such as shipbuilding and coal mining, declined. In 1982, Argentina invaded the Falkland Islands, a British overseas territory in the South Atlantic. A naval taskforce was sent from the UK and military action led to the recovery of the islands. John Major was Prime Minister after Mrs Thatcher, and helped establish the Northern Ireland peace process."}, {"t": "p", "x": "ROALD DAHL (1916–90)"}, {"t": "p", "x": "Roald Dahl was born in Wales to Norwegian parents. He served in the Royal Air Force during the Second World War. It was during the 1940s that he began to publish books and short stories. He is most well known for his children’s books, although he also wrote for adults. His best-known works include Charlie and the Chocolate Factory and George’s Marvellous Medicine. Several of his books have been made into films."}, {"t": "p", "x": "Labour government from 1997-2010"}, {"t": "p", "x": "In 1997 the Labour Party led by Tony Blair was elected. The Blair government introduced a Scottish Parliament and a Welsh Assembly. The Scottish Parliament has substantial powers to legislate. The Welsh Assembly was given fewer legislative powers but considerable control over public services. In Northern Ireland, the Blair government was able to build on the peace process, resulting in the Good Friday Agreement signed in 1998. The Northern Ireland Assembly was elected in 1999 but suspended in 2002. It was not reinstated until 2007. Most paramilitary groups in Northern Ireland have decommissioned their arms and are inactive. Gordon Brown took over as Prime Minister in 2007."}, {"t": "p", "x": "Conflicts in Afghanistan and Iraq"}, {"t": "p", "x": "Throughout the 1990s, Britain played a leading role in coalition forces involved in the liberation of Kuwait, following the Iraqi invasion in 1990, and the conflict in the Former Republic of Yugoslavia. Since 2000, British armed forces have been engaged in the global fight against international terrorism and against the proliferation of weapons of mass destruction, including operations in Afghanistan and Iraq. British combat troops left Iraq in 2009. The UK now operates in Afghanistan as part of the United Nations (UN) mandated 50-nation International Security Assistance Force"}, {"t": "p", "x": "(ISAF) coalition and at the invitation of the Afghan government. ISAF is working to ensure that Afghan territory can never again be used as a safe haven for international terrorism, where groups such as Al Qa’ida could plan attacks on the international community. As part of this, ISAF is building up the Afghan National Security Forces and is helping to create a secure environment in which governance and development can be extended. International forces are gradually handing over responsibility for security to the Afghans, who will have full security responsibility in all provinces by the end of 2014."}, {"t": "p", "x": "Coalition government from 2010 to 2015"}, {"t": "p", "x": "In May 2010, and for the first time in the UK since February 1974, no political party won an overall majority in the General Election. The Conservative and Liberal Democrat parties formed a coalition and the leader of the Conservative Party, David Cameron, became Prime Minister."}, {"t": "p", "x": "Conservative Government from 2015 to 2024"}, {"t": "p", "x": "The Conservative Government, which governed the United Kingdom from 2015 to 2024, saw multiple prime ministers, including David Cameron, Theresa May, Boris Johnson, Liz Truss, and Rishi Sunak. During this period, significant events included the 2016 EU membership referendum (Brexit), leadership changes, and handling of the COVID-19 pandemic. Despite reshuffling his cabinet and local election losses, Rishi Sunak has called for a general election on July 4, 2024. The Conservative Party’s popularity declined during this time, while Labour, the Liberal Democrats, and the Greens made substantial gains."}, {"t": "p", "x": "Labour Government from 2024"}, {"t": "p", "x": "The Labour party, lead by Keir Starmer, won the majority in the 2024 general election and formed the government."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The establishment of the welfare state"}, {"t": "check", "x": "How life in Britain changed in the 1960s and 1970s"}, {"t": "check", "x": "British inventions of the 20th century (you do not need to remember dates of births and deaths)"}, {"t": "check", "x": "Events since 1979"}]}]}, {"num": 4, "title": "A modern, thriving society", "sections": [{"id": "4.1", "title": "Chapter 4: A modern, thriving society", "blocks": [{"t": "p", "x": "IN THIS CHAPTER you will learn about the population and culture of the UK. The start of the chapter shows you where the major cities of the UK are. You should be sure you can identify the various cities, such as Leeds and Bradford, confidently. Because the UK is a multicultural country you will also have to know the sizes of the different ethnic and religious groups in the UK, as well as their main festivals."}, {"t": "p", "x": "The chapter focuses on British culture after that and you should make sure you know who each of the people described are and what they have achieved. Britain’s recent sporting success at the Olympics features heavily so focus on who won medals and for what as well as the general information about sport in the UK. Make sure you familiarise yourself with the poems, films, books and other works listed too, as well as the artists, composers, architects, authors, poets and other famous people. You should also familiarise yourself with the extracts of poems provided and be able to recognise the famous landmarks at the end of the chapter."}, {"t": "infohead", "x": "IN THIS CHAPTER THERE IS INFORMATION ABOUT:"}, {"t": "info", "x": "The cities and population of the UK"}, {"t": "info", "x": "Religious festivals of the UK"}, {"t": "info", "x": "Popular sports and famous sportsmen and women"}, {"t": "info", "x": "The development of music, including famous composers"}, {"t": "info", "x": "British theatre and cinema through the ages"}, {"t": "info", "x": "British artists and architects"}, {"t": "info", "x": "Famous British poets and authors"}, {"t": "info", "x": "Sections of famous British poems"}, {"t": "info", "x": "British comedy and leisure activities"}, {"t": "info", "x": "Famous British landmarks"}]}, {"id": "4.2", "title": "Arts and culture", "blocks": [{"t": "p", "x": "Music"}, {"t": "p", "x": "Music is an important part of British culture, with a rich and varied heritage. It ranges from classical music to modern pop. There are many different venues and musical events that take place across the UK."}, {"t": "p", "x": "The Proms is an eight-week summer season of orchestral classical music that takes place in various venues, including the Royal Albert Hall in London. It has been organised by the British Broadcasting Corporation (BBC) since 1927. The Last Night of the Proms is the most well-known concert and (along with others in the series) is broadcast on television."}, {"t": "p", "x": "Classical music has been popular in the UK for many centuries. Henry Purcell (1659–95) was the organist at Westminster Abbey. He wrote church music, operas and other pieces, and developed a British style distinct from that elsewhere in Europe. He continues to be influential on British composers."}, {"t": "p", "x": "Classical music remains very popular in the UK"}, {"t": "p", "x": "The German-born composer George Frederick Handel (1695–1759) spent many years in the UK and became a British citizen in 1727. He wrote the Water Music for King George I and Music for the Royal Fireworks for his son, George II. Both these pieces continue to be very popular. Handel also wrote an oratorio, Messiah, which is sung regularly by choirs, often at Easter time."}, {"t": "p", "x": "More recently, important composers include Gustav Holst (1874–1934), whose work includes The Planets, a suite of pieces themed around the planets of the solar system. He adapted Jupiter, part of the Planets suite, as the tune for I vow to thee my country, a popular hymn in British churches."}, {"t": "p", "x": "Sir Edward Elgar (1857–1934) was born in Worcester, England. His best-known work is probably the Pomp and Circumstance Marches. March No 1 (Land of Hope and Glory) is usually played at the Last Night of the Proms at the Royal Albert Hall."}, {"t": "p", "x": "Ralph Vaughan Williams (1872–1958) wrote music for orchestras and choirs. He was strongly influenced by traditional English folk music."}, {"t": "p", "x": "Sir William Walton (1902–83) wrote a wide range of music, from film scores to opera. He wrote marches for the coronations of King George VI and Queen Elizabeth II but his best-known works are probably Façade, which became a ballet, and Balthazar’s Feast, which is intended to be sung by a large choir."}, {"t": "p", "x": "Benjamin Britten (1913–76) is best known for his operas, which include Peter Grimes and Billy Budd. He also wrote A Young Person’s Guide to the Orchestra, which is based on a piece of music by Purcell and introduces the listener to the various different sections of an orchestra. He founded the Aldeburgh festival in Suffolk, which continues to be a popular music event of international importance."}, {"t": "p", "x": "Other types of popular music, including folk music, jazz, pop and music, have flourished in Britain since the 20th century. Britain has had an impact on popular music around the world, due to the wide use of the English language, the UK’s cultural links with many countries, and British capacity for invention and innovation."}, {"t": "p", "x": "Since the 1960s, British pop music has made one of the most important cultural contributions to life in the UK. Bands including The Beatles and The Rolling Stones continue to have an influence on music both here and abroad. British pop music has continued to innovate – for example, the Punk movement of the late 1970s, and the trend towards boy and girl bands in the 1990s."}, {"t": "p", "x": "There are many large venues that host music events throughout the year, such as: Wembley Stadium; The O2 in Greenwich, south-east London; and the Scottish Exhibition and Conference Centre (SECC) in Glasgow."}, {"t": "p", "x": "Festival season takes place across the UK every summer, with major events in various locations. Famous festivals include Glastonbury, the Isle of Wight Festival and the V Festival. Many bands and solo artists, both well-known and up-and-coming, perform at these events."}, {"t": "p", "x": "The National Eisteddfod of Wales is an annual cultural festival which includes music, dance, art and original performances largely in Welsh. It includes a number of important competitions for Welsh poetry."}, {"t": "p", "x": "The Mercury Music Prize is awarded each September for the best album from the UK and Ireland. The Brit Awards is an annual event that gives awards in a range of categories, such as best British group and best British solo artist."}, {"t": "p", "x": "Theatre"}, {"t": "p", "x": "There are theatres in most towns and cities throughout the UK, ranging from the large to the small. They are an important part of local communities and often show both professional and amateur productions. London’s West End, also known as ‘Theatreland’, is particularly well known. The Mousetrap, a murder-mystery play by Dame Agatha Christie, has been running in the West End since 1952 and has had the longest initial run of any show in history."}, {"t": "p", "x": "There is also a strong tradition of musical theatre in the UK. In the 19th century, Gilbert and Sullivan wrote comic operas, often making fun of popular culture and politics. These operas include HMS Pinafore, The Pirates of Penzance and The Mikado. Gilbert and Sullivan’s work is still often staged by professional and amateur groups. More recently, Andrew Lloyd Webber has written the music for shows which have been popular throughout the world, including, in collaboration with Tim Rice, Jesus Christ Superstar and Evita, and also Cats and The Phantom of the Opera."}, {"t": "p", "x": "One British tradition is the pantomime. Many theatres produce a pantomime at Christmas time. They are based on fairy stories and are light-hearted plays with music and comedy, enjoyed by family audiences. One of the traditional characters is the Dame, a woman played by a man. There is often also a pantomime horse or cow played by two actors in the same costume."}, {"t": "p", "x": "The Edinburgh Festival takes place in Edinburgh, Scotland, every summer. It is a series of different arts and cultural festivals, with the biggest and most well-known being the Edinburgh Festival Fringe (‘the Fringe’). The Fringe is a showcase of mainly theatre and comedy performances. It often shows experimental work."}, {"t": "p", "x": "The Laurence Olivier Awards take place annually at different venues in London. There are a variety of categories, including best director, best actor and best actress."}, {"t": "p", "x": "The awards are named after the British actor Sir Laurence Olivier, later Lord Olivier, who was best known for his roles in various Shakespeare plays."}, {"t": "p", "x": "Art"}, {"t": "p", "x": "During the Middle Ages, most art had a religious theme, particularly wall paintings in churches and illustrations in religious books. Much of this was lost after the Protestant Reformation but wealthy families began to collect other paintings and sculptures. Many of the painters working in Britain in the 16th and 17th centuries were from abroad – for example, Hans Holbein and Sir Anthony Van Dyck. British artists, particularly those painting portraits and landscapes, became well known from the 18th century onwards."}, {"t": "p", "x": "Works by British and international artists are displayed in galleries across the UK. Some of the most well-known galleries are The National Gallery, Tate Britain and Tate Modern in London, the National Museum in Cardiff, and the National Gallery of Scotland in Edinburgh."}, {"t": "p", "x": "The Turner Prize was established in 1984 and celebrates contemporary art. It was named after Joseph Turner. Four works are shortlisted every year and shown at Tate Britain before the winner is announced. The Turner Prize is recognised as one of the most prestigious visual art awards in Europe. Previous winners include Damien Hirst and Richard Wright."}, {"t": "p", "x": "NOTABLE BRITISH ARTISTS"}, {"t": "p", "x": "Thomas Gainsborough (1727–88) was a portrait painter who often painted people in country or garden scenery."}, {"t": "p", "x": "David Allan (1744–96) was a Scottish painter who was best known for painting portraits. One of his most famous works is called The Origin of Painting."}, {"t": "p", "x": "Joseph Turner (1775–1851) was an influential landscape painter in a modern style. He is considered the artist who raised the profile of landscape painting."}, {"t": "p", "x": "John Constable (1776–1837) was a landscape painter most famous for his works of Dedham Vale on the Suffolk–Essex border in the east of England."}, {"t": "p", "x": "The Pre-Raphaelites were an important group of artists in the second half of the 19th century. They painted detailed pictures on religious or literary themes in bright colours. The group included Holman Hunt, Dante Gabriel Rossetti and Sir John Millais."}, {"t": "p", "x": "Sir John Lavery (1856–1941) was a very successful Northern Irish portrait painter. His work included painting the Royal Family."}, {"t": "p", "x": "Henry Moore (1898–1986) was an English sculptor and artist. He is best known for his large bronze abstract sculptures."}, {"t": "p", "x": "John Petts (1914–91) was a Welsh artist, best known for his engravings and stained glass."}, {"t": "p", "x": "Lucian Freud (1922–2011) was a German-born British artist. He is best known for his portraits."}, {"t": "p", "x": "David Hockney (1937–) was an important contributor to the ‘pop art’ movement of the 1960s and continues to be influential today."}, {"t": "p", "x": "Architecture"}, {"t": "p", "x": "The architectural heritage of the UK is rich and varied. In the Middle Ages, great cathedrals and churches were built, many of which still stand today. Examples are the cathedrals in Durham, Lincoln, Canterbury and Salisbury. The White Tower in the Tower of London is an example of a Norman castle keep, built on the orders of William the Conqueror."}, {"t": "p", "x": "The Tower of London"}, {"t": "p", "x": "Gradually, as the countryside became more peaceful and landowners became richer, the houses of the wealthy became more elaborate and great country houses such as Hardwick Hall in Derbyshire were built. British styles of architecture began to evolve."}, {"t": "p", "x": "In the 17th century, Inigo Jones took inspiration from classical architecture to design the Queen’s House at Greenwich and the Banqueting House in Whitehall in London. Later in the century, Sir Christopher Wren helped develop a British version of the ornate styles popular in Europe in buildings such as the new St Paul’s Cathedral."}, {"t": "p", "x": "In the 18th century, simpler designs became popular. The Scottish architect Robert Adam influenced the development of architecture in the UK, Europe and America. He designed the inside decoration as well as the building itself in great houses such as Dumfries House in Scotland. His ideas influenced architects in cities such as Bath, where the Royal Crescent was built."}, {"t": "p", "x": "In the 19th century, the medieval ‘gothic’ style became popular again. As cities expanded, many great public buildings were built in this style. The Houses of Parliament and St Pancras Station were built at this time, as were the town halls in cities such as Manchester and Sheffield."}, {"t": "p", "x": "Cenotaph in London, Whitehall"}, {"t": "p", "x": "In the 20th century, Sir Edwin Lutyens had an influence throughout the British Empire. He designed New Delhi to be the seat of government in India. After the First World War, he was responsible for many war memorials throughout the world, including the Cenotaph in Whitehall. The Cenotaph is the site of the annual Remembrance Day service attended by the Queen, politicians and foreign ambassadors."}, {"t": "p", "x": "Modern British architects including Sir Norman Foster, Lord (Richard) Rogers and Dame Zaha Hadid continue to work on major projects throughout the world as well as within the UK."}, {"t": "p", "x": "Alongside the development of architecture, garden design and landscaping have played an important role in the UK. In the 18th century, Lancelot ‘Capability’"}, {"t": "p", "x": "Brown designed the grounds around country houses so that the landscape appeared to be natural, with grass, trees and lakes. He often said that a place had ‘capabilities’. Later, Gertrude Jekyll often worked with Edwin Lutyens to design colourful gardens around the houses he designed. Gardens continue to be an important part of homes in the UK. The annual Chelsea Flower Show showcases garden design from Britain and around the world."}, {"t": "p", "x": "Fashion and design"}, {"t": "p", "x": "Britain has produced many great designers, from Thomas Chippendale (who designed furniture in the 18th century) to Clarice Cliff (who designed Art Deco ceramics) to Sir Terence Conran (a 20th-century interior designer). Leading fashion designers of recent years include Mary Quant, Alexander McQueen and Vivienne Westwood."}, {"t": "p", "x": "Literature"}, {"t": "p", "x": "The UK has a prestigious literary history and tradition. Several British writers, including the novelist Sir William Golding, the poet Seamus Heaney, and the playwright Harold Pinter, have won the Nobel Prize in Literature. Other authors have become well known in popular fiction. Agatha Christie’s detective stories are read all over the world and Ian Fleming’s books introduced James Bond. In 2003, The Lord of the Rings by JRR Tolkien was voted the country’s best-loved novel."}, {"t": "p", "x": "The Man Booker Prize for Fiction is awarded annually for the best fiction novel written by an author from the Commonwealth, Ireland or Zimbabwe. It has been awarded since 1968. Past winners include Ian McEwan, Hilary Mantel and Julian Barnes."}, {"t": "p", "x": "NOTABLE AUTHORS AND WRITERS"}, {"t": "p", "x": "Jane Austen (1775–1817) was an English novelist. Her books include Pride and Prejudice and Sense and Sensibility. Her novels are concerned with marriage and family relationships. Many have been made into television programmes or films."}, {"t": "p", "x": "Charles Dickens (1812–70) wrote a number of very famous novels, including Oliver Twist and Great Expectations. You will hear references in everyday talk to some of the characters in his books, such as Scrooge (a mean person) or Mr Micawber (always hopeful)."}, {"t": "p", "x": "Robert Louis Stevenson (1850–94) wrote books which are still read by adults and children today. His most famous books include Treasure Island, Kidnapped and Dr Jekyll and Mr Hyde."}, {"t": "p", "x": "Thomas Hardy (1840–1928) was an author and poet. His best-known novels focus on rural society and include Far from the Madding Crowd and Jude the Obscure."}, {"t": "p", "x": "Sir Arthur Conan Doyle (1859–1930) was a Scottish doctor and writer. He was best known for his stories about Sherlock Holmes, who was one of the first fictional detectives."}, {"t": "p", "x": "Evelyn Waugh (1903–66) wrote satirical novels, including Decline and Fall and Scoop. He is perhaps best known for Brideshead Revisited."}, {"t": "p", "x": "Sir Kingsley Amis (1922–95) was an English novelist and poet. He wrote more than 20 novels. The most well-known is Lucky Jim."}, {"t": "p", "x": "Graham Greene (1904–91) wrote novels often influenced by his religious beliefs, including The Heart of the Matter, The Honorary Consul, Brighton Rock and Our Man in Havana."}, {"t": "p", "x": "J K Rowling (1965–) wrote the Harry Potter series of children’s books, which have enjoyed huge international success. She now writes fiction for adults as well."}, {"t": "p", "x": "British poets"}, {"t": "p", "x": "British poetry is among the richest in the world. The Anglo-Saxon poem Beowulf tells of its hero’s battles against monsters and is still translated into modern English. Poems which survive from the Middle Ages include Chaucer’s Canterbury Tales and a poem called Sir Gawain and the Green Knight, about one of the knights at the court of King Arthur."}, {"t": "p", "x": "As well as plays, Shakespeare wrote many sonnets (poems which must be 14 lines long) and some longer poems. As Protestant ideas spread, a number of poets wrote poems inspired by their religious views. One of these was John Milton, who wrote Paradise Lost."}, {"t": "p", "x": "Other poets, including William Wordsworth, were inspired by nature. Sir Walter Scott wrote poems inspired by Scotland and the traditional stories and songs from the area on the borders of Scotland and England. He also wrote novels, many of which were set in Scotland."}, {"t": "p", "x": "Poetry was very popular in the 19th century, with poets such as William Blake, John Keats, Lord Byron, Percy Shelley, Alfred Lord Tennyson, and Robert and Elizabeth Browning. Later, many poets – for example, Wilfred Owen and Siegfried Sassoon – were inspired to write about their experiences in the First World War."}, {"t": "p", "x": "More recently, popular poets have included Sir Walter de la Mare, John Masefield, Sir John Betjeman and Ted Hughes. Some of the best-known poets are buried or commemorated in Poet’s Corner in Westminster Abbey."}, {"t": "p", "x": "Some famous lines include:"}, {"t": "p", "x": "‘Oh to be in England now that April’s there"}, {"t": "p", "x": "And whoever wakes in England sees, some morning, unaware,"}, {"t": "p", "x": "That the lowest boughs and the brushwood sheaf"}, {"t": "p", "x": "Round the elm-tree bole are in tiny leaf"}, {"t": "p", "x": "While the Chaffinch sings on the orchard bough"}, {"t": "p", "x": "In England – Now!’"}, {"t": "p", "x": "(Robert Browning, 1812–89 – Home Thoughts from Abroad)"}, {"t": "p", "x": "‘She walks in beauty, like the night"}, {"t": "p", "x": "Of cloudless climes and starry skies,"}, {"t": "p", "x": "All that’s best of dark and bright"}, {"t": "p", "x": "Meet in her aspect and her eyes’"}, {"t": "p", "x": "(Lord Byron, 1788–1824 – She Walks in Beauty)"}, {"t": "p", "x": "‘I wander’d lonely as a cloud"}, {"t": "p", "x": "That floats on high o’er vales and hills"}, {"t": "p", "x": "When all at once I saw a crowd,"}, {"t": "p", "x": "A host of golden daffodils’"}, {"t": "p", "x": "(William Wordsworth, 1770–1850 – The Daffodils)"}, {"t": "p", "x": "‘Tyger! Tyger! Burning bright"}, {"t": "p", "x": "In the forests of the night,"}, {"t": "p", "x": "What immortal hand or eye"}, {"t": "p", "x": "Could frame thy fearful symmetry?’"}, {"t": "p", "x": "(William Blake, 1757–1827 – The Tyger)"}, {"t": "p", "x": "‘What passing-bells for these who die as cattle?"}, {"t": "p", "x": "Only the monstrous anger of the guns."}, {"t": "p", "x": "Only the stuttering rifles’ rapid rattle"}, {"t": "p", "x": "Can patter out their hasty orisons.’"}, {"t": "p", "x": "(Wilfred Owen, 1893–1918 – Anthem for Doomed Youth)"}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "Which sports are particularly popular in the UK"}, {"t": "p", "x": "Some of the major sporting events that take place each year"}, {"t": "p", "x": "Some of the major arts and culture events that happen in the UK"}, {"t": "p", "x": "How achievements in arts and culture are formally recognised"}, {"t": "p", "x": "Important figures in British literature"}]}, {"id": "4.3", "title": "Customs and traditions", "blocks": [{"t": "p", "x": "The main Christian festivals"}, {"t": "p", "x": "Christmas Day, 25 December, celebrates the birth of Jesus Christ. It is a public holiday. Many Christians go to church on Christmas Eve (24 December) or on Christmas Day itself."}, {"t": "p", "x": "Christmas is celebrated in a traditional way. People usually spend the day at home and eat a special meal, which often includes roast turkey, Christmas pudding and mince pies. They give gifts, send cards and decorate their houses. Christmas is a special time for children. Very young children believe that Father Christmas (also known as Santa Claus) brings them presents during the night before Christmas Day. Many people decorate a tree in their home."}, {"t": "p", "x": "Boxing Day is the day after Christmas Day and is a public holiday."}, {"t": "p", "x": "Easter eggs, often chocolate eggs given as presents on Easter day."}, {"t": "p", "x": "Easter takes place in March or April. It marks the death of Jesus Christ on Good Friday and his rising from the dead on Easter Sunday. Both Good Friday and the following Monday, called Easter Monday, are public holidays."}, {"t": "p", "x": "The 40 days before Easter are known as Lent. It is a time when Christians take time to reflect and prepare for Easter. Traditionally, people would fast during this period and today many people will give something up, like a favourite food. The day before Lent starts is called Shrove Tuesday, or Pancake Day. People eat pancakes, which were traditionally made to use up foods such as eggs, fat and milk before fasting. Lent begins on Ash Wednesday. There are church services where Christians are marked with an ash cross on their forehead as a symbol of death and sorrow for sin."}, {"t": "p", "x": "Easter is also celebrated by people who are not religious. ‘Easter eggs’ are chocolate eggs often given as presents at Easter as a symbol of new life."}, {"t": "p", "x": "Other religious festivals"}, {"t": "p", "x": "Diwali normally falls in October or November and lasts for five days. It is often called the Festival of Lights. It is celebrated by Hindus and Sikhs. It celebrates the victory of good over evil and the gaining of knowledge. There are different stories about how the festival came about. There is a famous celebration of Diwali in Leicester."}, {"t": "p", "x": "Hannukah is in November or December and is celebrated for eight days. It is to remember the Jews’ struggle for religious freedom. On each day of the festival a candle is lit on a stand of eight candles (called a menorah) to remember the story of the festival, where oil that should have lasted only a day did so for eight."}, {"t": "p", "x": "Eid al-Fitr celebrates the end of Ramadan, when Muslims have fasted for a month. They thank Allah for giving them the strength to complete the fast. The date when it takes place changes every year. Muslims attend special services and meals."}, {"t": "p", "x": "Eid ul Adha remembers that the prophet Ibrahim was willing to sacrifice his son when God ordered him to. It reminds Muslims of their own commitment to God."}, {"t": "p", "x": "Many Muslims sacrifice an animal to eat during this festival. In Britain this has to be done in a slaughterhouse."}, {"t": "p", "x": "Vaisakhi (also spelled Baisakhi) is a Sikh festival which celebrates the founding of the Sikh community known as the Khalsa. It is celebrated on 14 April each year with parades, dancing and singing."}, {"t": "p", "x": "Other festivals and traditions"}, {"t": "p", "x": "New year in Scotland, also called Hogmanay, Edinburgh"}, {"t": "p", "x": "New Year, 1 January, is a public holiday. People usually celebrate on the night of 31 December (called New Year’s Eve). In Scotland, 31 December is called Hogmanay and 2 January is also a public holiday. For some Scottish people, Hogmanay is a bigger holiday than Christmas."}, {"t": "p", "x": "Valentine’s Day, 14 February, is when lovers exchange cards and gifts. Sometimes people send anonymous cards to someone they secretly admire."}, {"t": "p", "x": "April Fool’s Day, 1 April, is a day when people play jokes on each other until midday. The television and newspapers often have stories that are April Fool jokes."}, {"t": "p", "x": "Mothering Sunday (or Mother’s Day) is the Sunday three weeks before Easter. Children send cards or buy gifts for their mothers."}, {"t": "p", "x": "Father’s Day is the third Sunday in June. Children send cards or buy gifts for their fathers."}, {"t": "p", "x": "Halloween, 31 October, is an ancient festival and has roots in the pagan festival to mark the beginning of winter. Young people will often dress up in frightening costumes to play ‘trick or treat’. People give them treats to stop them playing tricks on them. A lot of people carve lanterns out of pumpkins and put a candle inside."}, {"t": "p", "x": "Bonfire Night, 5 November, is an occasion when people in Great Britain set off fireworks at home or in special displays. The origin of this celebration was an event in 1605, when a group of Catholics led by Guy Fawkes failed in their plan to kill the Protestant king with a bomb in the Houses of Parliament."}, {"t": "p", "x": "Remembrance Day, 11 November, commemorates those who died fighting for the UK and its allies. Originally it commemorated the dead of the First World War, which ended on 11 November 1918. People wear poppies (the red flower found on the battlefields of the First World War). At 11.00 am there is a two-minute silence and wreaths are laid at the Cenotaph in Whitehall, London."}, {"t": "p", "x": "Bank holidays"}, {"t": "p", "x": "As well as those mentioned previously, there are other public holidays each year called bank holidays, when banks and many other businesses are closed for the day."}, {"t": "p", "x": "These are of no religious significance. They are at the beginning of May, in late May or early June, and in August. In Northern Ireland, the anniversary of the Battle of the Boyne in July is also a public holiday."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The main Christian festivals that are celebrated in the UK"}, {"t": "check", "x": "Other religious festivals that are important in the UK"}, {"t": "check", "x": "Some of the other events that are celebrated in the UK"}, {"t": "check", "x": "What a bank holiday is"}]}, {"id": "4.4", "title": "Leisure", "blocks": [{"t": "p", "x": "People in the UK spend their leisure time in many different ways."}, {"t": "p", "x": "Gardening"}, {"t": "p", "x": "A lot of people have gardens at home and will spend their free time looking after them. Some people rent additional land called ‘an allotment’, where they grow fruit and vegetables. Gardening and flower shows range from major national exhibitions to small local events. Many towns have garden centres selling plants and gardening equipment. There are famous gardens to visit throughout the UK, including Kew Gardens, Sissinghurst and Hidcote in England, Crathes Castle and Inveraray Castle in Scotland, Bodnant Garden in Wales, and Mount Stewart in Northern Ireland."}, {"t": "p", "x": "Kew gardens"}, {"t": "p", "x": "The countries that make up the UK all have flowers which are particularly associated with them and which are sometimes worn on national saints’ days:"}, {"t": "p", "x": "Shopping"}, {"t": "p", "x": "There are many different places to go shopping in the UK. Most towns and cities have a central shopping area, which is called the town centre. Undercover shopping centres are also common – these might be in town centres or on the outskirts of a town or city. Most shops in the UK are open seven days a week, although trading hours on Sundays and public holidays are generally reduced. Many towns also have markets on one or more days a week, where stallholders sell a variety of goods."}, {"t": "p", "x": "Cooking and food"}, {"t": "p", "x": "Many people in the UK enjoy cooking. They often invite each other to their homes for dinner. A wide variety of food is eaten in the UK because of the country’s rich cultural heritage and diverse population."}, {"t": "p", "x": "TRADITIONAL FOODS"}, {"t": "p", "x": "There are a variety of foods that are traditionally associated with different parts of the UK:"}, {"t": "p", "x": "England: Roast beef, which is served with potatoes, vegetables, Yorkshire puddings (batter that is baked in the oven) and other accompaniments. Fish and chips are also popular."}, {"t": "p", "x": "Wales: Welsh cakes – a traditional Welsh snack made from flour, dried fruits and spices, and served either hot or cold."}, {"t": "p", "x": "Scotland: Haggis – a sheep’s stomach stuffed with offal, suet, onions and oatmeal."}, {"t": "p", "x": "Northern Ireland: Ulster fry – a fried meal with bacon, eggs, sausage, black pudding, white pudding, tomatoes, mushrooms, soda bread and potato bread."}, {"t": "p", "x": "Films"}, {"t": "p", "x": "British film industry"}, {"t": "p", "x": "The UK has had a major influence on modern cinema."}, {"t": "p", "x": "Charlie Chaplin, famous for playing a tramp character"}, {"t": "p", "x": "Films were first shown publicly in the UK in 1896 and film screenings very quickly became popular. From the beginning, film makers became famous for clever special effects and this continues to be an area of British expertise. From the early days of the cinema, British actors have worked in both the UK and USA. Sir Charles (Charlie) Chaplin became famous in silent movies for his tramp character and was one of many British actors to make a career in Hollywood."}, {"t": "p", "x": "British studios flourished in the 1930s. Eminent directors included Sir Alexander Korda and Sir Alfred Hitchcock, who later left for Hollywood and remained an important film director until his death in 1980. During the Second World War, British movies (for example, In Which We Serve) played an important part in boosting morale. Later, British directors including Sir David Lean and Ridley Scott found great success both in the UK and internationally."}, {"t": "p", "x": "The 1950s and 1960s were a high point for British comedies, including Passport to Pimlico, The Ladykillers and, later, the Carry On films."}, {"t": "p", "x": "Many of the films now produced in the UK are made by foreign companies, using British expertise. Some of the most commercially successful films of all time, including the two highest-grossing film franchises (Harry Potter and James Bond), have been produced in the UK. Ealing Studios has a claim to being the oldest continuously working film studio facility in the world. Britain continues to be particularly strong in special effects and animation. One example is the work of Nick Park, who has won four Oscars for his animated films, including three for films featuring Wallace and Gromit."}, {"t": "p", "x": "Actors such as Sir Lawrence Olivier, David Niven, Sir Rex Harrison and Richard Burton starred in a wide variety of popular films. British actors continue to be popular and continue to win awards throughout the world. Recent British actors to have won Oscars include Colin Firth, Sir Anthony Hopkins, Dame Judi Dench, Kate Winslet and Tilda Swinton."}, {"t": "p", "x": "The annual British Academy Film Awards, hosted by the British Academy of Film and Television Arts (BAFTA), are the British equivalent of the Oscars."}, {"t": "p", "x": "SOME FAMOUS BRITISH FILMS"}, {"t": "p", "x": "The 39 Steps (1935), directed by Alfred Hitchcock"}, {"t": "p", "x": "Brief Encounter (1945), directed by David Lean"}, {"t": "p", "x": "The Third Man (1949), directed by Carol Reed"}, {"t": "p", "x": "The Belles of St Trinian’s (1954), directed by Frank Launder"}, {"t": "p", "x": "Lawrence of Arabia (1962), directed by David Lean"}, {"t": "p", "x": "Women in Love (1969), directed by Ken Russell"}, {"t": "p", "x": "Don’t Look Now (1973), directed by Nicolas Roeg"}, {"t": "p", "x": "Chariots of Fire (1981), directed by Hugh Hudson"}, {"t": "p", "x": "The Killing Fields (1984), directed by Roland Joffé"}, {"t": "p", "x": "Four Weddings and a Funeral (1994), directed by Mike Newell"}, {"t": "p", "x": "Touching the Void (2003), directed by Kevin MacDonald."}, {"t": "p", "x": "British comedy"}, {"t": "p", "x": "The traditions of comedy and satire, and the ability to laugh at ourselves, are an important part of the UK character. Medieval kings and rich nobles had jesters who told jokes and made fun of people in the Court. Later, Shakespeare included comic characters in his plays. In the 18th century, political cartoons attacking prominent politicians – and, sometimes, the monarch or other members of the Royal Family – became increasingly popular. In the 19th century, satirical magazines began to be published. The most famous was Punch, which was published for the first time in the 1840s. Today, political cartoons continue to be published in newspapers, and magazines such as_Private Eye_ continue the tradition of satire."}, {"t": "p", "x": "Comedians were a popular feature of British music hall, a form of variety theatre which was very common until television became the leading form of entertainment in the UK. Some of the people who had performed in the music halls in the 1940s and 1950s, such as Morecambe and Wise, became stars of television."}, {"t": "p", "x": "Television comedy developed its own style. Situation comedies, or sitcoms, which often look at family life and relationships in the workplace, remain popular. Satire has also continued to be important, with shows like That Was The Week That Was in the 1960s and Spitting Image in the 1980s and 1990s. In 1969, Monty Python’s Flying Circus introduced a new type of progressive comedy. Stand-up comedy, where a solo comedian talks to a live audience, has become popular again in recent years."}, {"t": "p", "x": "Television and radio"}, {"t": "p", "x": "Many different television (TV) channels are available in the UK. Some are free to watch and others require a paid subscription. British television shows a wide variety of programmes. Popular programmes include regular soap operas such as Coronation Street and EastEnders. In Scotland, some Scotland-specific programmes are shown and there is also a channel with programmes in the Gaelic language. There is a Welsh-language channel in Wales. There are also programmes specific to Northern Ireland and some programmes broadcast in Irish Gaelic."}, {"t": "p", "x": "Everyone in the UK with a TV, computer or other medium which can be used for watching TV must have a television licence. One licence covers all of the equipment in one home, except when people rent different rooms in a shared house and each has a separate tenancy agreement – those people must each buy a separate licence. People over 75 can apply for a free TV licence and blind people can get a 50% discount. You will receive a fine of up to £1,000 if you watch TV but do not have a TV licence."}, {"t": "p", "x": "The money from TV licences is used to pay for the British Broadcasting Corporation (BBC). This is a British public service broadcaster providing television and radio programmes. The BBC is the largest broadcaster in the world. It is the only wholly state-funded media organisation that is independent of government. Other UK channels are primarily funded through advertisements and subscriptions."}, {"t": "p", "x": "There are also many different radio stations in the UK. Some broadcast nationally and others in certain cities or regions. There are radio stations that play certain types of music and some broadcast in regional languages such as Welsh or Gaelic. Like television, BBC radio stations are funded by TV licences and other radio stations are funded through advertisements."}, {"t": "p", "x": "Social networking"}, {"t": "p", "x": "Social networking websites such as Facebook and Twitter are a popular way for people to stay in touch with friends, organise social events, and share photos, videos and opinions. Many people use social networking on their mobile phones when out and about."}, {"t": "p", "x": "Pubs and night clubs"}, {"t": "p", "x": "Public houses (pubs) are an important part of the UK social culture. Many people enjoy meeting friends in the pub. Most communities will have a ‘local’ pub that is a natural focal point for social activities. Pub quizzes are popular. Pool and darts are traditional pub games. To buy alcohol in a pub or night club you must be 18 or over, but people under that age may be allowed in some pubs with an adult. When they are 16, people can drink wine or beer with a meal in a hotel or restaurant (including eating areas in pubs) as long as they are with someone over 18."}, {"t": "p", "x": "Pubs are usually open during the day from 11.00 am (12 noon on Sundays). Night clubs with dancing and music usually open and close later than pubs. The licensee decides the hours that the pub or night club is open."}, {"t": "p", "x": "Betting and gambling"}, {"t": "p", "x": "In the UK, people often enjoy a gamble on sports or other events. There are also casinos in many places. You have to be 18 to go into betting shops or gambling clubs. There is a National Lottery for which draws are made every week. You can enter by buying a ticket or a scratch card. People under 18 (minimum age will rose from 16 to 18 from April 2021) are not allowed to participate in the National Lottery."}, {"t": "p", "x": "Pets"}, {"t": "p", "x": "A lot of people in the UK have pets such as cats or dogs. They might have them for company or because they enjoy looking after them. It is against the law to treat a pet cruelly or to neglect it. All dogs in public places must wear a collar showing the name and address of the owner. The owner is responsible for keeping the dog under control and for cleaning up after the animal in a public place."}, {"t": "p", "x": "Vaccinations and medical treatment for animals are available from veterinary surgeons (vets). There are charities which may help people who cannot afford to pay a vet."}]}, {"id": "4.5", "title": "Places of interest", "blocks": [{"t": "p", "x": "The UK has a large network of public footpaths in the countryside. There are also many opportunities for mountain biking, mountaineering and hill walking. There are 15 national parks in England, Wales and Scotland. They are areas of protected countryside that everyone can visit, and where people live, work and look after the landscape."}, {"t": "p", "x": "There are many museums in the UK, which range from small community museums to large national and civic collections. Famous landmarks exist in towns, cities and the countryside throughout the UK. Most of them are open to the public to view (generally for a charge)."}, {"t": "p", "x": "Many parts of the countryside and places of interest are kept open by the National Trust in England, Wales and Northern Ireland and the National Trust for Scotland."}, {"t": "p", "x": "Both are charities that work to preserve important buildings, coastline and countryside in the UK. The National Trust was founded in 1895 by three volunteers."}, {"t": "p", "x": "There are now more than 61,000 volunteers helping to keep the organisation running."}, {"t": "p", "x": "UK landmarks"}, {"t": "p", "x": "Big Ben is the nickname for the great bell of the clock at the Houses of Parliament in London. Many people call the clock Big Ben as well. The clock is over 150 years old and is a popular tourist attraction. The clock tower is named ‘Elizabeth Tower’ in honour of Queen Elizabeth II’s Diamond Jubilee in 2012."}, {"t": "p", "x": "The Eden Project is located in Cornwall, in the south west of England. Its biomes, which are like giant greenhouses, house plants from all over the world. The Eden Project is also a charity which runs environmental and social projects internationally."}, {"t": "p", "x": "The Castle is a dominant feature of the skyline in Edinburgh, Scotland. It has a long history, dating back to the early Middle Ages. It is looked after by Historic Scotland, a Scottish government agency."},
