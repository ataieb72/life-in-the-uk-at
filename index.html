Africa"}, {"t": "p", "x": "Togo"}, {"t": "p", "x": "Uganda"}, {"t": "p", "x": "United Republic of Tanzania"}, {"t": "p", "x": "Zambia"}, {"t": "p", "x": "The European Union"}, {"t": "p", "x": "European Union Flag"}, {"t": "p", "x": "The European Union (EU), originally called the European Economic Community (EEC), was set up by six western European countries (Belgium, France, Germany, Italy, Luxembourg and the Netherlands) who signed the Treaty of Rome on 25 March 1957."}, {"t": "p", "x": "BREXIT"}, {"t": "p", "x": "The UK originally decided not to join this group but it became a member in 1973. The UK left the EU after the Brexit vote. Brexit officially took place at 23:00 GMT on 31 January 2020."}, {"t": "p", "x": "There are now 27 EU member states."}, {"t": "p", "x": "EU member states"}, {"t": "p", "x": "Austria"}, {"t": "p", "x": "Belgium"}, {"t": "p", "x": "Bulgaria"}, {"t": "p", "x": "Cyprus"}, {"t": "p", "x": "Czech Republic"}, {"t": "p", "x": "Denmark"}, {"t": "p", "x": "Estonia"}, {"t": "p", "x": "Finland"}, {"t": "p", "x": "France"}, {"t": "p", "x": "Germany"}, {"t": "p", "x": "Greece"}, {"t": "p", "x": "Hungary"}, {"t": "p", "x": "Ireland"}, {"t": "p", "x": "Italy"}, {"t": "p", "x": "Latvia"}, {"t": "p", "x": "Lithuania"}, {"t": "p", "x": "Luxembourg"}, {"t": "p", "x": "Malta"}, {"t": "p", "x": "Netherlands"}, {"t": "p", "x": "Poland"}, {"t": "p", "x": "Portugal"}, {"t": "p", "x": "Romania"}, {"t": "p", "x": "Slovakia"}, {"t": "p", "x": "Slovenia"}, {"t": "p", "x": "Spain"}, {"t": "p", "x": "Sweden"}, {"t": "p", "x": "Croatia"}, {"t": "p", "x": "With effect from 2024, no general principle of EU law is part of UK law. European laws are called directives, regulations or framework decisions."}, {"t": "p", "x": "The Council of Europe"}, {"t": "p", "x": "The Council of Europe is separate from the EU. It has 47 member countries, including the UK, and is responsible for the protection and promotion of human rights in those countries. It has no power to make laws but draws up conventions and charters, the most well-known of which is the European Convention on Human Rights and Fundamental Freedoms, usually called the European Convention on Human Rights."}, {"t": "p", "x": "The United Nations"}, {"t": "p", "x": "The UK is part of the United Nations (UN), an international organisation with more than 190 countries as members. The UN was set up after the Second World War and aims to prevent war and promote international peace and security. There are 15 members on the UN Security Council, which recommends action when there are international crises and threats to peace. The UK is one of five permanent members of the Security Council."}, {"t": "p", "x": "The North Atlantic Treaty Organization (NATO)"}, {"t": "p", "x": "The UK is also a member of NATO. NATO is a group of European and North American countries that have agreed to help each other if they come under attack. It also aims to maintain peace between all of its members."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "What the Commonwealth is and its role"}, {"t": "check", "x": "Other international organisations of which the UK is a member"}]}, {"id": "5.8", "title": "Your role in the community", "blocks": [{"t": "p", "x": "Becoming a British citizen or settling in the UK brings responsibilities but also opportunities. Everyone has the opportunity to participate in their community. This section looks at some of the responsibilities of being a citizen and gives information about how you can help to make your community a better place to live and work."}, {"t": "p", "x": "Values and responsibilities"}, {"t": "p", "x": "Although Britain is one of the world’s most diverse societies, there is a set of shared values and responsibilities that everyone can agree with. These values and responsibilities include: to obey and respect the law to be aware of the rights of others and respect those rights to treat others with fairness to behave responsibly to help and protect your family to respect and preserve the environment to treat everyone equally, regardless of sex, race, religion, age, disability, class or sexual orientation to work to provide for yourself and your family to help others to vote in local and national government elections."}, {"t": "p", "x": "Taking on these values and responsibilities will make it easier for you to become a full and active citizen."}, {"t": "p", "x": "Being a good neighbour"}, {"t": "p", "x": "When you move into a new house or apartment, introduce yourself to the people who live near you. Getting to know your neighbours can help you to become part of the community and make friends. Your neighbours are also a good source of help – for example, they may be willing to feed your pets if you are away, or offer advice on local shops and services."}, {"t": "p", "x": "You can help prevent any problems and conflicts with your neighbours by respecting their privacy and limiting how much noise you make. Also try to keep your garden tidy, and only put your refuse bags and bins on the street or in communal areas if they are due to be collected."}, {"t": "p", "x": "Getting involved in local activities"}, {"t": "p", "x": "Volunteering and helping your community are an important part of being a good citizen. They enable you to integrate and get to know other people. It helps to make your community a better place if residents support each other. It also helps you to fulfil your duties as a citizen, such as behaving responsibly and helping others."}, {"t": "p", "x": "5.8.1 How you can support your community"}, {"t": "p", "x": "There are a number of positive ways in which you can support your community and be a good citizen."}, {"t": "p", "x": "Jury service"}, {"t": "p", "x": "As well as getting the right to vote, people on the electoral register are randomly selected to serve on a jury. Anyone who is on the electoral register and is aged 18 to 70 can be asked to do this."}, {"t": "p", "x": "Helping in schools"}, {"t": "p", "x": "If you have children, there are many ways in which you can help at their schools. Parents can often help in classrooms, by supporting activities or listening to children read."}, {"t": "p", "x": "Many schools organise events to raise money for extra equipment or out-of- school activities. Activities might include book sales, toy sales or bringing food to sell. You might have good ideas of your own for raising money."}, {"t": "p", "x": "Sometimes events are organised by parent-teacher associations (PTAs)."}, {"t": "p", "x": "Volunteering to help with their events or joining the association is a way of doing something good for the school and also making new friends in your local community. You can find out about these opportunities from notices in the school or notes your children bring home."}, {"t": "p", "x": "School governors and school boards"}, {"t": "p", "x": "School governors, or members of the school board in Scotland, are people from the local community who wish to make a positive contribution to children’s education. They must be aged 18 or over at the date of their election or appointment. There is no upper age limit."}, {"t": "p", "x": "Governors and school boards have an important part to play in raising school standards. They have three key roles: setting the strategic direction of the school ensuring accountability monitoring and evaluating school performance."}, {"t": "p", "x": "You can contact your local school to ask if they need a new governor or school board member. In England, you can also apply online at the School"}, {"t": "p", "x": "Governors’ One-Stop Shop at www.sgoss.org.uk. In England, parents and other community groups can apply to open a free school in their local area."}, {"t": "p", "x": "More information about this can be found on the Department for Education website at www.dfe.gov.uk."}, {"t": "p", "x": "Supporting political parties"}, {"t": "p", "x": "Political parties welcome new members. Joining one is a way to demonstrate your support for certain views and to get involved in the democratic process."}, {"t": "p", "x": "Political parties are particularly busy at election times. Members work hard to persuade people to vote for their candidates – for instance, by handing out leaflets in the street or by knocking on people’s doors and asking for their support. This is called ‘canvassing’. You don’t have to tell a canvasser how you intend to vote if you don’t want to."}, {"t": "p", "x": "British citizens can stand for Office as a local councillor, a member of"}, {"t": "p", "x": "Parliament (or the devolved equivalents) or a member of the European"}, {"t": "p", "x": "Parliament. This is an opportunity to become even more involved in the political life of the UK. You may also be able to stand for Office if you are an Irish citizen, an eligible Commonwealth citizen or (except for standing to be an MP) a citizen of another EU country."}, {"t": "p", "x": "You can find out more about joining a political party from the individual party websites."}, {"t": "p", "x": "Helping with local services"}, {"t": "p", "x": "There are opportunities to volunteer with a wide range of local service providers, including local hospitals and youth projects. Services often want to involve local people in decisions about the way in which they work."}, {"t": "p", "x": "Universities, housing associations, museums and arts councils may advertise for people to serve as volunteers in their governing bodies."}, {"t": "p", "x": "You can volunteer with the police, and become a special constable or a lay"}, {"t": "p", "x": "(non-police) representative. You can also apply to become a magistrate. You will often find advertisements for vacancies in your local newspaper or on local radio. You can also find out more about these sorts of roles at www.gov.uk."}, {"t": "p", "x": "Blood and organ donation"}, {"t": "p", "x": "Donated blood is used by hospitals to help people with a wide range of injuries and illnesses. Giving blood only takes about an hour to do. You can register to give blood at:"}, {"t": "p", "x": "England and North Wales: www.blood.co.uk"}, {"t": "p", "x": "Rest of Wales: www.welsh-blood.org.uk"}, {"t": "p", "x": "Scotland: www.scotblood.co.uk"}, {"t": "p", "x": "Northern Ireland: www.nibts.org"}, {"t": "p", "x": "Many people in the UK are waiting for organ transplants. If you register to be an organ donor, it can make it easier for your family to decide whether to donate your organs when you die. You can register to be an organ donor at www.organdonation.nhs.uk. Living people can also donate a kidney."}, {"t": "p", "x": "Other ways to volunteer"}, {"t": "p", "x": "Volunteering is working for good causes without payment. There are many benefits to volunteering, such as meeting new people helping make your community a better place. Some volunteer activities will give you a chance to practise your English or develop work skills that will help you find a job or improve your curriculum vitae (CV). Many people volunteer simply because they want to help other people."}, {"t": "p", "x": "Activities you can do as a volunteer include: working with animals – for example, caring for animals at a local rescue shelter youth work – for example, volunteering at a youth group helping improve the environment – for example, participating in a litter pick-up in the local area working with the homeless in, for example, a homelessness shelter mentoring – for example, supporting someone who has just come out of prison work in health and hospitals – for example, working on an information desk in a hospital helping older people at, for example, a residential care home."}, {"t": "p", "x": "There are thousands of active charities and voluntary organisations in the"}, {"t": "p", "x": "UK. They work to improve the lives of people, animals and the environment in many different ways. They range from the British branches of international organisations, such as the British Red Cross, to small local charities working in particular areas. They include charities working with older people (such as Age UK), with children (for example, the National"}, {"t": "p", "x": "Society for the Prevention of Cruelty to Children (NSPCC)), and with the homeless (for example, Crisis and Shelter). There are also medical research charities (for example, Cancer Research UK), environmental charities"}, {"t": "p", "x": "(including the National Trust and Friends of the Earth) and charities working with animals (such as the People’s Dispensary for Sick Animals"}, {"t": "p", "x": "(PDSA))."}, {"t": "p", "x": "Volunteers are needed to help with their activities and to raise money. The charities often advertise in local newspapers, and most have websites that"}, {"t": "p", "x": "include information about their opportunities. You can also get information about volunteering for different organisations from www.do-it.org.uk."}, {"t": "p", "x": "There are many opportunities for young people to volunteer and receive accreditation which will help them to develop their skills. These include the"}, {"t": "p", "x": "National Citizen Service programme, which gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project. You can find out more about these opportunities as follows:"}, {"t": "p", "x": "National Citizen Service: at nationalcitizenservice.direct.gov.uk"}, {"t": "p", "x": "England: at www.vinspired.com"}, {"t": "p", "x": "Wales: at www.gwirvol.org"}, {"t": "p", "x": "Scotland: at www.vds.org.uk"}, {"t": "p", "x": "Northern Ireland: at www.volunteernow.co.uk"}, {"t": "p", "x": "5.8.2 Looking after the environment"}, {"t": "p", "x": "It is important to recycle as much of your waste as you can. Using recycled materials to make new products uses less energy and means that we do not need to extract more raw materials from the earth. It also means that less rubbish is created, so the amount being put into landfill is reduced."}, {"t": "p", "x": "You can learn more about recycling and its benefits at www.recyclenow.com. At this website you can also find out what you can recycle at home and in the local area if you live in England. This information is available for Wales at www.wasteawarenesswales.org.uk, for"}, {"t": "p", "x": "Scotland at www.recycleforscotland.com and for Northern Ireland from your local authority."}, {"t": "p", "x": "A good way to support your local community is to shop for products locally where you can. This will help businesses and farmers in your area and in"}, {"t": "p", "x": "Britain. It will also reduce your carbon footprint, because the products you buy will not have had to travel as far."}, {"t": "p", "x": "Walking and using public transport to get around when you can is also a good way to protect the environment. It means that you create less pollution than when you use a car."}, {"t": "checkhead", "x": "Check that you understand:"}, {"t": "check", "x": "The different ways you can help at your child’s school"}, {"t": "check", "x": "The role of school governors and members of school boards, and how you can become one"}, {"t": "check", "x": "The role of members of political parties"}, {"t": "check", "x": "The different local services people can volunteer to support"}, {"t": "check", "x": "How to donate blood and organs"}, {"t": "check", "x": "The benefits of volunteering for you, other people and the community"}, {"t": "check", "x": "The types of activities that volunteers can do"}, {"t": "check", "x": "How you can look after the environment"}]}]}, {"num": 6, "title": "Summary", "sections": [{"id": "6.1", "title": "Sources", "blocks": [{"t": "p", "x": "In addition to this PDF version, you can also learn interactively and complete practice materials available online."}, {"t": "p", "x": "6.1.1 Online study materials"}, {"t": "p", "x": "Britizen.uk"}, {"t": "p", "x": "45 practice tests"}, {"t": "p", "x": "Online study guide"}, {"t": "p", "x": "6.1.2 Physical copy"}, {"t": "p", "x": "If you prefer to read a physical copy, you can buy a paper copy."}]}, {"id": "6.2", "title": "Key Material and Facts", "blocks": [{"t": "p", "x": "A summary of key dates and facts extracted from e-publication Life in the United Kingdom: A guide for new residents, 3rd Edition. We recommend you reading the source material to get a better context for these facts."}, {"t": "p", "x": "6.2.1 Key acts"}, {"t": "p", "x": "Magna Carta (1215): reduced rights of the king and laid out basic rights of the people."}, {"t": "p", "x": "Act for the Government of Wales (under King Henry VII, 1500s): united"}, {"t": "p", "x": "England and Wales"}, {"t": "p", "x": "Habeas Corpus Act (1679): forbid unlawful imprisonment"}, {"t": "p", "x": "Bill of Rights (1689): confirmed the rights of Parliament and the limits of the king’s power"}, {"t": "p", "x": "Act of Union (1707): united kingdoms of England and Scotland and created Kingdom of GB"}, {"t": "p", "x": "Reform Act (1832): abolished pocket and rotten boroughs and gave more parliamentary seats to towns and cities. Increased number of (male) voters."}, {"t": "p", "x": "Emancipation Act (1833): abolished slavery throughout British Empire."}, {"t": "p", "x": "William Wilberforce was leading abolitionist and Quakers set up first anti-slavery groups. More than 2 million migrants came from India and"}, {"t": "p", "x": "China to replace labour force."}, {"t": "p", "x": "Women’s suffrage – 1918 (vote at 30+ yrs) and 1928 (vote at 21 yrs, same as men)"}, {"t": "p", "x": "1913: Home Rule proposed in Ireland. Idea was to have a self-governing"}, {"t": "p", "x": "Ireland with its own parliament that still remained part of the UK. WWI postponed any changes. Irish nationalists didn’t want to wait and the"}, {"t": "p", "x": "Easter Rising against the British in Dublin took place in 1916. Guerrilla war followed."}, {"t": "p", "x": "1921: Peace treaty signed splitting Ireland in two"}, {"t": "p", "x": "6.2.2 Eras"}, {"t": "p", "x": "Romans: ruled Britain from 43-410 AD (approximately 400 years)."}, {"t": "p", "x": "Hadrian’s wall built on orders of Roman Emperor Hadrian to keep out tribes (Picts) who lived in what is now Scotland."}, {"t": "p", "x": "Middle Ages (1066-1485): period of constant war, including Crusades and Hundred Years’ War."}, {"t": "p", "x": "Elizabethan period (1500s): known for growing patriotism, expanded trade and rich poetry and drama."}, {"t": "p", "x": "The Enlightenment (1700s): development of new ideas about politics, philosophy and science. Adam Smith (economics) and David Hume"}, {"t": "p", "x": "(philosopher) influential Scottish thinkers."}, {"t": "p", "x": "Industrial Revolution (from mid-1700s to 1800s). Britain produced over half of the world’s supplies of cotton cloth, coal and iron. Machinery and stream power developed."}, {"t": "p", "x": "Victorian Age (1837-1901): Queen Victoria reigned; Britain increased power and influence abroad. Became largest empire in world history."}, {"t": "p", "x": "Middle classes grew significantly and reformers improved conditions for the poor."}, {"t": "p", "x": "6.2.3 Modern era"}, {"t": "p", "x": "1900s: jet engine and radar invented. TV & World Wide Web (Tim"}, {"t": "p", "x": "Berners-Lee) invented. Hovercraft invented (Sir Christopher Cockrell) and penicillin discovered (Sir Alexander Flemming). ATM invented."}, {"t": "p", "x": "Cloned sheep Dolly. Developed Concorde (supersonic jet) with the"}, {"t": "p", "x": "French. Co-discovered insulin and co-invented the MRI. Structure of"}, {"t": "p", "x": "DNA molecule discovered. Radio telescope at Jodrell Bank was for many years the world’s largest. Harrier jump jet (takes off vertically). IVF therapy."}, {"t": "p", "x": "State retirement pension and free school meals introduced before WWI"}, {"t": "p", "x": "1929: Great Depression. Aviation and automobile industries developed."}, {"t": "p", "x": "High unemployment, especially in “heavy” industries (e.g. shipbuilding)."}, {"t": "p", "x": "1942: Beveridge Report (William Beveridge) set out ideas which led to foundation of modern welfare state."}, {"t": "p", "x": "1944: Education Act (R A Butler). Free secondary education and clear distinction between primary and secondary education."}, {"t": "p", "x": "1945-1950: NHS and social security system established."}, {"t": "p", "x": "1947: 9 colonies gained independence, including India, Pakistan, and Sri"}, {"t": "p", "x": "Lanka"}, {"t": "p", "x": "1950s: Post-war labour shortages led to recruitment of workers from"}, {"t": "p", "x": "India, Pakistan, West Indies and Bangladesh."}, {"t": "p", "x": "1960s: Increased wealth and liberalisation of social laws (e.g. abortion and divorce)."}, {"t": "p", "x": "1973: UK joined the EEC"}, {"t": "p", "x": "1998: Good Friday Agreement led to establishment of Northern Irish parliament"}, {"t": "p", "x": "1999: Scottish parliament & Welsh assembly established"}, {"t": "p", "x": "6.2.4 Battles and wars"}, {"t": "p", "x": "1066: William of Normandy conquered England at Battle of Hastings"}, {"t": "p", "x": "(Bayeux Tapestry)"}, {"t": "p", "x": "1314: Battle of Bannockburn. Scottish King Robert the Bruce defeated the English."}, {"t": "p", "x": "1455: War of the Roses. Civil war between House of Lancaster (red rose) and House of York (white rose) to determine who should be king of"}, {"t": "p", "x": "England. Ended at Battle of Bosworth Field (1485). Henry Tudor of"}, {"t": "p", "x": "House of Lancaster became King Henry VII and married Elizabeth of"}, {"t": "p", "x": "York, uniting the two families as the House of Tudor (red rose with a white rose inside)."}, {"t": "p", "x": "Last of the Welsh rebellions had been defeated by mid-15th century."}, {"t": "p", "x": "1588: Spanish Armada was defeated under Elizabeth I"}, {"t": "p", "x": "1640: Beginning of English Civil War. Parliament (supporters:"}, {"t": "p", "x": "Roundheads) vs the King (Cavaliers). Charles I introduced Prayer Book;"}, {"t": "p", "x": "Parliament, made of Puritans, didn’t back him. King’s army defeated at"}, {"t": "p", "x": "Battles of Marston Moor and Naseby. King Charles I executed."}, {"t": "p", "x": "1776: American colonies declare independence over taxation."}, {"t": "p", "x": "1805: Battle of Trafalgar. Lord Horatio Nelson (of Nelson’s Column) defeated French (Napoleon) + Spanish fleet."}, {"t": "p", "x": "1815: Battle of Waterloo. Lord Wellington defeated Napoleon."}, {"t": "p", "x": "1889-1902: Boer War in South Africa."}, {"t": "p", "x": "1916: Battle of the Somme WW1. British forces suffered 60,000 causalities on the first day."}, {"t": "p", "x": "1918: WWI ended at 11.00 on 11/11."}, {"t": "p", "x": "1939: German invasion of Poland led UK and France to declare war on"}, {"t": "p", "x": "Germany"}, {"t": "p", "x": "1940 (WWII): Evacuation of Dunkirk. Rescue of 300,000 men by volunteers and small boats."}, {"t": "p", "x": "1940 (WWII): Battle of Britain. German/British aerial battle."}, {"t": "p", "x": "1982: Argentina invaded Falkland Islands"}, {"t": "p", "x": "6.2.5 Key events"}, {"t": "p", "x": "1348: Black Death. Killed over 1/3 of Britain. Fewer people meant less need for cereal crops as well as labour shortages, then increased wages."}, {"t": "p", "x": "Movement into cities and towns. Gentry (landowners of large plots) and middle class developed."}, {"t": "p", "x": "1400: English became preferred language of courts and official documents."}, {"t": "p", "x": "1660: The Restoration (of the monarchy). Charles (King of Scotland) invited to come back as King Charles II after Oliver Cromwell’s death."}, {"t": "p", "x": "1665: Great Plague"}, {"t": "p", "x": "Glorious Revolution (1688): English Protestants asked Mary’s husband"}, {"t": "p", "x": "William of Orange (of the Netherlands) to proclaim himself king, as didn’t want a Catholic king. He faced no resistance."}, {"t": "p", "x": "During Queen Elizabeth I’s reign, English settlers began to move to"}, {"t": "p", "x": "North American colonies."}, {"t": "p", "x": "6.2.6 People"}, {"t": "p", "x": "Sir Robert Walpole: first PM (1721-1742) as King George I (a German) relied heavily on ministers because of his poor English"}, {"t": "p", "x": "Oliver Cromwell: titled Lord Protector (circa 1640s-1650s) and led"}, {"t": "p", "x": "Britain whilst it was without a monarch"}, {"t": "p", "x": "King Alfred the Great united the Anglo-Saxon kingdoms of England and defeated the Vikings."}, {"t": "p", "x": "Isambard Kingdom Brunel: engineer (bridges, trains, tunnels, ships)"}, {"t": "p", "x": "Dylan Thomas: Welsh poet (“Under Milk Wood” & “Do Not Go Gentle into that Good Night”)"}, {"t": "p", "x": "Robert Burns: Scottish poet (“The Bard”), Auld Lang Syne"}, {"t": "p", "x": "Richard Arkwright: Efficient and profitable factory owner during"}, {"t": "p", "x": "Industrial Revolution"}, {"t": "p", "x": "Sake Dean Mahomet: set up first curry house in Britain and introduced shampooing"}, {"t": "p", "x": "Florence Nightingale: founder of modern nursing"}, {"t": "p", "x": "Emmeline Pankhurst: Suffrage leader"}, {"t": "p", "x": "Rudyard Kipling: Indian-born author and poet. Work reflected idea that"}, {"t": "p", "x": "British empire was a force for good."}, {"t": "p", "x": "George and Robert Stevenson: famous pioneers of railway engines"}, {"t": "p", "x": "St Columba & St Augustine: led missionaries from Rome."}, {"t": "p", "x": "Sir Francis Drake: Elizabethan sailor who helped defeat Spanish Armada and who later sailed around the world."}, {"t": "p", "x": "Hugunots: French Protestants feeling prosecution settled in England pre-1720"}, {"t": "p", "x": "Henry VIII: famous for marrying 6 times and breaking away from"}, {"t": "p", "x": "Church of Rome so he could get a divorce. Wales was united with"}, {"t": "p", "x": "England under his rule. Wives (in order): (1) Catherine of Aragon (2)"}, {"t": "p", "x": "Anne Boleyn (3) Jane Seymour (4) Anne of Cleves (5) Catherine Howard"}, {"t": "p", "x": "(6) Catherine Parr"}, {"t": "p", "x": "Margaret Thatcher was first female PM and the longest serving PM of the"}, {"t": "p", "x": "20th century."}, {"t": "p", "x": "Alexander Fleming: Scottish doctor who discovered penicillin (1928)"}, {"t": "p", "x": "Clement Attlee: Churchill’s Deputy PM. Became PM in 1945."}, {"t": "p", "x": "Nationalised major industries and created NHS."}, {"t": "p", "x": "Mary Peters: Olympic athlete who promoted sport and tourism in"}, {"t": "p", "x": "Northern Ireland."}, {"t": "p", "x": "Roald Dahl: Welsh author (“Charlie and the Chocolate Factory” &"}, {"t": "p", "x": "“George’s Marvellous Medicine”)."}, {"t": "p", "x": "Sir Arthur Conan Doyle: Scottish author (“Sherlock Holmes”)"}]}]}]};

 to?", "a": "Only England, Scotland and Wales, not Northern Ireland", "d": ["England, Scotland, Wales and Northern Ireland", "England and Wales only", "The whole of the British Isles including Ireland"], "s": "Only England, Scotland and Wales, not Northern Ireland"}, {"t": "uk-nations", "q": "What are the Channel Islands and the Isle of Man called?", "a": "Crown dependencies — closely linked with the UK but not part of it", "d": ["British overseas territories", "Counties of England", "Independent members of the EU"], "s": "Crown dependencies"}, {"t": "uk-nations", "q": "St Helena and the Falkland Islands are examples of what?", "a": "British overseas territories linked to the UK but not part of it", "d": ["Crown dependencies", "Countries of the UK", "Commonwealth republics"], "s": "British overseas territories"}, {"t": "uk-nations", "q": "What is the status of the rest of Ireland (outside Northern Ireland)?", "a": "An independent country", "d": ["A Crown dependency", "Part of the UK", "A British overseas territory"], "s": "An independent country"}, {"t": "uk-nations", "q": "Where does the parliament that governs the UK sit?", "a": "Westminster", "d": ["Whitehall", "Windsor", "Stormont"], "s": "Westminster"}, {"t": "uk-nations", "q": "What do Scotland, Wales and Northern Ireland have?", "a": "Parliaments or assemblies of their own, with devolved powers in defined areas", "d": ["No governing bodies of their own", "Full independence from Westminster", "Only ceremonial councils"], "s": "Parliaments or assemblies of their own"}, {"t": "early-britain", "q": "What were the first people to live in Britain?", "a": "Hunter-gatherers, in what we call the Stone Age", "d": ["Farmers, in the Bronze Age", "Romans", "Anglo-Saxons"], "s": "Hunter-gatherers"}, {"t": "early-britain", "q": "When did Britain become permanently separated from the continent by the Channel?", "a": "About 10,000 years ago", "d": ["About 1,000 years ago", "About 100,000 years ago", "About 2,000 years ago"], ng to law — or an affirmation for those who prefer not to swear by God", "d": ["An oath of loyalty to Parliament, the constitution and the laws of the United Kingdom, sworn before a judge", "An oath to the Prime Minister", "An oath to the flag of the UK"], "s": "An oath of allegiance to His Majesty King Charles the Third, his Heirs and Successors, according to law"}, {"t": "constitution", "q": "What is the system of government in the UK?", "a": "A parliamentary democracy — voters in each constituency elect their member of Parliament (MP) to the House of Commons", "d": ["A presidential system", "Direct democracy by referendum", "A federal republic"], "s": "A parliamentary democracy"}, {"t": "constitution", "q": "Why is the House of Commons more important than the House of Lords?", "a": "Because its members are democratically elected — the Prime Minister and almost all the members of the cabinet are members of the House of Commons", "d": ["Because it is older than the Lords", "Because the monarch sits in it", "Because it has more members than any other parliament"], "s": "Because its members are democratically elected"}, {"t": "constitution", "q": "What do MPs do?", "a": "They represent everyone in their constituency, help create new laws, scrutinise and comment on what the government is doing, and debate important national issues", "d": ["They vote on taxes and the budget only, leaving the creation of new laws entirely to the House of Lords", "They run local councils", "They serve as judges"], "s": "They represent everyone in their constituency, help create new laws, scrutinise and…"}, {"t": "constitution", "q": "Who sits in the House of Lords?", "a": "Members not elected by the people: hereditary peers used to have the right, but since 1999 they no longer have an automatic right; most members are now life peers, appointed by the monarch on the advice of the Prime Minister — plus some senior judges and bishops of the Church of England", "d": ["MPs elected every five years", "Only hereditary aristocrats", "Judges and police chiefs only"], "s": "Members not elected by the people"}, {"t": "constitution", "q": "What can the House of Lords do?", "a": "It can suggest amendments or propose new laws, and it checks laws passed by the House of Commons to ensure they are fit for purpose — the Commons can overrule the Lords, but this does not happen often", "d": ["It can permanently block any law", "It controls the budget", "It appoints the Prime Minister"], "s": "It can suggest amendments or propose"}, {"t": "constitution", "q": "What does the Speaker of the House of Commons do?", "a": "The Speaker chairs debates and keeps order, making sure rules are followed — the Speaker is an MP, neutral in debates, chosen by other MPs in a secret ballot, and represents Parliament on ceremonial occasions", "d": ["The Speaker leads the largest party", "The Speaker writes new laws", "The Speaker is appointed by the monarch"], "s": "The Speaker chairs debates and keeps order,"}, {"t": "constitution", "q": "How often must a General Election be held?", "a": "At least every five years — if an MP dies or resigns, there is a fresh election, called a by-election, in his or her constituency", "d": ["Every four years exactly", "Every seven years", "Whenever the monarch decides"], "s": "At least every five years"}, {"t": "constitution", "q": "How are MPs elected?", "a": "Through a system called 'first past the post' — in each constituency, the candidate who gets the most votes is elected; the government is usually formed by the party that wins the majority of constituencies", "d": ["By proportional representation", "By the House of Lords", "By an electoral college"], "s": "Through a system called 'first past the"}, {"t": "constitution", "q": "Who appoints the Prime Minister?", "a": "The leader of the political party in power is appointed Prime Minister by the monarch — the PM appoints the members of the cabinet and has control over many important public appointments", "d": ["The Speaker appoints the PM", "MPs elect the PM directly by national vote", "The House of Lords chooses the PM"], "s": "The leader of the political party in power is"}, {"t": "constitution", "q": "Where does the Prime Minister live and work in London?", "a": "10 Downing Street", "d": ["Buckingham Palace as the main workplace", "The Tower of London", "The Old Bailey"], "s": "10 Downing Street"}, {"t": "constitution", "q": "What is the cabinet?", "a": "About 20 senior MPs appointed by the Prime Minister to be ministers in charge of departments — including the Chancellor of the Exchequer (economy), the Home Secretary (crime, policing and immigration) and the Foreign Secretary (managing relationships with foreign countries)", "d": ["A committee of the House of Lords", "The Prime Minister's private staff of civil servants who manage Downing Street and the government's papers", "A group of senior judges"], "s": "About 20 senior MPs appointed by the Prime Minister to be ministers in charge of departments"}, {"t": "constitution", "q": "What is the official opposition?", "a": "The second-largest party in the House of Commons — its leader appoints senior opposition MPs to be 'shadow ministers' and it points out what it sees as the government's failures and weaknesses", "d": ["Any party that disagrees with the monarch", "The party with the fewest seats", "Independent MPs only"], "s": "The second-largest party in the House of Commons"}, {"t": "constitution", "q": "What is Prime Minister's Questions?", "a": "An opportunity, once a week, when the Leader of the Opposition and other MPs can ask the Prime Minister questions in the House of Commons", "d": ["A radio phone-in with the PM", "The PM's annual speech", "A press conference at Downing Street"], "s": "An opportunity, once a week, when the"}, {"t": "constitution", "q": "What are civil servants?", "a": "People who carry out the work of government departments — they are chosen on merit, are politically neutral, and are professional rather than political appointees", "d": ["Elected officials in local councils", "Members of the ruling party", "The Prime Minister's political advisers"], "s": "People who carry out the work of government"}, {"t": "constitution", "q": "What do local authorities (councils) do, and how are they funded?", "a": "They provide a range of services in their areas — funded by money from central government and by local taxes, including 'council tax' which applies to all domestic properties", "d": ["They collect income tax", "They are funded entirely by parking fines", "They only maintain roads"], "s": "They provide a range of services in their areas"}, {"t": "constitution", "q": "When are local council elections held?", "a": "For most local authorities, elections are held in May every year — many councils appoint a mayor, who is the ceremonial leader of the council", "d": ["In November every two years", "Every five years with the General Election", "Only when the government decides"], "s": "For most local authorities, elections are held"}, {"t": "constitution", "q": "What powers have been devolved since 1997?", "a": "Some powers have been devolved to give people in Wales, Scotland and Northern Ireland more control over matters that directly affect them — there has been a Welsh Assembly and a Scottish Parliament since 1999", "d": ["All powers including defence and foreign affairs", "Only powers over tourism, culture and sport were devolved, with all other matters kept in Westminster", "No powers have been devolved"], "s": "Some powers have been devolved to give people in Wales, Scotland and Northern Ireland…"}, {"t": "constitution", "q": "Which policies remain under central UK government control even with devolution?", "a": "Policy and laws governing defence, foreign affairs, immigration, taxation and social security", "d": ["Health, education, planning and civil law, which are decided in Westminster for all four nations", "Roads and housing", "Culture and sport"], "s": "Policy and laws governing defence, foreign affairs, immigration, taxation and social security"}, {"t": "constitution", "q": "How many members does the Welsh government have and where does it sit?", "a": "The Welsh government and National Assembly for Wales are based in Cardiff — the Assembly has 60 members (AMs) and elections are held every four years; members can speak in either Welsh or English", "d": ["90 members in Swansea", "129 members in Cardiff", "60 members in Newport"], "s": "60 members (AMs), based in Cardiff"}, {"t": "constitution", "q": "How many members does the Scottish Parliament have and where does it sit?", "a": "The Scottish Parliament sits in Holyrood, Edinburgh, and has 129 members (MSPs), elected by a form of proportional representation", "d": ["60 members in Glasgow", "108 members in Edinburgh", "129 members in Stirling"], "s": "The Scottish Parliament sits in"}, {"t": "constitution", "q": "What can the Scottish Parliament legislate on?", "a": "All matters which are not specifically reserved to the UK Parliament — including civil and criminal law, health, education, planning and additional tax-raising powers", "d": ["Only education and health, with all other law-making powers reserved to the UK Parliament", "Only tourism and culture", "Defence and foreign affairs"], "s": "All matters which are not specifically reserved to the UK Parliament"}, {"t": "constitution", "q": "What is the Northern Ireland Assembly?", "a": "A devolved assembly established soon after the Belfast Agreement (Good Friday Agreement) in 1998, with 90 elected members known as MLAs (members of the Legislative Assembly); it sits at Stormont and ministerial offices are shared between the main parties", "d": ["A committee of the Irish parliament", "An assembly of 129 members in Belfast", "A consultative body appointed by the UK government, with 90 nominated members who advise the Secretary of State from Belfast city hall"], "s": "A devolved assembly established soon is closed to the public", "Only school groups may visit", "Visits require the Speaker's personal invitation"], "s": "Members of the public can listen to debates from"}, {"t": "rights-law", "q": "What is the 'rule of law'?", "a": "A fundamental principle: no person or organisation — including the government — is above the law; every person is subject to the same laws", "d": ["The monarch's right to make laws", "A law made by judges", "The right of Parliament to rule"], "s": "A fundamental principle"}, {"t": "rights-law", "q": "What are the two types of law in the UK?", "a": "Criminal law, which relates to crimes usually investigated by the police and punished by the courts, and civil law, used to settle disputes between individuals or groups", "d": ["Common law and church law", "Royal law and public law", "National law and county law"], "s": "Criminal law and civil law"}, {"t": "rights-law", "q": "Which of these is an example of a criminal offence?", "a": "Carrying a weapon — it is a criminal offence to carry a weapon of any kind, even if it is for self-defence; drugs, racial crime and selling tobacco to anyone under 18 are also criminal matters", "d": ["A dispute with a landlord about repairs", "A faulty goods complaint", "A disagreement over a debt"], "s": "Carrying a weapon"}, {"t": "rights-law", "q": "Which of these is an example of a civil law matter?", "a": "Housing disputes, consumer rights, disputes about faulty goods or services, employment rights and debt", "d": ["Selling tobacco to anyone under 18, carrying a weapon in public, and racially motivated crime", "Carrying a weapon", "Racially motivated crime"], "s": "Housing disputes, consumer rights, disputes about faulty goods or services, employment rights and debt"}, {"t": "rights-law", "q": "What are the duties of the police?", "a": "To protect life and property, prevent disturbances (keep the peace), and prevent and detect crime — the police are independent of the government", "d": ["To carry out government orders without question", "To decide guilt and sentence offenders", "To collect taxes and fines"], "s": "To protect life and property, prevent disturbances"}, {"t": "rights-law", "q": "Who are Police and Crime Commissioners (PCCs)?", "a": "Directly elected individuals, first elected by the public in November 2012 in England and Wales, responsible for the delivery of an efficient and effective police force — they set local police priorities and the local policing budget, and appoint the local Chief Constable", "d": ["Senior police officers promoted by the Home Office in 2012 to command regional forces across the whole UK", "Judges who oversee police conduct", "Council officials who fund the police"], "s": "Directly elected individuals, first elected by the public in November 2012 in England and…"}, {"t": "rights-law", "q": "What can you do if the police do something wrong?", "a": "Complain — to the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland, or the Police Ombudsman for Northern Ireland", "d": ["Nothing — police decisions are final", "Only sue them in the small claims court", "Write to the monarch"], "s": "Complain"}, {"t": "rights-law", "q": "What are judges (the judiciary) responsible for?", "a": "Interpreting the law and ensuring that trials are conducted fairly — the government cannot interfere; if judges find a public body is not respecting someone's legal rights or that a law is incompatible with the Human Rights Act, they can order it to change its practices", "d": ["Making new laws for Parliament", "Investigating crimes", "Running the police force"], "s": "Interpreting the law and ensuring that"}, {"t": "rights-law", "q": "What was the Human Rights Act 1998?", "a": "UK legislation that incorporated the European Convention on Human Rights into UK law — protecting rights such as life, liberty and security, a fair trial, freedom of thought, conscience and religion, and freedom of expression", "d": ["A law giving Parliament new powers to overrule the courts on questions of individual rights", "An EU regulation on citizenship", "A law about voting rights only"], "s": "UK legislation that incorporated the European Convention on Human Rights into UK law"}, {"t": "rights-law", "q": "What principles were included in the European Convention on Human Rights?", "a": "Rights including the right to life, prohibition of torture, prohibition of slavery and forced labour, the right to liberty and security, the right to a fair trial, and freedom of thought, conscience, religion and expression", "d": ["The right to free housing, guaranteed employment and a state pension for every resident of a member country", "The rules of the European Union single market", "The right to bear arms"], "s": "Rights including the right to life, prohibition of torture, prohibition of slavery and…"}, {"t": "rights-law", "q": "What is the law on domestic violence?", "a": "Brutality and violence in the home is a serious crime — anyone who is violent towards their partner, whether man or woman, can be prosecuted; it is also a crime to force anyone, including a spouse, to have sex", "d": ["It is a private family matter", "Only physical injury counts as a crime", "It is a civil matter only"], "s": "Brutality and violence in the home is a"}, {"t": "rights-law", "q": "What does the law say about female genital mutilation (FGM)?", "a": "FGM, also known as cutting or female circumcision, is illegal in the UK — it is also illegal to take a girl or woman abroad for the practice", "d": ["It is legal if done abroad", "It is only banned for children under 16", "It is a civil matter"], "s": "FGM, also known as cutting or female"}, {"t": "rights-law", "q": "What is the law on forced marriage?", "a": "A marriage should be entered into with the full and free consent of both people involved — forced marriage is where one or both parties do not or cannot give consent; Forced Marriage Protection Orders can be made, and breaching an order can lead to imprisonment", "d": ["Arranged marriages are illegal", "Forced marriage is only illegal for under-18s", "Consent is only required from the man"], "s": "A marriage should be entered into with the full"}, {"t": "rights-law", "q": "What is the difference between an arranged marriage and a forced marriage?", "a": "Arranged marriages, where both parties agree to the marriage, are acceptable in the UK; forced marriage, without free consent, is not", "d": ["There is no difference in law", "Arranged marriages are also banned", "Forced marriages are legal if the families agree"], "s": "Arranged marriages, where both parties agree to the"}, {"t": "rights-law", "q": "How is income tax collected?", "a": "For most people it is taken automatically from wages by the employer through PAYE (Pay As You Earn); self-employed people must complete a self-assessment tax return — income tax is collected by HM Revenue & Customs (HMRC)", "d": ["Everyone pays at the local council office", "It is added to shop prices", "It is collected quarterly by the Bank of England, which sends every worker an annual bill based on their wages"], "s": "For most people it is taken automatically from wages by the employer through PAYE (Pay As You Earn)"}, {"t": "rights-law", "q": "What does income tax money pay for?", "a": "Government services such as roads, education, police and the armed forces", "d": ["Only the Royal Family", "Only the National Health Service and the state retirement pension, which are funded entirely from income tax", "Only Parliament's costs"], "s": "Government services such as roads, education, police and the armed forces"}, {"t": "rights-law", "q": "What are National Insurance contributions?", "a": "Payments made by almost everybody who works — the money pays for state benefits and services such as the state retirement pension and the National Health Service; employees have them deducted from pay, and self-employed people pay them themselves", "d": ["Voluntary savings for retirement", "A tax on property", "Payments for private health insurance"], "s": "Payments made by almost everybody who works"}, {"t": "rights-law", "q": "What is a National Insurance number?", "a": "A unique personal account number that ensures your National Insurance contributions and tax are recorded against your name only — young people receive one just before their 16th birthday, and you need one when you start work", "d": ["A driving licence number", "A passport number", "A voter registration number that you must show at the polling station before you are allowed to vote"], "s": "A unique personal account number that ensures your National Insurance contributions and…"}, {"t": "rights-law", "q": "At what age can you drive a car or motorcycle in the UK?", "a": "At 17 — you must have a driving licence and pass a driving test which tests both knowledge and practical skills; at 16 you can ride a moped", "d": ["At 18 for cars and 17 for mopeds", "At 16 for cars", "At 21 for all vehicles"], "s": "At 17"}, {"t": "rights-law", "q": "Until what age can drivers use their driving licence?", "a": "Until they are 70 years old — after that, the licence is valid for three years at a time", "d": ["Until 65, then annually", "For life, with no renewal", "Until 75, then five years at a time"], "s": "Until they are 70 years old"}, {"t": "rights-law", "q": "What must you do if your vehicle is over three years old?", "a": "Take it for a Ministry of Transport (MOT) test every year — it is an offence not to have an MOT certificate; you must also have valid motor insurance and pay the vehicle tax", "d": ["Replace it with a newer vehicle", "Take it for an MOT every five years", "Register it with the police"], "s": "Take it for a Ministry of Transport"}, {"t": "rights-law", "q": "What should drivers with a licence from another country do?", "a": "If your licence is from an EU country, Iceland, Liechtenstein or Norway you can drive as long as your licence is valid; from any other country you may drive for up to 12 months, then you must get a UK full driving licence", "d": ["Any foreign licence remains valid indefinitely in the UK, provided the driver registers it within 12 months of arriving", "All visitors must retake a UK test immediately", "Foreign licences are never valid"], "s": "If your licence is from an EU country, Iceland, Liechtenstein or Norway you can drive as long as your licence is valid"}, {"t": "courts", "q": "Which courts deal with minor criminal cases in England, Wales and Northern Ireland?", "a": "Magistrates' Courts — magistrates (Justices of the Peace) are members of the local community who usually work unpaid, without legal qualifications, and receive training", "d": ["Crown Courts with juries", "County Courts", "Sheriff Courts"], "s": "Magistrates' Courts"}, {"t": "courts", "q": "How are minor criminal offences dealt with in Scotland?", "a": "In Justice of the Peace Courts, dealt with by a justice of the peace or by stipendiary magistrates in Glasgow", "d": ["In Magistrates' Courts in front of three unpaid magistrates, exactly as in England and Wales", "In the Sheriff Court with a jury", "By the procurator fiscal alone"], "s": "In Justice of the Peace Courts, dealt with by a justice of the peace or by stipendiary…"}, {"t": "courts", "q": "Where are serious criminal offences tried in England, Wales and Northern Ireland?", "a": "In a Crown Court, in front of a judge and a jury of 12 members of the public", "d": ["In a Magistrates' Court", "In the High Court with 15 jurors", "In a County Court"], "s": "In a Crown Court"}, {"t": "courts", "q": "How many members does a jury have in Scotland?", "a": "15 — serious cases in Scotland are heard in a Sheriff Court with either a sheriff or a sheriff with a jury, and the most serious cases, such as murder, are heard at a High Court with a judge and jury", "d": ["12", "10", "20"], "s": "15"}, {"t": "courts", "q": "How is a jury chosen?", "a": "Members of the public are chosen at random from the local electoral register — anyone on the register aged 18 to 70 can be asked to serve", "d": ["Volunteers aged 21 to 65 apply to the court and are selected after an interview with the judge", "Judges pick experienced jurors", "Lawyers select their own jurors"], "s": "Members of the public are chosen at random from the local electoral register"}, {"t": "courts", "q": "What verdicts can a jury give?", "a": "The jury decides the verdict of 'guilty' or 'not guilty' based on the evidence — in Scotland a third verdict of 'not proven' is possible; if guilty, the judge decides the penalty", "d": ["Guilty, not guilty or pardoned everywhere", "Only guilty or not proven", "The judge decides the verdict"], "s": "The jury decides the verdict of 'guilty' or"}, {"t": "courts", "q": "How are young people aged 10 to 17 dealt with by the courts?", "a": "Usually in a Youth Court, in front of up to three specially trained magistrates or a District Judge — the most serious cases go to the Crown Court; the young person's parents or carers must attend, members of the public are not admitted, and the name or photographs of the accused cannot be published", "d": ["In an ordinary Magistrates' Court, in public, with their names published in the local newspaper", "In a Crown Court with a jury of teenagers", "They cannot be prosecuted"], "s": "Usually in a Youth Court"}, {"t": "courts", "q": "How does Scotland deal with children and young people who have committed an offence?", "a": "Through the Children's Hearings System; Northern Ireland has a system of youth conferencing to consider how a child should be dealt with", "d": ["Through Youth Courts in front of three specially trained magistrates, exactly as in England, Wales and Northern Ireland", "Through the Sheriff Court only", "Children are always tried as adults"], "s": "Through the Children's Hearings System"}, {"t": "courts", "q": "Which courts deal with civil disputes?", "a": "County Courts in England, Wales and Northern Ireland; the Sheriff Court in Scotland — more serious civil cases, such as when a large amount of compensation is being claimed, go to the High Court (Court of Session in Scotland)", "d": ["Crown Courts in England, Wales and Northern Ireland; the Justice of the Peace Court in Scotland", "Magistrates' Courts", "Youth Courts"], "s": "County Courts in England, Wales and Northern Ireland; the Sheriff Court in Scotland"}, {"t": "courts", "q": "What is the small claims procedure?", "a": "An informal way of settling minor disputes without spending a lot of time and money on a lawyer — used for claims of less than £10,000 in England and Wales and £5,000 in Scotland and Northern Ireland; claims can also be issued online through Money Claims Online", "d": ["A criminal procedure for petty theft", "Claims under £1,000 in all parts of the UK", "A procedure requiring a solicitor"], "s": "An informal way of settling minor disputes"}, {"t": "courts", "q": "What are solicitors?", "a": "Trained lawyers who give advice on legal matters, take action for their clients and represent them in court — it is important to find out which aspects of law a solicitor specialises in and check their charges", "d": ["Unpaid volunteers in Magistrates' Courts", "Court officials employed by the government to advise judges and manage the daily business of the courts", "Police lawyers"], "s": "Trained lawyers who give advice on legal matters, take action for their clients and represent them in court"}, {"t": "international", "q": "What is the Commonwealth?", "a": "An association of countries that support each other and work together towards shared goals in democracy and development — most members were once part of the British Empire; the monarch is its ceremonial head and it currently has 54 member states", "d": ["A military alliance of former colonies whose members have agreed to defend each other if attacked", "A trade union of European states", "The UK's overseas territories"], "s": "An /* ===================== persistence ===================== */
const LS_KEY = "liuk-study-v1";
const DAY = 86400000;
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.cards) return s; }catch(e){}
  return { cards:{}, streak:{last:0,count:0}, chaptersDone:[], testHistory:[], feynman:{},
           settings:{theme:matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light", progressive:false, newPerDay:10} };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast("Could not save progress (storage full?)"); } }
function cardState(id){ return S.cards[id] || (S.cards[id] = {ef:2.5,int:0,reps:0,next:0,seen:0,lapses:0}); }

/* ===================== SM-2 spaced repetition ===================== */
function rate(id, q){                       // q = 0..5 recall quality
  const c = cardState(id); c.seen++;
  if(q < 3){ c.reps = 0; c.int = 1; c.lapses++; }
  else{
    if(c.reps === 0) c.int = 1;
    else if(c.reps === 1) c.int = 6;
    else c.int = Math.round(c.int * c.ef);
    c.reps++;
  }
  c.ef = Math.max(1.3, c.ef + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
  c.next = Date.now() + c.int * DAY;
  bumpStreak(); save();
}
function bumpStreak(){
  const today = Math.floor(Date.now()/DAY);
  if(S.streak.last === today) return;
  S.streak.count = (S.streak.last === today-1) ? S.streak.count+1 : 1;
  S.streak.last = today;
}
function dueCards(){ const now = Date.now(); return FACTS.map((f,i)=>i).filter(i=>{const c=S.cards["f"+i]; return c && c.seen>0 && c.next<=now;}); }
function newCards(){ return FACTS.map((f,i)=>i).filter(i=>{const c=S.cards["f"+i]; return !c || c.seen===0;}); }

/* ===================== helpers ===================== */
function $(s){ return document.querySelector(s); }
function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function seededRandom(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rand = seededRandom(seed);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
const MOCK_COUNT = 25;
function pickForMock(n, seed, chFilter){
  let pool = FACTS.map((f,i)=>i).filter(i=>FACTS[i].d && FACTS[i].d.length===3);
  if(chFilter) pool = pool.filter(i=>TOPICS[FACTS[i].t].ch===chFilter);
  const byTopic={};
  seededShuffle(pool, seed).forEach(i=>{ (byTopic[FACTS[i].t]=byTopic[FACTS[i].t]||[]).push(i); });
  const buckets=seededShuffle(Object.values(byTopic), seed+17);
  const picked=[];
  while(picked.length<n && buckets.some(b=>b.length)){
    for(const b of buckets){ if(picked.length>=n) break; if(b.length) picked.push(b.pop()); }
  }
  return seededShuffle(picked, seed+31);
}
function bestMockScore(mockNum){
  const scores = S.testHistory.filter(h=>h.mock===mockNum).map(h=>h.score);
  return scores.length ? Math.max(...scores) : null;
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function fmtWhen(ts){
  if(!ts) return "—";
  const d = ts - Date.now();
  if(d <= 0) return "now";
  if(d < DAY) return "in " + Math.max(1,Math.round(d/3600000)) + " h";
  return "in " + Math.round(d/DAY) + " d";
}
function chapterUnlocked(num){
  if(!S.settings.progressive) return true;
  if(num<=1) return true;
  return S.chaptersDone.includes(num-1) || S.chaptersDone.includes(num);
}
function chapterFacts(ch){ return FACTS.map((f,i)=>i).filter(i=>TOPICS[FACTS[i].t].ch===ch); }
function highlightFacts(t){ return esc(t).replace(/\b(1?\d{3}(?:–|-)\d{2,4}|[12]\d{3}|AD \d+|\d+ BC)\b/g,'<mark>$1</mark>'); }

/* ===================== flashcards (SM-2 session) ===================== */
function startSession(chFilter){
  const pool = i => !chFilter || TOPICS[FACTS[i].t].ch===chFilter;
  const due = shuffle(dueCards().filter(pool));
  const fresh = shuffle(newCards().filter(pool)).slice(0, Math.max(5, S.settings.newPerDay));
  // interleave: ~1 new card per 4 due cards (≈20%), new-only if nothing due
  const queue=[]; let d=0,n=0;
  while(d<due.length || n<fresh.length){
    for(let k=0;k<4 && d<due.length;k++) queue.push(due[d++]);
    if(n<fresh.length) queue.push(fresh[n++]);
  }
  if(!queue.length){ session=null; toast(chFilter?"No cards available for this chapter right now.":"Nothing to review right now — come back later."); render(); return; }
  session = { queue: queue.slice(0, 40), pos:0, revealed:false, done:0, again:[] };
  render();
}

  }
  if(session.pos>=session.queue.length){
    v.innerHTML=`<div class="tile" style="text-align:center"><h3>Session complete 🎉</h3>
      <p>You reviewed <b>${session.done}</b> cards. Streak: <b>${S.streak.count} day${S.streak.count===1?"":"s"}</b>.</p>
      <p class="muted">${dueCards().length? dueCards().length+" cards still due — keep going?" : "Nothing else due right now. Come back tomorrow to keep the intervals growing."}</p>
      ${dueCards().length?'<button class="btn red" id="more">Continue reviewing</button>':""}

  // Build a stable shuffled option list for this card (so "Which of these…" works)

    const seed = 9000 + i * 17 + (session.pos||0);
    return seededShuffle(
      [{x: f.s || f.a, ok:true}, ...f.d.map(d=>({x:d, ok:false}))],
      seed
    );
  })();
  const optsHtml = cardOpts ? `<div class="card-opts" style="margin-top:14px;text-align:left">

  v.innerHTML=`<p class="qnum">Card ${session.pos+1} / ${session.queue.length}</p>

      ${session.revealed?`<div class="a" style="margin-top:12px">Correct answer: ${esc(f.a)}</div>`:""}</div>
    ${session.revealed?
      `<p class="muted" style="text-align:center;margin:4px 0">How well did you know it?</p>
       <div class="rate">
         ${[["0","blank"],["1","wrong"],["2","almost"],["3","hard"],["4","good"],["5","easy"]].map(([n,l])=>`<button class="r${n}" data-q="${n}">${n}<small>${l}</small></button>`).join("")}

  if(!session.revealed) $("#reveal").onclick=()=>{session.revealed=true; render();};
  else document.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
    const q=+b.dataset.q; rate("f"+i,q); session.done++;
    if(q<3) session.queue.push(i);          // failed cards return this session
    session.pos++; session.revealed=false; render();
  });
}

/* ============ Feynman "explain it yourself" prompts ============ */
function checkItems(){
  const out=[];
  HANDBOOK.chapters.forEach(c=>c.sections.forEach((s,si)=>{
    s.blocks.forEach((b,bi)=>{ if(b.t==="check") out.push({ch:c.num, sec:si, title:s.title, x:b.x, id:c.num+"."+si+"."+bi}); });
  }));
  return out;
}
function renderFeynman(el){
  const items=checkItems();
  el.innerHTML=`<h3 style="margin-top:18px">🧠 Explain it yourself</h3>
    <p class="muted">The Feynman technique: pick one of the handbook's ${items.length} “Check that you understand” points, explain it in your own words, then compare with the official text.</p>
    <select id="feySel" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)">
      ${items.map((it,k)=>`<option value="${k}">Ch ${it.ch} · ${esc(it.x.length>60?it.x.slice(0,60)+"…":it.x)}</option>`).join("")}</select>
    <textarea id="feyTxt" placeholder="Type your explanation here…" style="margin-top:8px"></textarea>
    <button class="btn small" id="feyGo">Compare with the handbook</button>
    <div id="feyOut"></div>`;
  const sel=$("#feySel"), txt=$("#feyTxt");
  sel.onchange=()=>{ txt.value=S.feynman[items[sel.value].id]||""; $("#feyOut").innerHTML=""; };
  txt.value=S.feynman[items[0].id]||"";
  txt.oninput=()=>{ S.feynman[items[sel.value].id]=txt.value; save(); };
  $("#feyGo").onclick=()=>{
    const it=items[sel.value];
    S.feynman[it.id]=txt.value; save();
    const chObj=HANDBOOK.chapters.find(c=>c.num===it.ch);
    const sec=chObj.sections[it.sec];
    const words=it.x.toLowerCase().split(/\W+/).filter(w=>w.length>3 && !/^(that|this|with|about|between|which|what|when|does|have|been|from|they|their)$/.test(w));
    const score=b=>words.reduce((a,w)=>a+(b.x.toLowerCase().includes(w)?1:0),0);
    // 1) best match inside the item's own section
    let scored=sec.blocks.filter(b=>b.t==="p").map(b=>({b,s:score(b)})).sort((a,b)=>b.s-a.s).slice(0,2).filter(x=>x.s>0);
    // 2) otherwise search the whole chapter (some boxes summarise earlier sections)
    if(!scored.length){
      const all=[]; chObj.sections.forEach(s2=>s2.blocks.forEach(b=>{ if(b.t==="p") all.push({b,s:score(b)}); }));
      scored=all.sort((a,b)=>b.s-a.s).slice(0,2).filter(x=>x.s>=2);
    }
    // 3) last resort: the paragraphs just before the box — they are what it refers to
    if(!scored.length){
      const bi=sec.blocks.findIndex(b=>b.t==="check"&&b.x===it.x);
      for(let k=(bi<0?sec.blocks.length:bi)-1;k>=0&&scored.length<2;k--)
        if(sec.blocks[k].t==="p") scored.unshift({b:sec.blocks[k],s:0});
    }
    $("#feyOut").innerHTML=`<div class="tile"><b style="color:var(--red)">Official handbook wording — “${esc(it.x)}” (${esc(it.title)}):</b>
      ${scored.map(x=>`<p>${esc(x.b.x)}</p>`).join("")||`<p class="muted">Open the section “${esc(it.title)}” in the Reader for the full text.</p>`}
      <button class="btn small ghost" id="feyRead">Open this section in the Reader</button></div>`;
    $("#feyRead").onclick=()=>{ readerPos={ch:it.ch,sec:it.sec}; VIEW="read"; render(); };
    $("#feyOut").scrollIntoView({behavior:"smooth",block:"start"});
  };
}

/* ===================== practice test ===================== */
function startTest(n, chFilter, mockNum){
  n = n || 24;
  const seed = mockNum ? (1000 + mockNum * 7919) : ((Date.now() ^ (Math.random()*1e9)) >>> 0);
  const picked = pickForMock(n, seed, chFilter);
  const optSeedBase = seed + 99;
  testRun={ qs: picked.map((i,qi)=>{
              const opts = seededShuffle(
                [{x:FACTS[i].s||FACTS[i].a,ok:true}, ...FACTS[i].d.map(d=>({x:d,ok:false}))],
                optSeedBase + qi * 13
              );
              return {i, opts, sel:null};
            }),
            pos:0, chFilter:chFilter||null, mini:!!chFilter, mock: mockNum||null,
            timed: !chFilter && n===24, remaining: 45*60, startedAt: Date.now(), done:false };
  if(testRun.timed) startTimer();
  VIEW="test"; render();
}
let timerId = null;
function startTimer(){
  if(timerId) clearInterval(timerId);
  timerId = setInterval(()=>{
    if(!testRun || testRun.done || !testRun.timed){ clearInterval(timerId); timerId=null; return; }
    testRun.remaining = Math.max(0, testRun.remaining - 1);
    if(testRun.remaining <= 0){ clearInterval(timerId); timerId=null; finishTest(); toast("Time is up — paper submitted"); return; }
    const el = document.getElementById("timer");
    if(el) el.textContent = fmtTimer(testRun.remaining);
  }, 1000);
}
function fmtTimer(s){
  const m = Math.floor(s/60), r = s%60;
  return m + ":" + String(r).padStart(2,"0");
}
function renderTest(v){
  if(!testRun){
    const hist=S.testHistory.slice(-6).reverse();
    const mockBtns = Array.from({length:MOCK_COUNT},(_,i)=>{
      const n=i+1, best=bestMockScore(n);
      const label = best==null ? "Not taken" : (best+"/24"+(best>=18?" pass":""));
      const cls = best==null ? "" : (best>=18 ? " done" : "");
      return `<button class="chip mock-chip${cls}" data-mock="${n}" style="min-width:72px;text-align:center;display:inline-flex;flex-direction:column;gap:2px;padding:8px 10px;height:auto">
        <span style="font-weight:700">Mock ${n}</span>
        <span class="muted" style="font-size:11px">${label}</span>
      </button>`;
    }).join("");
    v.innerHTML=`<div class="tile"><h3>Mock exams</h3>
      <p class="muted">Use mocks after you have read the handbook chapters. Question bank: <b>${FACTS.length} questions</b> from the official handbook. Each full paper is <b>24 questions</b> in the real exam format. Pass mark <b>75%</b> (18 of 24). Numbered mocks always use the same questions so you can retake and track improvement. Random draws a fresh paper every time.</p>
      <button class="btn red" id="goRandom">Start a random 24-question mock (timed)</button>
      <h4 style="margin:18px 0 8px">Fixed mock papers</h4>
      <p class="muted" style="margin-bottom:8px">Same questions every time you open that number — good for measuring progress.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${mockBtns}</div>
      ${hist.length?`<h4 style="margin-top:18px">Recent results</h4>${hist.map(h=>{
        const tag = h.mock ? ("Mock "+h.mock) : (h.mini ? "Chapter quiz" : "Random");
        return `<p class="muted">${new Date(h.at).toLocaleDateString()} — <b>${h.score}/${h.total}</b> ${h.score/h.total>=0.75?"pass":"below 75%"} · ${tag}</p>`;
      }).join("")}`:""}
    </div>`;
    $("#goRandom").onclick=()=>startTest(24);
    v.querySelectorAll("[data-mock]").forEach(b=>b.onclick=()=>startTest(24, null, +b.dataset.mock));
    return;
  }
  if(testRun.done){ return renderTestResult(v); }
  const q=testRun.qs[testRun.pos], f=FACTS[q.i];
  const label = testRun.mini ? " — chapter quiz" : (testRun.mock ? (" · Mock "+testRun.mock) : " · random");
  const timerHtml = testRun.timed ? `<span id="timer" style="float:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)">${fmtTimer(testRun.remaining)}</span>` : "";
  v.innerHTML=`<p class="qnum">Question ${testRun.pos+1} of ${testRun.qs.length}${label}${timerHtml}</p>
    <div class="pbar"><i style="width:${Math.round(100*testRun.pos/testRun.qs.length)}%"></i></div>
    <div class="tile"><h3 style="font-size:17px">${esc(f.q)}</h3>
      ${q.opts.map((o,k)=>`<button class="opt ${q.sel===k?"sel":""}" data-k="${k}">${esc(o.x)}</button>`).join("")}
    </div>
    <div style="display:flex;gap:8px">
      ${testRun.pos>0?'<button class="btn ghost" id="pv">Back</button>':""}
      <button class="btn" id="nx" ${q.sel===null?"disabled style='opacity:.5'":""}>${testRun.pos===testRun.qs.length-1?"Finish test":"Next"}</button>
    </div>
    <button class="btn ghost" id="quit" style="margin-top:14px">Abandon test</button>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ q.sel=+b.dataset.k; render(); });
  const pv=$("#pv"); if(pv) pv.onclick=()=>{testRun.pos--; render();};
  $("#nx").onclick=()=>{ if(testRun.qs[testRun.pos].sel===null) return;
    if(testRun.pos===testRun.qs.length-1){ finishTest(); } else { testRun.pos++; render(); } };
  $("#quit").onclick=()=>{ if(confirm("Abandon this test?")){ if(timerId){clearInterval(timerId);timerId=null;} testRun=null; render(); } };
}
function finishTest(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  let score=0;
  testRun.qs.forEach(q=>{ if(q.opts[q.sel] && q.opts[q.sel].ok) score++; });
  testRun.score=score; testRun.done=true;
  S.testHistory.push({at:Date.now(), score, total:testRun.qs.length, mini:testRun.mini, mock:testRun.mock||null});
  if(testRun.mini && score/testRun.qs.length>=0.75 && testRun.chFilter){
    if(!S.chaptersDone.includes(testRun.chFilter)) S.chaptersDone.push(testRun.chFilter);
    toast(`Chapter ${testRun.chFilter} quiz passed — next chapter unlocked!`);
  } else if(testRun.mock){
    toast(score>=18 ? (`Mock ${testRun.mock} passed`) : (`Mock ${testRun.mock}: ${score}/24 — keep practising`));
  }
  bumpStreak(); save(); render();
}
function renderTestResult(v){
  const t=testRun, pass=t.score/t.qs.length>=0.75;
  const wrong=t.qs.filter(q=>!(q.opts[q.sel]&&q.opts[q.sel].ok));
  v.innerHTML=`<div class="tile" style="text-align:center">
      <div class="result-big ${pass?"pass":"fail"}">${t.score}/${t.qs.length}</div>
      <h3>${pass?"PASS — above the 75% mark":"Not yet — the pass mark is 75%"}</h3>
      <p class="muted">${t.mock?("Mock "+t.mock+" · "):""}${pass?"On test day you will have 45 minutes for 24 questions.":"Review the answers below, then study the cards — the algorithm will drill your weak spots."}</p>
      <button class="btn red" id="again">${t.mock?("Retake Mock "+t.mock):"Take another test"}</button>
      <button class="btn ghost" id="home">Done</button></div>
    ${wrong.length?`<h3>Review your ${wrong.length} incorrect answer${wrong.length===1?"":"s"}</h3>`:"<p class='tile'>Perfect score — nothing to review! 🏆</p>"}
    ${wrong.map(q=>{const f=FACTS[q.i];return `<div class="tile">
        <p style="font-weight:650;margin:0 0 8px">${esc(f.q)}</p>
        <p class="muted" style="margin:2px 0">Your answer: <span style="color:var(--red)">${esc(q.opts[q.sel].x)}</span></p>
        <p style="margin:2px 0">Correct answer: <b style="color:var(--ok)">${esc(f.a)}</b></p>
        <p class="muted" style="margin-top:6px">Topic: ${TOPICS[f.t].n} (Chapter ${TOPICS[f.t].ch})</p></div>`;}).join("")}`;
  const againMock = t.mock, againMini = t.mini, againCh = t.chFilter;
  $("#again").onclick=()=>{
    if(againMock) startTest(24, null, againMock);
    else if(againMini && againCh) startTest(6, againCh);
    else startTest(24);
  };
  $("#home").onclick=()=>{testRun=null; VIEW="dash"; render();};
}

/* ===================== progress ===================== */
function renderProg(v){
  const topics=Object.keys(TOPICS);
  const rows=topics.map(t=>{
    const ids=FACTS.map((f,i)=>i).filter(i=>FACTS[i].t===t);
    const m=ids.reduce((a,i)=>{const c=S.cards["f"+i]; return a+(c?Math.min(1,c.int/21):0);},0);
    return {t, n:TOPICS[t].n, ch:TOPICS[t].ch, pct: ids.length?Math.round(100*m/ids.length):0, count:ids.length};
  });
  const tests=S.testHistory.slice(-10).reverse();
  v.innerHTML=`<div class="tile"><h3>Mastery by topic</h3>
    ${rows.map(r=>`<div style="margin:10px 0">
      <div style="display:flex;justify-content:space-between;font-size:13.5px"><span><b>Ch ${r.ch}</b> · ${r.n}</span><span class="muted">${r.pct}%</span></div>
      <div class="pbar" style="margin-top:3px"><i style="width:${r.pct}%"></i></div></div>`).join("")}
  </div>
  <div class="tile"><h3>Chapters completed</h3>
    ${HANDBOOK.chapters.filter(c=>c.num<=5).map(c=>`<span class="chip ${S.chaptersDone.includes(c.num)?"done":""}">Ch ${c.num} ${S.chaptersDone.includes(c.num)?"✓":""}</span>`).join("")}
  </div>
  <div class="tile"><h3>Practice test history</h3>
    ${tests.length?tests.map(h=>`<p class="muted">${new Date(h.at).toLocaleString()} — <b>${h.score}/${h.total}</b> ${h.score/h.total>=0.75?"✅ pass":"❌"}${h.mini?" (chapter quiz)":""}</p>`).join(""):"<p class='muted'>No tests taken yet.</p>"}
  </div>
  <div class="tile"><h3>Backup & data</h3>
    <p class="muted">Your progress lives only in this browser. Export a backup before switching devices.</p>
    <button class="btn small" id="exp">⬇ Export progress (JSON)</button>
    <button class="btn small ghost" id="imp">⬆ Import backup</button>
    <input type="file" id="impFile" accept="application/json" class="hidden">
    <button class="btn small ghost" id="wipe" style="color:var(--red);border-color:var(--red)">Reset all progress</button>
  </div>`;
  $("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="life-in-the-uk-progress.json"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("#imp").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=e=>{
    if(!e.target.files || !e.target.files[0]) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.cards) throw 0; S=d; save(); applyTheme(); toast("Backup imported ✓"); render(); }catch(_){ toast("That file is not a valid backup."); } };
    r.readAsText(e.target.files[0]);
  };
  $("#wipe").onclick=()=>{ if(confirm("Really delete ALL progress? This cannot be undone.")){ localStorage.removeItem(LS_KEY); S=load(); toast("Progress reset."); render(); } };
}

/* ===================== boot ===================== */
applyTheme(); render();
</script>
